# Candidate-only authoring transaction for the network-basics review.
# Main is untouched. Permanent tests remain read-only.
name: Verify network basics correspondence candidate
on:
  push:
    branches: [review/network-basics-correspondence]
    paths: [.github/workflows/connect-network-basics-candidate.yml]
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Connect only the reviewed network basics sources
        run: |
          mkdir -p review-output
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          expected={
            'scripts/modules.mjs':'48d3bc683967da92a813fd17c400ed52b205dccb',
            'src/experiences-network.js':'6608df8786bfc24a2d5452c43b7d0d1bc8b50f2e',
            'index.html':'d367bbe4624b7777e42dafbb614e327683a51549'
          }
          for path,sha in expected.items():
              actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert actual==sha,(path,actual)
          def replace(path,old,new):
              p=Path(path);s=p.read_text()
              assert s.count(old)==1,(path,'expected one match',old)
              p.write_text(s.replace(old,new,1))
          replace('scripts/modules.mjs',
            '"experiences-database-review"];',
            '"experiences-database-review","experiences-network-basics"];')
          replace('scripts/modules.mjs',
            '"experiences-database-review-widgets"];',
            '"experiences-database-review-widgets","experiences-network-basics-widgets"];')
          replace('scripts/modules.mjs',
            '"experiences-database-review","scrollbars"];',
            '"experiences-database-review","experiences-network-basics","scrollbars"];')
          old="""d('n04-subnet','同じ境界でアドレスを区切る','見た目の最初の数字だけで、同じネットワークとは判断できません。','プレフィックス長が、ネットワークの部分とホストの部分を分けます。二つのアドレスへ同じマスクを適用し、残る部分を比較します。',[A('ledger','ビットの境界とANDの対応',['ip','peer','prefix'])]);"""
          new="""X.define('n04-subnet','同じ32bitに同じマスクを掛け、境界の1bitまで対応させます。',[
 C('communication','同じ境界でアドレスを区切る','同じネットワークかどうかを、どのbitで判断しているのでしょうか。','二つのIPv4とmaskを同じ32bitの位置で縦に並べます。選んだbitのANDと、最終的なnetwork値を対応させ、/24と/25の違いを直接比較してください。',[A('subnet-bits','32bitとmaskを同じ位置で読む')]),
 C('calculation','従来の計算記録','ネットワーク値と配送判断を順番に読むには？','直接操作で境界を確認した後、従来の途中計算も残しています。',[A('ledger','ビットの境界とANDの対応',['ip','peer','prefix'])])
]);"""
          replace('src/experiences-network.js',old,new)
          old="""d('n05-arp','次の相手のMACがないとき','宛先IPと、そのリンクで使うMACを結び付ける必要があります。','同じLANなら宛先自身、別LANならまずgatewayのMACを調べます。ブロードキャストで聞く範囲と、受け取った対応を保存する場所を区別します。',[A('timeline','問い合わせ・返信・表の更新',['cached','remote'],{},{advance:'次の問い合わせ／応答を届ける'})]);"""
          new="""X.define('n05-arp','最終IPと、同一リンク上で使う次ホップMACを分けます。',[
 C('communication','次の相手のMACがないとき','別ネットワークへ送る場合、ARPで最終宛先のMACを聞くのでしょうか。','同じLANと別ネットワークを切り替え、ARP Request・Reply・実際のEthernet送信を個別に操作します。別ネットワークでは最終IPを変えず、gatewayのMACを使うことを確認してください。',[A('arp-next-hop','最終IPと次ホップMACを対応させる')]),
 C('calculation','従来の問い合わせ記録','キャッシュ有無でメッセージ列を比較するには？','直接操作とは別に、固定条件の問い合わせ・返信・表更新も残しています。',[A('timeline','問い合わせ・返信・表の更新',['cached','remote'],{},{advance:'次の問い合わせ／応答を届ける'})])
]);"""
          replace('src/experiences-network.js',old,new)
          old="""d('n05-dhcp','まだ設定のない端末から始める','貸してよい候補と、貸し出したことが確定した状態は違います。','端末とサーバーの貸出し表を並べて読みます。Discover、Offer、Request、ACKのそれぞれで、何が決まったかを確認してください。',[A('timeline','端末の設定と貸出し表',['clients','pool'],{},{advance:'次の設定メッセージを届ける'})]);"""
          new="""X.define('n05-dhcp','候補・要求・確定済みリースを別の状態として扱います。',[
 C('communication','まだ設定のない端末から始める','OFFERを受け取った時点で、そのIPは端末へ設定済みでしょうか。','DISCOVER・OFFER・REQUEST・ACKを一つずつ届けます。端末側の設定、サーバー側の未使用候補、提案中の値、確定済みリースを同時に読み、プール不足も試してください。',[A('dhcp-leases','候補と確定済みリースを分けて進める')]),
 C('calculation','従来のDORA計算記録','端末数とプール数を固定して全体を見るには？','直接操作とは別に、従来のメッセージ列と成功数の計算も残しています。',[A('timeline','端末の設定と貸出し表',['clients','pool'],{},{advance:'次の設定メッセージを届ける'})])
]);"""
          replace('src/experiences-network.js',old,new)
          old="""d('n06-ipv6','省略した0を正しく戻す','短く書けても、元のアドレスが変わるわけではありません。','8個のグループを展開し、各グループの先頭の0と、連続する全0のグループを区別します。二つの::を使うと、それぞれ何個省いたか定まらなくなります。',[A('inspect','省略形と展開形を並べる',['ip','prefix'],{},{showDerivation:true})]);"""
          new="""X.define('n06-ipv6','省略形・8ブロック・128bitの境界を同じ位置へ対応させます。',[
 C('communication','省略した0を正しく戻す','「::」は何個の0ブロックを表し、/60はどのbitで切れるのでしょうか。','省略形を8個の16bitブロックへ展開し、選んだブロックを16bitへ戻します。/64だけでなく/60も試し、プレフィックス境界がブロック途中にも置けることを確認してください。',[A('ipv6-expand','省略形・16進・128bitを対応させる')]),
 C('calculation','表記・近隣探索の従来記録','展開・プレフィックス・Neighbor Discoveryを順番に読むには？','最初の章は表記と境界へ集中します。従来の計算記録では、IPv6でARPではなくNeighbor Discoveryを使う点も残しています。',[A('inspect','省略形と展開形を並べる',['ip','prefix'],{},{showDerivation:true})])
]);"""
          replace('src/experiences-network.js',old,new)
          PY
          for f in src/experiences-network-basics.js src/experiences-network-basics-widgets.js tests/network-basics-review.test.mjs tests/network-basics-review-browser.mjs; do node --check "$f"; done
          npm run build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/modules.mjs src/experiences-network.js index.html
          git commit -m 'feat: ネットワーク基礎4単元を直接対応付け教材へ接続'
          git rev-parse HEAD > review-output/candidate-sha.txt
      - name: All Node calculations and registration checks
        run: |
          npm run check > review-output/node.txt 2>&1 || { tail -n 140 review-output/node.txt; exit 1; }
          grep -E '^# (tests|pass|fail|skipped|cancelled)' review-output/node.txt
      - name: Install browsers
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.63.0 > review-output/install.txt 2>&1
          npx playwright install --with-deps chromium firefox webkit >> review-output/install.txt 2>&1
      - name: Operate reviewed pages and existing network workspaces
        run: |
          failed=0
          for browser in chromium firefox webkit; do
            for file in tests/network-basics-review-browser.mjs tests/network-workspaces-browser.mjs tests/network-workspaces-edges-browser.mjs; do
              code=0
              BROWSER="$browser" GITHUB_SHA="$(git rev-parse HEAD)" node "$file" > "review-output/$browser-$(basename "$file").txt" 2>&1 || code=$?
              grep -E '^(NETWORK_BASICS_SUMMARY|NETWORK_|EDGE_)' "review-output/$browser-$(basename "$file").txt" || true
              if [ "$code" -ne 0 ]; then tail -n 80 "review-output/$browser-$(basename "$file").txt"; failed=1; fi
            done
          done
          test "$failed" = 0
          git diff --exit-code HEAD -- src scripts tests index.html package.json .github docs
      - name: Save unchanged tested candidate on temporary branch
        run: |
          test "$(git ls-remote origin refs/heads/review/network-basics-correspondence | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/review/network-basics-correspondence
      - name: Compact evidence
        if: always()
        run: |
          git archive --format=zip HEAD -o review-output/source.zip
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('review-output')
          result={'candidate':(p/'candidate-sha.txt').read_text().strip() if (p/'candidate-sha.txt').exists() else None,'node':[],'browserLogs':{}}
          if (p/'node.txt').exists():
              result['node']=[x for x in (p/'node.txt').read_text().splitlines() if x.startswith(('# tests ','# pass ','# fail ','# skipped ','# cancelled '))]
          for b in ['chromium','firefox','webkit']:
              f=p/(b+'-network-basics-review-browser.mjs.txt')
              if f.exists():
                  lines=[x for x in f.read_text().splitlines() if x.startswith('NETWORK_BASICS_SUMMARY ')]
                  result['browserLogs'][b]=lines[-1] if lines else 'missing'
          (p/'summary.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: network-basics-candidate
          path: review-output/
          retention-days: 7
