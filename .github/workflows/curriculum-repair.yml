name: Repair curriculum definition delimiters
on:
  push:
    branches: [feat/curriculum-gap-expansion]
    paths: [.github/workflows/curriculum-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'Lye-0/visual-cs-lab' && github.ref == 'refs/heads/feat/curriculum-gap-expansion'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Correct the known extra bracket in three new lesson files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          paths = ['src/curriculum-math.js', 'src/curriculum-statistics.js', 'src/curriculum-theory.js']
          for name in paths:
              p = Path(name)
              source = p.read_text()
              count = source.count(']],p=>{')
              source = source.replace(']],p=>{', ']},p=>{')
              p.write_text(source)
              print(name, 'corrected delimiters:', count)
          for name in paths:
              subprocess.run(['node', '--check', name], check=True)
          PY
      - name: Save the syntax repair on this branch only
        run: |
          expected=$(git ls-remote origin refs/heads/feat/curriculum-gap-expansion | cut -f1)
          test "$expected" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/curriculum-repair.yml
          git add src/curriculum-math.js src/curriculum-statistics.js src/curriculum-theory.js
          git commit -m 'fix: 数理・論理教材の定義括弧を修正'
          git push origin HEAD:refs/heads/feat/curriculum-gap-expansion
      - name: Check real model behavior after the syntax repair
        run: node scripts/curriculum-probe.mjs
