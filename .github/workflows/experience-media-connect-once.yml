# One-time authoring transaction. Permanent tests are strictly read-only.
# Apply the inspected fixes, integrate the authored assets, remove this file,
# and commit to the existing work branch only. Never update main here.
name: Connect authored media lessons once
on:
  push:
    branches: [feat/lesson-specific-experiences]
    paths: [.github/workflows/experience-media-connect-once.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'Lye-0/visual-cs-lab' && github.ref == 'refs/heads/feat/lesson-specific-experiences'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Connect exactly the inspected source files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(path,old,new):
              p=Path(path);s=p.read_text()
              assert s.count(old)==1,(path,'expected one match',old)
              p.write_text(s.replace(old,new,1))
          replace('scripts/modules.mjs','"experiences-ai-lessons"];','"experiences-ai-lessons","experiences-media-signals","experiences-media-graphics","experiences-media-embedded","experiences-media-lessons"];')
          replace('scripts/modules.mjs','"experiences-ai-language-widgets"];','"experiences-ai-language-widgets","experiences-media-widgets","experiences-media-graphics-widgets","experiences-media-embedded-widgets"];')
          replace('scripts/modules.mjs','"experiences-ai","scrollbars"];','"experiences-ai","experiences-media","scrollbars"];')
          replace('src/experiences-media-widgets.js',' class="unused"','')
          # Pixel 27 samples (3.5,3.5), inside both triangles. Pixel 36 at
          # (4.5,4.5) is below both projected lower edges, hence background.
          # Keep geometry fixed and select a genuinely overlapping pixel.
          replace('src/experiences-media-graphics.js','rasterStart=()=>({cell:36','rasterStart=()=>({cell:27')
          replace('tests/media-workspaces-browser.mjs',"await open(page,'gap-137');await click(page,'cell:36');","await open(page,'gap-137');await click(page,'cell:27');")
          replace('tests/media-workspaces-browser.mjs',"a unit without the new renderer is not silently marked authored","all original units remain alongside the authored media batch")
          replace('tests/media-workspaces-browser.mjs',"assert.equal(await page.evaluate(()=>CSL.experiences.find('gap-144')===undefined),true);","assert.equal(await page.evaluate(ids=>ids.every(id=>!!CSL.experiences.find(id)),ids),true);")
          replace('tests/media-workspaces-browser.mjs','// Keep this batch test scoped. The independent full-314 assertion remains unchanged.','// Do not require a future lesson to remain absent. Full-314 coverage is checked independently.')
          Path('.github/workflows/experience-media-connect-once.yml').unlink()
          PY
          for f in src/experiences-media-{signals,graphics,embedded,widgets,graphics-widgets,embedded-widgets,lessons}.js; do node --check "$f"; done
          npm run build
          node --test tests/media-workspaces.test.mjs
      - name: Commit the separated entry only if the work branch did not move
        run: |
          test "$(git ls-remote origin refs/heads/feat/lesson-specific-experiences | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/modules.mjs src/experiences-media-widgets.js src/experiences-media-graphics.js tests/media-workspaces-browser.mjs index.html .github/workflows/experience-media-connect-once.yml
          git commit -m 'feat: メディアと組み込み11単元の個別画面を分離エントリへ接続'
          git push origin HEAD:refs/heads/feat/lesson-specific-experiences
          echo "Integrated source commit $(git rev-parse HEAD)"
