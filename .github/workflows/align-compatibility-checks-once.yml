# One-time test maintenance after default pages changed. Removes itself.
# Old detail assertions opt in via the real ?view=classic URL. They are not skipped.
name: Align retained-view verification once
on:
  push:
    branches: [feat/lesson-specific-experiences]
    paths: [.github/workflows/align-compatibility-checks-once.yml]
permissions:
  contents: write
jobs:
  align:
    if: github.repository == 'Lye-0/visual-cs-lab' && github.ref == 'refs/heads/feat/lesson-specific-experiences'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply inspected route and assertion changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          expected={'tests/reader-browser.mjs':'222861929852c18add347daf6224b3fa104ed611','tests/reader-regressions.mjs':'2b047d5d1785001996e4b97a89bca562c5e96888','tests/pr-review-browser.mjs':'378897cb997472a48db7f24c2df6431c2a652a66','tests/reader-svg-theme.mjs':'c24c04cb2432fdafaad2df0610a28dc21269fc93','tests/curriculum-browser.mjs':'1e8c4682b059837cf19e20390af446b7bb3da710','tests/static-site-browser.mjs':'2307f432da0f2724ded2ddf8a53c57a5b28db3f6','tests/scrollbars-browser.mjs':'f232574fe4861296360fac5a3b145a22419df131','tests/library-browser.mjs':'069a320cce412a9c6fb25125f854614f5c07f601','src/experiences-view.js':'640fe09fb1310a0dbfbbcd9f8586ba4e24e39275'}
          for p,sha in expected.items():
              assert subprocess.check_output(['git','hash-object',p]).decode().strip()==sha,('source changed',p)
          def replace(p,old,new):
              path=Path(p);s=path.read_text();assert s.count(old)==1,(p,'expected once',old);path.write_text(s.replace(old,new,1))
          for p in list(expected):
              if p.startswith('tests/'):
                  path=Path(p);path.write_text("import {classicUrl,readyAuthored} from './legacy-routes.mjs';\n"+path.read_text())
          replace('tests/reader-browser.mjs','await page.goto(`${base}#/lab/${id}${suffix}`);','await page.goto(classicUrl(`${base}#/lab/${id}${suffix}`));')
          replace('tests/reader-browser.mjs',"await page.locator('#home-results a[href=\"#/lab/c01-entropy\"]').click();\n   await ready(page,'c01-entropy');", "await page.locator('#home-results a[href=\"#/lab/c01-entropy\"]').click();\n   await readyAuthored(page,'c01-entropy');\n   await page.locator('.ex-secondary a[href=\"#/lab/c01-entropy?view=classic\"]').click();\n   await ready(page,'c01-entropy');")
          replace('tests/reader-browser.mjs',"await page.locator('.reader-advanced-banner a').click();await ready(page,id);","await page.locator('.reader-advanced-banner a').click();await readyAuthored(page,id);")
          replace('tests/reader-regressions.mjs','await page.goto(`${base}?regression=${++visit}#/lab/${id}`);','await page.goto(classicUrl(`${base}?regression=${++visit}#/lab/${id}`));')
          replace('tests/reader-regressions.mjs','await page.goto(`${base}#/lab/c01-entropy`);','await page.goto(classicUrl(`${base}#/lab/c01-entropy`));')
          replace('tests/pr-review-browser.mjs',"await page.goto(base+'#/lab/'+id);","await page.goto(classicUrl(base+'#/lab/'+id));")
          replace('tests/reader-svg-theme.mjs','await page.goto(`${base}#/lab/n03-switch`);','await page.goto(classicUrl(`${base}#/lab/n03-switch`));')
          replace('tests/curriculum-browser.mjs',"await page.goto(base+'#/lab/'+id);","await page.goto(classicUrl(base+'#/lab/'+id));")
          replace('tests/curriculum-browser.mjs',"await page.locator('#catalog-results a[href=\"#/lab/gap-155\"]').click();await ready(page,'gap-155');","await page.locator('#catalog-results a[href=\"#/lab/gap-155\"]').click();await readyAuthored(page,'gap-155');")
          replace('tests/scrollbars-browser.mjs','await page.goto(base+route);','await page.goto(classicUrl(base+route));')
          replace('tests/static-site-browser.mjs',"await page.goto(url+'#/lab/'+id);","await page.goto(classicUrl(url+'#/lab/'+id));")
          for id in ['gap-148','gap-150','gap-154','n11-tcp','n03-switch']:
              replace('tests/static-site-browser.mjs',"await page.goto(url+'#/lab/"+id+"');","await page.goto(classicUrl(url+'#/lab/"+id+"'));")
          replace('tests/static-site-browser.mjs',"await page.route('**/src/curriculum-navigation.js',","await page.route('**/src/'+browserModules.at(-1)+'.js',")
          replace('tests/static-site-browser.mjs',"await page.locator('[data-cv-catalogue]').waitFor({timeout:20000});","await page.locator('#catalog-query').waitFor({timeout:20000});\n  assert.equal(await page.locator('#catalog-results .library-unit').count(),24);")
          replace('tests/static-site-browser.mjs',"  for(const id of ['c01-entropy'", "  for(const id of ['c01-entropy','n03-switch','n11-tcp','gap-002','gap-037','s03-aes','gap-148','gap-150','gap-154','gap-155'])await check(scenario+': '+id+' authored default and public detail link',async()=>{\n   await page.goto(url+'#/lab/'+id);await readyAuthored(page,id);\n   assert.equal(await page.locator('.experience h1').textContent(),await page.evaluate(()=>CSL.app.current.lab.unit));\n   assert.equal(await page.locator('.ex-secondary a[href=\"#/lab/'+id+'?view=classic\"]').count(),1);\n   assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+2),false);\n   assert.deepEqual(await page.evaluate(()=>window.__csp),[]);\n  });\n  for(const id of ['c01-entropy'")
          # Keep the catalogue's three-level navigation on the new default page.
          replace('src/experiences-view.js','<span>/</span><a href=\"#/catalog?domain=${path[0].id}&category=${path[1].id}\">','<span>/</span><a href=\"#/catalog?domain=${path[0].id}\">${h(path[0].name)}</a><span>/</span><a href=\"#/catalog?domain=${path[0].id}&category=${path[1].id}\">')
          replace('tests/library-browser.mjs',"document.querySelector('.library,.reader')","document.querySelector('.library,.reader,.experience')")
          replace('tests/library-browser.mjs',"await page.locator('.reader-title h1').waitFor();assert.equal(await page.locator('.reader-title .library-breadcrumb a').count(),3);","await readyAuthored(page,'c01-entropy');assert.equal(await page.locator('.ex-title .library-breadcrumb a').count(),3);")
          replace('tests/library-browser.mjs',"await page.locator('.reader-title-links a').filter({hasText:'このテーマの単元一覧'}).click();","await page.locator('.ex-secondary a').filter({hasText:'同じテーマの単元へ'}).click();")
          for p in ['.github/workflows/lesson-review.yml','.github/workflows/curriculum-verification.yml']:
              replace(p,'          npm run build\n','')
              replace(p,'          npm run inventory\n','          npm run inventory -- --check\n')
          Path('.github/workflows/align-compatibility-checks-once.yml').unlink()
          PY
          for f in tests/{legacy-routes,reader-browser,reader-regressions,pr-review-browser,reader-svg-theme,curriculum-browser,static-site-browser,scrollbars-browser,library-browser,diagram-snapshot}.mjs; do node --check "$f"; done
          node --test tests/legacy-routes.test.mjs
          npm run check > /tmp/compatibility-node.txt 2>&1 || { tail -n 100 /tmp/compatibility-node.txt; exit 1; }
          grep -E '^# (tests|pass|fail)' /tmp/compatibility-node.txt
      - name: Save the corrected check sources and breadcrumb on the work branch
        run: |
          test "$(git ls-remote origin refs/heads/feat/lesson-specific-experiences | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tests/reader-browser.mjs tests/reader-regressions.mjs tests/pr-review-browser.mjs tests/reader-svg-theme.mjs tests/curriculum-browser.mjs tests/static-site-browser.mjs tests/scrollbars-browser.mjs tests/library-browser.mjs src/experiences-view.js .github/workflows/lesson-review.yml .github/workflows/curriculum-verification.yml .github/workflows/align-compatibility-checks-once.yml
          git commit -m 'test: 新しい標準画面と保持した詳細画面の互換性を明示的に検証'
          git push origin HEAD:refs/heads/feat/lesson-specific-experiences
          echo "ALIGNED_SOURCE $(git rev-parse HEAD)"
