# Explicit one-time source editing, deleted before the resulting source commit.
# The permanent browser workflows only read and verify the committed code.
name: Polish inspected OS workspace interactions once
on:
  push:
    branches: [feat/lesson-specific-experiences]
    paths: [.github/workflows/os-workspace-polish-once.yml]
permissions:
  contents: write
jobs:
  edit:
    if: github.repository == 'Lye-0/visual-cs-lab' && github.ref == 'refs/heads/feat/lesson-specific-experiences'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply the inspected edits without changing the model expectations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(file,old,new):
              p=Path(file);s=p.read_text();assert s.count(old)==1,(file,old)
              p.write_text(s.replace(old,new,1))
          replace('tests/os-workspaces-browser.mjs',
              " await page.goto(base+'#/lab/'+id+(chapter?'?chapter='+chapter:''));",
              " const url=base+'#/lab/'+id+(chapter?'?chapter='+chapter:'');\n // Navigating to the same fragment need not reload a document. Independent\n // trials explicitly reload it, rather than silently reusing the previous state.\n if(page.url()===url)await page.reload();else await page.goto(url);")
          replace('src/experiences-os-widgets.js',
              'function workspace(root,current,initial,reducer){',
              '''// Input drafts belong to this mounted experiment, not to persistent storage.
          // A state transition must not silently replace a quantity or selected ID.
          X.captureWorkspaceFields=host=>[...host.querySelectorAll('input[id],select[id],textarea[id]')].map(el=>({id:el.id,tag:el.tagName,type:el.type,value:el.value,checked:el.checked}));
          X.restoreWorkspaceFields=(host,drafts)=>{
           for(const draft of drafts){
            const el=host.querySelector('#'+CSS.escape(draft.id));
            if(!el||el.tagName!==draft.tag||el.type!==draft.type)continue;
            if(el.tagName==='SELECT'&&![...el.options].some(o=>o.value===draft.value))continue;
            if(el.type==='checkbox'||el.type==='radio')el.checked=draft.checked;
            else if(el.type!=='file')el.value=draft.value;
           }
          };
          function workspace(root,current,initial,reducer){''')
          replace('src/experiences-os-widgets.js',
              ' function paint(focus){\n  render(state,board);root.dataset.osState=JSON.stringify(state);',
              ' function paint(focus,keepDrafts=true){\n  const drafts=keepDrafts?X.captureWorkspaceFields(board):[];\n  render(state,board);X.restoreWorkspaceFields(board,drafts);root.dataset.osState=JSON.stringify(state);')
          replace('src/experiences-os-widgets.js',
              'state=make();history=[];paint(focus);',
              'state=make();history=[];paint(focus,false);')
          replace('src/experiences-storage-widgets.js',
              'paint(focus){view(state,board);root.dataset.storeState=JSON.stringify(state);',
              'paint(focus,keepDrafts=true){const drafts=keepDrafts?X.captureWorkspaceFields(board):[];view(state,board);X.restoreWorkspaceFields(board,drafts);root.dataset.storeState=JSON.stringify(state);')
          replace('src/experiences-storage-widgets.js',
              'state=make();history=[];api.paint(focus);',
              'state=make();history=[];api.paint(focus,false);')
          replace('tests/os-workspaces-browser.mjs',
              "  await check(size+': navigating away removes old handlers and returning starts a fresh experiment',async()=>{",
              '''  await check(size+': repaint preserves input drafts and an explicit reset clears them',async()=>{
             await open(page,'gap-085');
             const quantity=page.locator('[data-rpc-send] [name="value"]');
             await quantity.fill('3');await os(page,'rpc-send').click();
             assert.equal(await quantity.inputValue(),'3');
             await os(page,'deliver-request').click();await os(page,'drop-response').click();await os(page,'timeout').click();
             assert.equal(await quantity.inputValue(),'3');
             await os(page,'rpc-send').click();await os(page,'deliver-request').click();
             assert.equal((await osState(page)).orders.length,1);
             assert.equal((await osState(page)).orders[0].quantity,3);
             await os(page,'reset').click();assert.equal(await quantity.inputValue(),'1');
             await open(page,'gap-079');
             const target=page.locator('[data-file-link] [name="target"]');
             await target.fill('/saved');await store(page,'new-link').click();
             assert.equal(await target.inputValue(),'/saved');
             assert.ok((await storeState(page)).entries['/saved']);
             await store(page,'reset').click();assert.equal(await target.inputValue(),'/copy');
            });
            await check(size+': navigating away removes old handlers and returning starts a fresh experiment',async()=>{''')
          Path('.github/workflows/os-workspace-polish-once.yml').unlink()
          PY
          node --check src/experiences-os-widgets.js
          node --check src/experiences-storage-widgets.js
          node --check tests/os-workspaces-browser.mjs
          node scripts/build.mjs --check
          node --test tests/os-workspaces.test.mjs > /tmp/os-models.txt 2>&1 || { cat /tmp/os-models.txt; exit 1; }
          tail -n 12 /tmp/os-models.txt
      - name: Commit the actual source fixes on the working branch only
        run: |
          test "$(git ls-remote origin refs/heads/feat/lesson-specific-experiences | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/experiences-os-widgets.js src/experiences-storage-widgets.js tests/os-workspaces-browser.mjs .github/workflows/os-workspace-polish-once.yml
          git commit -m 'fix: 教材の操作で入力値を保持しブラウザ検証の試行を独立させる'
          git push origin HEAD:refs/heads/feat/lesson-specific-experiences
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)"
