# One-time authoring transaction, removed by its own source commit.
# Permanent verification is read-only and never repairs sources.
name: Repair inspected experience sources once
on:
  push:
    branches: [feat/lesson-specific-experiences]
    paths: [.github/workflows/experience-repair-once.yml]
permissions:
  contents: write
jobs:
  edit:
    if: github.repository == 'Lye-0/visual-cs-lab' && github.ref == 'refs/heads/feat/lesson-specific-experiences'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply only inspected replacements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          def replace(name,old,new):
              p=Path(name);s=p.read_text()
              assert s.count(old)==1,(name,old,'must match once')
              p.write_text(s.replace(old,new,1))
          assert subprocess.check_output(['git','hash-object','src/experiences-code.js']).decode().strip()=='02f2cf4a1968274265c4b5700b31a9827e2e2a5f'
          replace('src/experiences-code.js',"method:'bellman-ford',directed:true'","method:'bellman-ford',directed:true")
          replace('src/experiences-code.js',"method:'floyd-warshall',directed:true'","method:'floyd-warshall',directed:true")
          replace('src/experiences-geometry.js','v=[.6,1]','v=[.5,1]')
          replace('scripts/modules.mjs','"experiences-math","experiences-theory"]','"experiences-math","experiences-theory","experiences-code","experiences-hardware"]')
          Path('.github/workflows/experience-repair-once.yml').unlink()
          PY
          node --check src/experiences-code.js
          node --check src/experiences-geometry.js
          node --check scripts/modules.mjs
          npm run build
      - name: Commit corrected sources on the working branch
        run: |
          test "$(git ls-remote origin refs/heads/feat/lesson-specific-experiences | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/experiences-code.js src/experiences-geometry.js scripts/modules.mjs index.html .github/workflows/experience-repair-once.yml
          git commit -m 'fix: 算法教材の構文と39単元の読み込みと座標初期値を修正'
          git push origin HEAD:refs/heads/feat/lesson-specific-experiences
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)"
      - name: Report contracts without changing sources
        run: |
          mkdir -p review-output
          node --input-type=module <<'JS' > review-output/contracts.txt
          import {readFile} from 'node:fs/promises';
          import vm from 'node:vm';
          const {modelModules}=await import('./scripts/modules.mjs');
          for(const name of modelModules.filter(n=>!n.startsWith('experiences-')))await import('./src/'+name+'.js');
          await import('./src/experiences-core.js');
          const X=CSL.experiences,original=X.define,errors=[];
          // Isolated diagnostic only: collect all failures instead of stopping
          // at the first bad chapter. Production keeps strict registration.
          X.define=(...args)=>{try{return original(...args);}catch(e){errors.push({id:args[0],error:e.message});}};
          for(const name of modelModules.filter(n=>n.startsWith('experiences-')&&n!=='experiences-core')){
            try{vm.runInThisContext(await readFile('./src/'+name+'.js','utf8'),{filename:name});}catch(e){errors.push({file:name,error:e.message});}
          }
          console.log('AUTHOR_ERRORS '+JSON.stringify(errors));
          for(const e of errors){const lab=CSL.labs.find(l=>l.id===e.id);if(lab)console.log('ACTUAL_CONTRACT '+JSON.stringify({id:lab.id,defaults:lab.defaults,controls:lab.controls}));}
          console.log('REGISTERED '+X.lessons.size);
          const failed=[];
          for(const [id,def]of X.lessons)for(const ch of def.chapters)for(const a of ch.activities){
            if(!['inspect','ledger','timeline','editor','compare'].includes(a.kind))continue;
            const lab=CSL.labs.find(l=>l.id===(a.model||id));
            for(const example of a.kind==='compare'?a.examples:[{patch:{}},...(a.examples||[])]){
              const p={...lab.defaults,...a.patch,...example.patch};
              const invalid=lab.controls.filter(c=>c.type==='select'&&!c.options.some(o=>o.value===p[c.key])).map(c=>({key:c.key,value:p[c.key],options:c.options}));
              try{if(invalid.length)throw Error('Invalid select '+JSON.stringify(invalid));await CSL.run(lab,p);}catch(e){failed.push({id,chapter:ch.id,title:a.title,error:e.message,params:p});}
            }
          }
          console.log('MODEL_ERRORS '+JSON.stringify(failed));
          console.log('MISSING '+JSON.stringify(CSL.labs.filter(l=>!X.lessons.has(l.id)).map(l=>l.id)));
          JS
          cat review-output/contracts.txt
          git diff --exit-code HEAD -- src scripts tests index.html
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: experience-repair-diagnostics
          path: review-output/
          retention-days: 7
