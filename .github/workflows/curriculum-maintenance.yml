name: Curriculum maintenance
on:
  push:
    branches: [feat/curriculum-gap-expansion]
    paths: [.github/workflows/curriculum-maintenance.yml]
permissions:
  contents: write
concurrency:
  group: curriculum-maintenance
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'Lye-0/visual-cs-lab' && github.ref == 'refs/heads/feat/curriculum-gap-expansion'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply the reviewed exact replacement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/curriculum-algorithms.js')
          text=p.read_text()
          old="prev[i]??'なし'])))));"
          new="prev[i]??'なし']))));"
          assert text.count(old)==1, 'The reviewed source no longer matches'
          p.write_text(text.replace(old,new))
          PY
          node --check src/curriculum-algorithms.js
      - name: Commit only the repaired source
        run: |
          expected=$(git ls-remote origin refs/heads/feat/curriculum-gap-expansion | cut -f1)
          test "$expected" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/curriculum-algorithms.js
          git commit -m 'fix: 硬貨DPの表生成で余分な閉じ括弧を除去'
          git push origin HEAD:refs/heads/feat/curriculum-gap-expansion
      - name: Check integrated models and all discovered extension modules
        run: |
          mkdir -p review-output
          node scripts/curriculum-probe.mjs > review-output/probe-log.txt 2>&1 || { tail -n 160 review-output/probe-log.txt; exit 1; }
          tail -n 25 review-output/probe-log.txt
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: curriculum-maintenance-diagnostics
          path: review-output/
          retention-days: 7
