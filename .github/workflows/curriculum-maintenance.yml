name: Curriculum reviewed patch
on:
  push:
    branches: [feat/curriculum-gap-expansion]
    paths:
      - .github/workflows/curriculum-maintenance.yml
      - scripts/curriculum-patches*.json
permissions:
  contents: write
concurrency:
  group: curriculum-maintenance
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'Lye-0/visual-cs-lab' && github.ref == 'refs/heads/feat/curriculum-gap-expansion'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/curriculum-gap-expansion
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply exact reviewed replacements only
        run: |
          git rev-parse HEAD > /tmp/curriculum-base
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          allowed=('src/','tests/','scripts/')
          paths=set()
          for plan in sorted(Path('scripts').glob('curriculum-patches*.json')):
              for patch in json.loads(plan.read_text()):
                  name=patch['path'];p=Path(name)
                  assert name.startswith(allowed) and '..' not in p.parts and p.is_file()
                  old,new=patch['old'],patch['new'];text=p.read_text()
                  if text.count(old)==0 and new in text: continue
                  assert old and text.count(old)==1, name+' no longer matches the reviewed fragment'
                  p.write_text(text.replace(old,new,1));paths.add(name)
          for name in paths:
              if name.endswith(('.js','.mjs')): subprocess.run(['node','--check',name],check=True)
          Path('/tmp/curriculum-patch-paths').write_text('\n'.join(sorted(paths))+'\n')
          PY
      - name: Commit without overwriting concurrent changes
        run: |
          expected=$(git ls-remote origin refs/heads/feat/curriculum-gap-expansion | cut -f1)
          test "$expected" = "$(cat /tmp/curriculum-base)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          while IFS= read -r path; do [ -z "$path" ] || git add -- "$path"; done < /tmp/curriculum-patch-paths
          if ! git diff --cached --quiet; then
            git commit -m 'fix: 拡張教材にレビュー済みの修正を適用'
            git push origin HEAD:refs/heads/feat/curriculum-gap-expansion
          fi
      - name: Verify the patched source
        run: |
          mkdir -p review-output
          node scripts/curriculum-probe.mjs > review-output/probe-log.txt 2>&1 || { tail -n 100 review-output/probe-log.txt; exit 1; }
          tail -n 20 review-output/probe-log.txt
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: curriculum-patch-diagnostics
          path: review-output/
          retention-days: 7
