name: Lesson review
on:
  push:
    branches: [feat/notebook-led-learning]
    paths-ignore: ['index.html', 'docs/verification/**', 'docs/screenshots/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: lesson-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build and test teaching models
        run: |
          mkdir -p review-output
          npm run build
          npm test > review-output/node-tests.txt 2>&1 || { tail -n 100 review-output/node-tests.txt; exit 1; }
          tail -n 12 review-output/node-tests.txt
          npm run inventory
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.63.0
          npx playwright install --with-deps chromium > review-output/browser-install.txt 2>&1 || { tail -n 40 review-output/browser-install.txt; exit 1; }
      - name: Test actual HTTP document on desktop and mobile
        run: node tests/reader-browser.mjs
      - name: Assemble offline site and source archive
        run: |
          cp index.html review-output/Visual-CS-Lab.html
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          names = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with ZipFile('review-output/visual-cs-lab-source.zip', 'w', ZIP_DEFLATED) as archive:
              for name in names:
                  if name and Path(name).is_file():
                      archive.write(name, 'visual-cs-lab/' + name)
          PY
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: visual-cs-lab-review
          path: review-output/
          retention-days: 14
