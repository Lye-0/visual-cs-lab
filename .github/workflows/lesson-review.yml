name: Lesson review
on:
  push:
    branches: [feat/notebook-led-learning]
    paths-ignore: ['index.html', 'docs/verification/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: lesson-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test teaching models
        run: |
          mkdir -p review-output
          npm run build
          set -o pipefail
          npm test 2>&1 | tee review-output/node-tests.txt
          npm run inventory
      - name: Install browser test tools
        if: hashFiles('tests/reader-browser.mjs') != ''
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Test actual HTTP document on desktop and mobile
        if: hashFiles('tests/reader-browser.mjs') != ''
        run: node tests/reader-browser.mjs
      - name: Assemble offline site and source archive
        if: success()
        run: |
          cp index.html review-output/Visual-CS-Lab.html
          git archive --format=zip --prefix=visual-cs-lab/ -o review-output/visual-cs-lab-source.zip HEAD
          python3 - <<'PY'
          from zipfile import ZipFile, ZIP_DEFLATED
          from pathlib import Path
          p = Path('review-output/visual-cs-lab-source.zip')
          with ZipFile(p) as old:
              files = {x.filename: old.read(x) for x in old.infolist() if not x.is_dir()}
          files['visual-cs-lab/index.html'] = Path('index.html').read_bytes()
          with ZipFile(p, 'w', ZIP_DEFLATED) as new:
              for name, data in files.items():
                  new.writestr(name, data)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-cs-lab-review
          path: review-output/
          retention-days: 14
