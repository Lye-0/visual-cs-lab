name: Lesson review
on:
  push:
    branches: [main, feat/notebook-led-learning, feat/curriculum-gap-expansion, refactor/split-static-site]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lesson-review-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # For pull_request, verify GitHub's prospective merge without repairing it.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check the committed revision without rebuilding it
        run: |
          mkdir -p review-output
          git rev-parse HEAD > review-output/tested-merge.txt
          node scripts/curriculum-finalize.mjs
          node scripts/build.mjs --check
          npm test > review-output/node-tests.txt 2>&1 || { tail -n 160 review-output/node-tests.txt; exit 1; }
          tail -n 15 review-output/node-tests.txt
          npm run inventory -- --check
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.63.0
          npx playwright install chromium
      - name: Test restored diagrams and every retained detail-view unit
        run: node tests/reader-browser.mjs
      - name: Test input, keyboard and SVG regressions
        run: |
          node tests/pr-review-browser.mjs
          node tests/reader-regressions.mjs
          node tests/reader-svg-theme.mjs
      - name: Ensure tests did not change the source
        run: |
          test "$(git rev-parse HEAD)" = "$(cat review-output/tested-merge.txt)"
          git diff --exit-code HEAD -- src scripts tests package.json .github index.html assets docs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: visual-cs-lab-review-${{ github.event_name }}-${{ github.run_attempt }}
          path: review-output/
          retention-days: 14
