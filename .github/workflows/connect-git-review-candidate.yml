# Isolated authoring on a candidate branch, never changes main.
name: Verify Git correspondence candidate
on:
  push:
    branches: [review/git-correspondence]
    paths: [.github/workflows/connect-git-review-candidate.yml]
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Connect inspected lessons and fix the reproduced pointer issue
        run: |
          mkdir -p review-output
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          hashes={'scripts/modules.mjs':'620e790e8e93a3b79b6766cbe638f1ba815fab9f','src/experiences-systems.js':'e96d10c9339c336fdd574af7b984e8a49affda86'}
          for f,sha in hashes.items():
              assert subprocess.check_output(['git','hash-object',f],text=True).strip()==sha,f
          def replace(path,old,new):
              p=Path(path);s=p.read_text();assert s.count(old)==1,(path,old);p.write_text(s.replace(old,new,1))
          replace('scripts/modules.mjs','"experiences-database-review"];','"experiences-database-review","experiences-git-review"];')
          replace('scripts/modules.mjs','"experiences-database-review-widgets"];','"experiences-database-review-widgets","experiences-git-review-widgets"];')
          replace('scripts/modules.mjs','"experiences-database-review","scrollbars"];','"experiences-database-review","experiences-git-review","scrollbars"];')
          p=Path('src/experiences-systems.js');s=p.read_text();start=s.index('for(const [id,title,lead,body]of gitLessons)');end=s.index("d('c16-testing'");old=s[start:end];assert old.count('\n')==1
          new="""const gitKinds={'c16-git':'stage','c16-reset':'reset','c16-branches':'merge','c16-rebase':'rebase','c16-remote':'remote','c16-undo':'undo'};
          for(const [id,title,lead,body]of gitLessons){
           const prose=id==='c16-branches'?'共通祖先と両側のファイル内容を並べます。mainが進んでいない場合、別ファイルを変更した場合、同じファイルが競合する場合を比較してください。判定はファイル単位で、実Gitの行単位マージを再現したものではありません。':body;
           X.define(id,lead,[C('objects',title,L.labs.find(l=>l.id===id).question,prose,[A('git-'+gitKinds[id]+'-desk',title+'を直接操作する')]),C('commands','コマンド列の計算記録','自由にコマンドを並べた場合の各状態を確認するには？','最初の章で対応関係を確認した後、この仮想リポジトリが扱うコマンドを組み合わせて試せます。一行ずつの記録を読み返します。',[A('editor','仮想リポジトリのコマンドと結果',['script'],{},{submit:'この操作列を仮想リポジトリで実行する',advance:'次のGit操作を確認する'})],['コマンドは実Gitではなく教材の簡略モデルです。pullはfetch＋merge、merge競合はファイル単位、rebaseは線形履歴に限定します。実ファイルやGitHubは変更しません。'])]);
          }
          """
          p.write_text(s.replace(old,new))
          PY
          python3 scripts/repair-git-review-visual-once.py
          node --check src/experiences-git-review-widgets.js
          npm run build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/modules.mjs src/experiences-systems.js src/experiences-git-review-widgets.js src/experiences-git-review.css index.html
          git commit -m 'feat: Git6単元を直接操作へ接続し図のクリックと狭幅表示を改善'
          git rev-parse HEAD > review-output/candidate-sha.txt
          git ls-tree -r HEAD > review-output/tracked-files.txt
      - name: All model tests including independent real Git checks
        run: |
          npm run check > review-output/node.txt 2>&1 || { tail -n 100 review-output/node.txt; exit 1; }
          grep -E '^# (tests|pass|fail|skipped|cancelled)' review-output/node.txt
      - name: Install the three browsers
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.63.0 > review-output/install.txt 2>&1
          npx playwright install --with-deps chromium firefox webkit >> review-output/install.txt 2>&1
      - name: Repeat the unchanged browser assertions and recapture the page
        run: |
          failed=0
          for browser in chromium firefox webkit; do
            code=0
            BROWSER="$browser" GITHUB_SHA="$(git rev-parse HEAD)" node tests/git-review-workspaces-browser.mjs > "review-output/$browser.txt" 2>&1 || code=$?
            grep '^GIT_REVIEW_SUMMARY ' "review-output/$browser.txt" || true
            if [ "$code" -ne 0 ]; then failed=1; fi
          done
          test "$failed" = 0
          git diff --exit-code HEAD -- src scripts tests index.html .github docs
      - name: Save only the tested candidate
        run: |
          test "$(git ls-remote origin refs/heads/review/git-correspondence | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/review/git-correspondence
      - name: Save exact source and compact evidence even on failure
        if: always()
        run: |
          git archive --format=zip HEAD -o review-output/source.zip
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('review-output');r={'candidate':(p/'candidate-sha.txt').read_text().strip() if (p/'candidate-sha.txt').exists() else None,'browsers':{}}
          for b in ['chromium','firefox','webkit']:
              f=p/'git-review'/(b+'.json')
              if f.exists():
                  d=json.loads(f.read_text());r['browsers'][b]={k:d[k] for k in ['sourceCommit','passed','failed','errors']}
          if (p/'node.txt').exists():r['node']=[s for s in (p/'node.txt').read_text().splitlines() if s.startswith(('# tests ','# pass ','# fail ','# skipped ','# cancelled '))]
          (p/'summary.json').write_text(json.dumps(r,ensure_ascii=False,indent=2));print(json.dumps(r,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: git-review-candidate
          path: review-output/
          retention-days: 7
