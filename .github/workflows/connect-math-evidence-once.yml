# Explicit one-time source edit; removes itself. Permanent tests stay read-only.
name: Connect reviewed mathematical workbooks once
on:
  push:
    branches: [feat/lesson-specific-experiences]
    paths: [.github/workflows/connect-math-evidence-once.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'Lye-0/visual-cs-lab' && github.ref == 'refs/heads/feat/lesson-specific-experiences'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply only inspected and hash-guarded edits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          hashes={'scripts/modules.mjs':'9c92efbd4811168b016b19b5678a180d7d4148f6','src/experiences-geometry.js':'5e831d456e67a20a3d78c7c62657a48e7ad2c0b0','src/experiences-foundations.js':'c3fac4c5357d74eb9c4005720cc6eb14f421fd66','src/experiences-math.js':'63ec044d7523c6aa326cdc24d3177058bb357435'}
          for path,sha in hashes.items():
              assert subprocess.check_output(['git','hash-object',path]).decode().strip()==sha,('source changed',path)
          def replace(path,old,new):
              p=Path(path);s=p.read_text();assert s.count(old)==1,(path,'expected one match',old);p.write_text(s.replace(old,new,1))
          replace('scripts/modules.mjs','"experiences-engineering-lessons"];','"experiences-engineering-lessons","experiences-math-evidence","experiences-ode-evidence"];')
          replace('scripts/modules.mjs','"experiences-engineering-dom"];','"experiences-engineering-dom","experiences-math-workbooks"];')
          replace('scripts/modules.mjs','"experiences-engineering","scrollbars"];','"experiences-engineering","experiences-math-evidence","scrollbars"];')
          p=Path('src/experiences-geometry.js');s=p.read_text();assert s.count("X.registerWidget('rowlab',")==1 and s.rstrip().endswith('})();');s=s[:s.index("X.registerWidget('rowlab',")]+"})();\n";p.write_text(s)
          p=Path('src/experiences-foundations.js');s=p.read_text();lines=[line for line in s.splitlines() if line.startswith("d('c03-matrix',")];assert len(lines)==1
          new="""X.define('c03-matrix','行列の成分を、基底の行き先と積の作り方へ対応させます。',[
           C('meaning','基底の行き先から行列を読む',L.labs.find(l=>l.id==='c03-matrix').question,'第1列は横の基底の行き先、第2列は縦の基底の行き先です。入力の座標を、その二本の組合せの係数として使います。',[A('vectors','基底と入力を直接動かす',[],{},{variant:'matrix'})],['線形変換は原点を動かしません。平行移動を含む変換は別の表現です。']),
           C('product','一つの成分を作る行と列','結果の第2行・第1列は、どの数を使ってできたのでしょうか。','行列の積では、同じ場所の成分だけを掛けるのではありません。結果の成分を選び、左の行と右の列を対応させてから、それぞれの積を足します。',[A('matrix-product','結果セルから行・列・積の和へ戻る')])
          ]);"""
          p.write_text(s.replace(lines[0],new,1))
          p=Path('src/experiences-math.js');s=p.read_text();lines=[line for line in s.splitlines() if line.startswith(" m('gradient',")];assert len(lines)==1
          new=" C('gradient','同じ点から、どちらへ進むか','進む向きが変わると、同じ場所の高さの変わり方はどう違うでしょうか。','点Pを固定して方向だけを変えます。偏微分を並べた勾配と、進む単位方向を別々に読み、内積から一次の変化を予測します。接平面の予測と実際の曲面の値は同じとは限りません。',[A('gradient-direction','点・勾配・単位方向・接平面を対応させる')]),\n"+lines[0].replace("m('gradient',","m('gradient-calculation',",1)
          p.write_text(s.replace(lines[0],new,1))
          replace('src/experiences-math-evidence.js',' const rows=text.trim()',r" if(!text.trim()||/(^|[;\n,])\s*([;\n,]|$)/.test(text))throw Error('空の行や成分は使えません。');"+'\n const rows=text.trim()')
          Path('.github/workflows/connect-math-evidence-once.yml').unlink()
          PY
          for f in src/experiences-{math-evidence,math-workbooks,ode-evidence,geometry,foundations,math}.js; do node --check "$f"; done
          npm run build
          node --test tests/math-evidence.test.mjs
      - name: Save the actual entry on the work branch only
        run: |
          test "$(git ls-remote origin refs/heads/feat/lesson-specific-experiences | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/modules.mjs src/experiences-geometry.js src/experiences-foundations.js src/experiences-math.js src/experiences-math-evidence.js index.html .github/workflows/connect-math-evidence-once.yml
          git commit -m 'fix: 行列と行操作と勾配と数値解法の対応を実画面へ接続'
          git push origin HEAD:refs/heads/feat/lesson-specific-experiences
          echo "Integrated $(git rev-parse HEAD)"
