name: AI and language learning workspaces
on:
  push:
    branches: [feat/lesson-specific-experiences]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-learning-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check the committed entry, models and independent expectations
        run: |
          mkdir -p review-output
          node scripts/build.mjs --check
          for file in src/experiences-ai*.js tests/ai-workspaces*.mjs; do node --check "$file"; done
          node --test tests/ai-workspaces.test.mjs > review-output/ai-models.txt 2>&1 || { cat review-output/ai-models.txt; exit 1; }
          tail -n 14 review-output/ai-models.txt
      - name: Install only browser test tooling
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.63.0
          npx playwright install --with-deps ${{ matrix.browser }} > review-output/ai-install.txt 2>&1 || { tail -n 40 review-output/ai-install.txt; exit 1; }
      - name: Exercise every authored chapter and learner action
        env:
          BROWSER: ${{ matrix.browser }}
        run: node tests/ai-workspaces-browser.mjs
      - name: Verification never rewrites reviewed sources
        if: ${{ !cancelled() }}
        run: git diff --exit-code HEAD -- src scripts tests index.html assets package.json .github
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ai-workspaces-${{ matrix.browser }}
          path: review-output/
          retention-days: 7
