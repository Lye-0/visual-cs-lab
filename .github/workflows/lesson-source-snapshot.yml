# Read-only snapshot for inspecting the exact working source in review tools.
# Capture point: after media/embedded integration; never repair reviewed sources.
# This is not a build, deployment, or a source-repair job.
name: Lesson source snapshot
on:
  push:
    branches: [feat/lesson-specific-experiences]
    paths: [.github/workflows/lesson-source-snapshot.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: |
          mkdir -p review-output
          git rev-parse HEAD > review-output/source-sha.txt
          git archive --format=zip --prefix=visual-cs-lab/ HEAD > review-output/source.zip
      - uses: actions/upload-artifact@v5
        with:
          name: lesson-source-snapshot
          path: review-output/
          retention-days: 3
