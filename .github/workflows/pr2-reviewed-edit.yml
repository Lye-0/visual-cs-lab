# One-time remote editing transaction. Removes itself in the source commit.
# Not part of the permanent CI: the resulting PR head is verified separately,
# without mutations, by curriculum-verification.yml and lesson-review.yml.
name: Apply reviewed PR2 source edits once
on:
  push:
    branches: [feat/curriculum-gap-expansion]
    paths: [.github/workflows/pr2-reviewed-edit.yml]
permissions:
  contents: write
concurrency:
  group: pr2-reviewed-edit
  cancel-in-progress: false
jobs:
  edit:
    if: github.repository == 'Lye-0/visual-cs-lab' && github.ref == 'refs/heads/feat/curriculum-gap-expansion'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply only the inspected exact source edits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          expected={
            'src/curriculum-runtime.js':'3151baf92d5e7ccaffd6d3d73bb05caa717dca11',
            'src/curriculum-algorithms.js':'cfaafa624cea9472a9e91683b5aa6919723ad519',
            'src/reader.js':'740f4c01ea755f968a446c78c47e8e7bfcf05962',
            'tests/reader-browser.mjs':'d8a6e7bca1c0f41af246ee8e4e2bc7d894eee1fa',
          }
          for name,sha in expected.items():
              assert subprocess.check_output(['git','hash-object',name]).decode().strip()==sha, name+' changed since inspection'
          def replace(name,old,new):
              p=Path(name);text=p.read_text()
              assert text.count(old)==1, name+' does not match exactly'
              p.write_text(text.replace(old,new,1))
          p=Path('src/curriculum-runtime.js');text=p.read_text()
          start=text.index(' function invoke(fn,args,callEnv,line){')
          end=text.index(' function evaluate(ast,env){',start)
          text=text[:start]+''' function invoke(fn,args,callEnv,line){
            if(args.length!==fn.params.length)throw Error(`関数${fn.name}は引数${fn.params.length}個です。`);
            // Reject bad arguments before allocating or pushing the callee.
            if(checkTypes)fn.params.forEach((name,i)=>{if(!matches(args[i],fn.types[i]))throw Error(`引数${name}の型が一致しません。`);});
            if(depth>=maxDepth){const e=Error(`呼出しの深さが${maxDepth}を超えました。`);e.fatal=true;throw e;}
            const local=newEnv(fn.environment,fn.name+'()');
            depth++;active.push(local);
            let result=null;
            try{
             fn.params.forEach((name,i)=>{local.vars[name]=args[i];local.types[name]=fn.types[i];});
             emit(`${fn.name}へ引数を渡す`,'値を仮引数へ渡します。配列の値は参照なので、同じ配列を共有します。',line,local);
             try{run(fn.body,local,false);}catch(e){if(e.flow==='return')result=e.value;else throw e;}
            }finally{active.pop();depth--;}
            if(checkTypes&&!matches(result,fn.returnType))throw Error(`関数${fn.name}の戻り値の型が一致しません。`);
            emit(`${fn.name}から戻る`,'呼出し元の環境と実行位置へ戻ります。戻った環境を参照するクロージャがあれば、その変数は引き続き参照されます。',line,callEnv);
            return result;
           }
          '''+text[end:]
          p.write_text(text)
          replace('src/curriculum-algorithms.js',
            'let moves=0,search=0,copies=0,links=0,capacity=Math.max(p.capacity,values.length);',
            "if(p.structure==='dynamic'&&values.length>p.capacity)throw Error('初期データの個数が初期容量を超えています。容量をデータ数以上にするか、初期データを減らしてください。');let moves=0,search=0,copies=0,links=0,capacity=p.structure==='dynamic'?p.capacity:Math.max(p.capacity,values.length);")
          replace('src/curriculum-algorithms.js',
            'アドレスは教材内のIDです。',
            'アドレスは教材内のIDです。動的配列の初期容量は初期データ数以上にしてください。')
          replace('tests/reader-browser.mjs',
            "import {chromium} from 'playwright';",
            "import {chromium} from 'playwright';\nimport {captureDiagram} from './diagram-snapshot.mjs';")
          replace('tests/reader-browser.mjs',
            "const originalDiagram = await page.locator('#reader-diagram').innerHTML();",
            'const originalDiagram = await captureDiagram(page);')
          replace('tests/reader-browser.mjs',
            "assert.equal(await page.locator('#reader-diagram').innerHTML(),originalDiagram);",
            'assert.equal(await captureDiagram(page),originalDiagram);')
          replace('src/reader.js',
            "document.addEventListener('keydown',e=>{if(A.current?.reader&&e.key==='Enter'&&e.target.matches('[data-r-number],[data-r-param]:not(textarea)')){e.preventDefault();A.runCurrent();}},true);",
            '''document.addEventListener('keydown',e=>{
           const c=A.current;if(!c?.reader||e.isComposing)return;
           const node=e.target?.matches?.('svg .cv-graph-node[role="button"][data-r-focus]')?e.target:null;
           if(node&&(e.key==='Enter'||e.key===' ')&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
            // SVG groups have no native button activation. Consume Space before
            // the page-level playback shortcut; selection restores the new node's focus.
            e.preventDefault();e.stopImmediatePropagation();
            if(!e.repeat&&ready(c))node.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,view:window}));
            return;
           }
           if(e.key==='Enter'&&e.target.matches('[data-r-number],[data-r-param]:not(textarea)')){e.preventDefault();A.runCurrent();}
          },true);''')
          for name in expected: subprocess.run(['node','--check',name],check=True)
          # The editor is not shipped or rerun as a hidden CI repair step.
          Path('.github/workflows/pr2-reviewed-edit.yml').unlink()
          PY
          npm run build
          npm run inventory
      - name: Commit the reviewed source and generated site without rewriting history
        run: |
          current=$(git ls-remote origin refs/heads/feat/curriculum-gap-expansion | cut -f1)
          test "$current" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/curriculum-runtime.js src/curriculum-algorithms.js src/reader.js tests/reader-browser.mjs index.html docs/EXPERIMENTS.md docs/experiments.json .github/workflows/pr2-reviewed-edit.yml
          git commit -m 'fix: PRレビューの不具合と図の復元検証を修正'
          git push origin HEAD:refs/heads/feat/curriculum-gap-expansion
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)"
