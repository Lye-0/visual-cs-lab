name: Media and embedded learning workspaces
on:
  push:
    branches: [feat/lesson-specific-experiences]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: media-workspaces-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check committed publishing entry
        run: node scripts/build.mjs --check
      - name: Check independent model expectations
        run: |
          mkdir -p review-output
          node --test tests/media-workspaces.test.mjs > review-output/media-models.txt 2>&1 || { cat review-output/media-models.txt; exit 1; }
          tail -n 12 review-output/media-models.txt
      - name: Install browser used by the test
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.63.0
          npx playwright install --with-deps ${{ matrix.browser }} > review-output/media-install.txt 2>&1 || { tail -n 60 review-output/media-install.txt; exit 1; }
      - name: Exercise real controls on the committed site
        env:
          BROWSER: ${{ matrix.browser }}
        run: node tests/media-workspaces-browser.mjs
      - name: Tests must not rewrite the site
        if: ${{ !cancelled() }}
        run: git diff --exit-code HEAD -- src scripts tests index.html package.json .github
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: media-workspaces-${{ matrix.browser }}
          path: review-output/
          retention-days: 7
