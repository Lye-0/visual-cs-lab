name: Direct learning workspaces
on:
  push:
    branches: [feat/lesson-specific-experiences]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: direct-workspaces-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check the committed entry and independent coding models
        run: |
          mkdir -p review-output
          node scripts/build.mjs --check
          node --test tests/coding-workspaces.test.mjs > review-output/coding-models.txt 2>&1 || { cat review-output/coding-models.txt; exit 1; }
          tail -n 12 review-output/coding-models.txt
      - name: Install browser tools
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.63.0
          npx playwright install --with-deps ${{ matrix.browser }} > review-output/install.txt 2>&1 || { tail -n 60 review-output/install.txt; exit 1; }
      - name: Exercise learner choices, wrong attempts, undo and keyboard input
        env:
          BROWSER: ${{ matrix.browser }}
        run: node tests/coding-workspaces-browser.mjs
      - name: Ensure verification did not mutate shipped sources
        if: ${{ !cancelled() }}
        run: git diff --exit-code HEAD -- src scripts tests index.html package.json .github
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: direct-workspaces-${{ matrix.browser }}
          path: review-output/
          retention-days: 14
