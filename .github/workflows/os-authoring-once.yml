# One explicitly scoped editing transaction, removed in its own source commit.
# The permanent verification workflow is read-only and never repairs sources.
name: Integrate OS and data lessons once
on:
  push:
    branches: [feat/lesson-specific-experiences]
    paths: [.github/workflows/os-authoring-once.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'Lye-0/visual-cs-lab' && github.ref == 'refs/heads/feat/lesson-specific-experiences'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply the inspected manifest and explanatory-text changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(name,old,new):
              p=Path(name);s=p.read_text()
              assert s.count(old)==1, (name,'reviewed text must match exactly once')
              p.write_text(s.replace(old,new,1))
          replace('scripts/modules.mjs','"experiences-coding-models",','"experiences-coding-models","experiences-os-models","experiences-os-state","experiences-storage-models","experiences-relations-models",')
          replace('scripts/modules.mjs','"experiences-hardware"]','"experiences-hardware","experiences-os-data"]')
          replace('scripts/modules.mjs','"experiences-coding-widgets"]','"experiences-coding-widgets","experiences-os-widgets","experiences-storage-widgets","experiences-relations-widgets"]')
          replace('scripts/modules.mjs','"experiences-coding","scrollbars"]','"experiences-coding","experiences-os","scrollbars"]')
          replace('src/experiences-os-models.js',
              "return record(s,shared?'thread：子Cは親Pと同じM1を参照します。実行位置は別です。':'fork：子Cへ別のアドレス空間M2を用意します。値は5から始まります。物理コピーの方法はここでは扱いません。');",
              "return record(s,shared?'thread：子Cは親Pと同じ'+mem+'を参照します。実行位置は別です。':'fork：子Cへ別のアドレス空間'+mem+'を用意します。値は'+s.memory[mem].x+'から始まります。物理コピーの方法はここでは扱いません。');")
          Path('.github/workflows/os-authoring-once.yml').unlink()
          PY
          for file in src/experiences-*.js; do node --check "$file"; done
          node --check tests/os-workspaces.test.mjs
          node --check tests/os-workspaces-browser.mjs
          npm run build
          node scripts/build.mjs --check
      - name: Commit actual integrated files without touching main
        run: |
          test "$(git ls-remote origin refs/heads/feat/lesson-specific-experiences | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/experiences-os-models.js scripts/modules.mjs index.html .github/workflows/os-authoring-once.yml
          git commit -m 'feat: OSとデータの21単元と13種類の操作画面をサイトへ組み込む'
          git push origin HEAD:refs/heads/feat/lesson-specific-experiences
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)"
      - name: Inspect the integrated modules and tests without rewriting files
        run: |
          mkdir -p review-output
          node --test tests/os-workspaces.test.mjs > review-output/os-models.txt 2>&1 || { cat review-output/os-models.txt; exit 1; }
          tail -n 18 review-output/os-models.txt
          node --input-type=module <<'JS'
          import {modelModules} from './scripts/modules.mjs';
          for(const name of modelModules)await import('./src/'+name+'.js');
          console.log('CURRENT_INVENTORY '+JSON.stringify(CSL.experiences.inventory()));
          JS
          git diff --exit-code HEAD -- src scripts tests index.html
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: os-authoring-diagnostics
          path: review-output/
          retention-days: 7
