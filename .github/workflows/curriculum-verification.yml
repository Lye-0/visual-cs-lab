name: Curriculum integration and verification
on:
  push:
    branches: [main, feat/notebook-led-learning, feat/curriculum-gap-expansion, refactor/split-static-site]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: curriculum-final-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check the committed source without repairing or pushing it
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          node scripts/curriculum-finalize.mjs
          mkdir -p review-output
          git rev-parse HEAD > review-output/tested-head.txt
      - name: Build and run all Node tests
        run: |
          node scripts/build.mjs --check
          npm run build
          npm test > review-output/curriculum-node.txt 2>&1 || { tail -n 160 review-output/curriculum-node.txt; exit 1; }
          tail -n 15 review-output/curriculum-node.txt
          npm run inventory
      - name: Audit all 155 model boundaries and independent examples
        run: |
          export GITHUB_SHA="$SOURCE_COMMIT"
          node scripts/curriculum-probe.mjs > review-output/curriculum-probe.log 2>&1 || { tail -n 160 review-output/curriculum-probe.log; exit 1; }
          tail -n 15 review-output/curriculum-probe.log
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.63.0
          npx playwright install chromium
      - name: Test every unit and the real raster and DOM interactions
        run: |
          export GITHUB_SHA="$SOURCE_COMMIT"
          node tests/curriculum-browser.mjs > review-output/curriculum-browser.log 2>&1 || { tail -n 180 review-output/curriculum-browser.log; exit 1; }
          tail -n 20 review-output/curriculum-browser.log
      - name: Test review regressions, playback and SVG colors
        run: |
          export GITHUB_SHA="$SOURCE_COMMIT"
          node tests/pr-review-browser.mjs
          node tests/reader-regressions.mjs
          node tests/reader-svg-theme.mjs
      - name: Verify source immutability and record completed results
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git diff --exit-code HEAD -- src scripts tests package.json .github index.html assets
          node scripts/curriculum-verification-report.mjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: curriculum-verification-evidence-${{ github.event_name }}-${{ github.run_attempt }}
          path: review-output/
          retention-days: 14
