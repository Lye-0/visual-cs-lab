# Temporary authoring transaction scoped to the user's working branch.
# It removes itself before creating the resulting source commit.
name: Connect authored AI assets once
on:
  push:
    branches: [feat/lesson-specific-experiences]
    paths: [.github/workflows/ai-entry-once.yml]
permissions:
  contents: write
jobs:
  edit:
    if: github.repository == 'Lye-0/visual-cs-lab' && github.ref == 'refs/heads/feat/lesson-specific-experiences'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Connect the inspected assets and preserve derived field identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(file,old,new):
              p=Path(file);s=p.read_text()
              assert s.count(old)==1,(file,old,'must match exactly once')
              p.write_text(s.replace(old,new,1))
          replace('scripts/modules.mjs','"experiences-security-auth","experiences-foundations"','"experiences-security-auth","experiences-ai-models","experiences-ai-language-models","experiences-foundations"')
          replace('scripts/modules.mjs','"experiences-security-lessons"];','"experiences-security-lessons","experiences-ai-lessons"];')
          replace('scripts/modules.mjs','"experiences-security-auth-widgets"];','"experiences-security-auth-widgets","experiences-ai-widgets","experiences-ai-decision-widgets","experiences-ai-language-widgets"];')
          replace('scripts/modules.mjs','"experiences-security","scrollbars"];','"experiences-security","experiences-ai","scrollbars"];')
          replace('src/experiences-ai-widgets.js','action:(code,fields)=>{\n  const [kind,j,i]','action:(code,fields,state)=>{\n  const [kind,j,i]')
          replace('src/experiences-ai-widgets.js',"fields.get('weight')","fields.get('weight-'+state.unit+'-'+state.feature+'-'+state.iterations)")
          replace('src/experiences-ai-widgets.js',"field('weight','選んだ重みW1[","field('weight-'+s.unit+'-'+s.feature+'-'+s.iterations,'選んだ重みW1[")
          replace('src/experiences-ai-widgets.js','feature:Number(i),fresh:true','feature:Number(i)')
          replace('src/experiences-ai-widgets.js','●と□は学習点、十字の位置が問い合わせ','●と□は学習点、太い輪が問い合わせ')
          replace('src/experiences-ai-widgets.js',"field('impute','補完する値','mean'","field('impute','補完する値',s.stats?.impute||'mean'")
          replace('src/experiences-ai-widgets.js',"field('scale','尺度','standard'","field('scale','尺度',s.stats?.scale||'standard'")
          replace('src/experiences-ai-language-widgets.js','class="ai-cut" aria-label','data-ai-cut aria-label')
          replace('src/experiences-ai-decision-widgets.js',"f(s.last.value)):'')","f(s.last.value))):'')")
          Path('.github/workflows/ai-entry-once.yml').unlink()
          PY
          for file in src/experiences-ai*.js tests/ai-workspaces*.mjs; do echo "Syntax: $file"; node --check "$file"; done
          node scripts/build.mjs
      - name: Commit only this authoring transaction on the working branch
        run: |
          test "$(git ls-remote origin refs/heads/feat/lesson-specific-experiences | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/modules.mjs index.html src/experiences-ai-widgets.js src/experiences-ai-language-widgets.js src/experiences-ai-decision-widgets.js .github/workflows/ai-entry-once.yml
          git commit -m 'feat: AIと言語処理の11単元を公開用ファイルへ接続'
          git push origin HEAD:refs/heads/feat/lesson-specific-experiences
          echo "Reviewed source commit: $(git rev-parse HEAD)"
      - name: Independently validate the resulting committed sources without repair
        run: |
          node scripts/build.mjs --check
          node --test tests/ai-workspaces.test.mjs
          git diff --exit-code HEAD -- src scripts tests index.html .github
