name: Curriculum model probe
on:
  push:
    branches: [feat/curriculum-gap-expansion]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/curriculum-probe.yml'
permissions:
  contents: read
concurrency:
  group: curriculum-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check syntax, model bounds and independent numerical examples
        run: node scripts/curriculum-probe.mjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: curriculum-model-probe
          path: review-output/curriculum-probe.json
          retention-days: 14
