name: Curriculum validation
on:
  push:
    branches: [feat/curriculum-gap-expansion]
    paths: ['src/**', 'scripts/**', 'tests/**', 'package.json', '.github/workflows/curriculum-probe.yml']
permissions:
  contents: write
concurrency:
  group: curriculum-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  models:
    if: github.repository == 'Lye-0/visual-cs-lab' && github.ref == 'refs/heads/feat/curriculum-gap-expansion'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate models and integrated site
        run: |
          mkdir -p review-output
          set +e
          node scripts/curriculum-probe.mjs > review-output/probe.log 2>&1
          echo $? > review-output/probe.exit
          npm run check > review-output/check.log 2>&1
          echo $? > review-output/check.exit
          exit 0
      - name: Exercise actual HTTP pages when the browser suite is present
        if: hashFiles('tests/curriculum-browser.mjs') != ''
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.63.0 > review-output/install.log 2>&1
          npx playwright install chromium >> review-output/install.log 2>&1
          set +e
          node tests/curriculum-browser.mjs > review-output/browser.log 2>&1
          echo $? > review-output/browser.exit
          exit 0
      - name: Record results without claiming missing checks passed
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          out=Path('review-output');out.mkdir(exist_ok=True)
          data={'sourceCommit':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'files':sorted(p.name for p in Path('src').glob('curriculum*')),'checks':{}}
          for kind in ['probe','check','browser']:
              code=out/(kind+'.exit');log=out/(kind+'.log')
              text=log.read_text(errors='replace') if log.exists() else ''
              errors=[]
              lines=text.splitlines()
              for i,line in enumerate(lines):
                  if re.search(r'^FAIL |^not ok |^\s+not ok |SyntaxError:|ReferenceError:|TypeError:|AssertionError',line):
                      errors.append('\n'.join(lines[max(0,i-2):min(len(lines),i+18)]))
              data['checks'][kind]={'exit':int(code.read_text()) if code.exists() else None,'errors':errors[:25],'tail':text[-9000:] if kind!='check' else '\n'.join(lines[-18:])}
          for name in ['curriculum-probe.json','curriculum-browser.json']:
              path=out/name
              if path.exists():
                  r=json.loads(path.read_text());data[name]={k:v for k,v in r.items() if k not in ['cases']}
                  data[name]['failures']=[c for c in r.get('cases',[]) if not c.get('passed')][:30]
          target=Path('docs/verification/curriculum-status.json');target.parent.mkdir(parents=True,exist_ok=True);target.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'sourceCommit':data['sourceCommit'],'checks':{k:v['exit'] for k,v in data['checks'].items()}},indent=2))
          PY
          expected=$(git ls-remote origin refs/heads/feat/curriculum-gap-expansion | cut -f1)
          if [ "$expected" = "$GITHUB_SHA" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- docs/verification/curriculum-status.json
            git diff --cached --quiet || git commit -m 'test: カリキュラム拡張の実測検証結果を記録'
            git push origin HEAD:refs/heads/feat/curriculum-gap-expansion
          fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: curriculum-test-logs
          path: review-output/
          retention-days: 7
      - name: Fail the run if any executed check failed
        if: always()
        run: |
          test "$(cat review-output/probe.exit)" = 0
          test "$(cat review-output/check.exit)" = 0
          if [ -f tests/curriculum-browser.mjs ]; then test "$(cat review-output/browser.exit)" = 0; fi
