/* A quiet reading layout; not a dashboard. */
:root{--muted:#b0bdcc;--dim:#91a1b5;--study-blue:#b0cdec}
[hidden]{display:none!important}
.reader,.reader-library,.reader-course-page{font-size:16px;max-width:1380px;margin:auto;overflow-wrap:anywhere}
.reader h1,.reader-course-page h1{font-size:clamp(24px,2.7vw,36px);line-height:1.5}
.reader p,.reader-library p,.reader-course-page p{line-height:1.9}
.reader .btn,.reader-library .btn,.reader-course-page .btn{font-size:14px;min-height:44px;white-space:normal;line-height:1.5}
.reader-overline,.study-overline{font-size:12px;font-weight:600;letter-spacing:.045em;color:var(--accent);margin:0 0 10px!important}
.reader-title{padding:4px 0 25px;border-bottom:1px solid var(--line);margin-bottom:22px}
.reader-title-top{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted);margin-bottom:13px;flex-wrap:wrap}
.reader-title>p{margin:12px 0;color:var(--muted);max-width:850px}
.reader-title-links{display:flex;justify-content:space-between;gap:16px;margin-top:18px;flex-wrap:wrap;font-size:13px}
.reader-title-links a{padding:5px 0;color:var(--study-blue);text-decoration:underline;text-underline-offset:4px}
.reader-phases{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:#0e141c;padding:6px;border:1px solid var(--line);border-radius:11px;margin:0 0 25px}
.reader-phases button{display:flex;align-items:center;justify-content:center;gap:9px;padding:12px 8px;min-height:50px;background:transparent;color:var(--muted);font-size:14px;border-radius:7px;line-height:1.5}
.reader-phases button span{font:12px var(--mono);width:24px;height:24px;display:grid;place-items:center;border:1px solid var(--line2);border-radius:50%;flex-shrink:0}
.reader-phases button.active{background:#233534;color:#d1eee4;box-shadow:inset 0 0 0 1px #547a70}
.reader-layout{display:grid;grid-template-columns:minmax(285px,.82fr) minmax(0,1.55fr);gap:27px;align-items:start}
.reader-layout>*{min-width:0}
.reader-guidance{padding:3px 0 22px}
.reader-guidance h2{font-size:23px;line-height:1.65;margin-bottom:13px}
.reader-guidance h3{font-size:16px;margin:0 0 8px;line-height:1.65}
.reader-guidance>p{margin:12px 0 18px;color:var(--text)}
.reader-guidance>.btn{margin-top:8px}
.reader-idea{margin:22px 0;padding:15px 17px;border-left:3px solid var(--accent);background:#14201f;border-radius:0 8px 8px 0}
.reader-idea p{font-size:15px;color:#d9e7e1}
.reader-hint{font-size:13px;color:var(--muted)!important;line-height:1.8!important}
.reader-variant-values{padding:16px 18px;border:1px solid var(--line2);border-radius:9px;background:#111b25;margin:18px 0}
.reader-variant-values p{font-size:14px;margin-top:9px}
.reader-controls{background:#10161e;padding:20px;border:1px solid var(--line);border-radius:11px;margin-top:4px}
.reader-controls h3{font-size:17px;margin-bottom:8px}
.reader-controls-caption{font-size:13px;color:var(--muted);margin-bottom:15px}
.reader-field{margin:18px 0 20px}
.reader-field label:not(.reader-toggle){display:block;font-size:14px;font-weight:550;margin-bottom:7px}
.reader-field input[type=text],.reader-field textarea,.reader-field select{width:100%;min-height:44px;padding:9px 11px;font-size:15px;border-color:#415165;line-height:1.65}
.reader-field textarea{font:13px/1.7 var(--mono);resize:vertical;min-height:150px;white-space:pre;overflow:auto}
.reader-range-pair{display:grid;grid-template-columns:minmax(0,1fr) 84px;align-items:center;gap:14px}
.reader-range-pair input[type=number]{min-width:0;width:100%;min-height:44px;font-size:15px;padding:7px}
.reader input[type=range]{width:100%;min-height:44px;accent-color:var(--accent);cursor:pointer;touch-action:pan-y;background:transparent}
.reader-toggle{display:flex;align-items:center;gap:11px;min-height:44px;cursor:pointer;padding:4px 0;font-size:14px;line-height:1.7}
.reader-toggle input{width:21px;height:21px;flex-shrink:0}
.reader-field-help{font-size:12px;line-height:1.75!important;color:var(--muted);margin-top:6px}
.reader-live-status{font-size:13px;color:var(--study-blue);margin:12px 0 0;min-height:24px}
.reader-more-controls,.reader-terms{border-top:1px solid var(--line2);padding-top:12px;margin:18px 0}
.reader summary,.study-linear summary{min-height:44px;cursor:pointer;padding:9px 0;color:var(--study-blue);font-size:14px;font-weight:550;line-height:1.7}
.reader-terms{padding:12px 4px;font-size:14px}
.reader-terms dt{font-weight:650;color:var(--text);margin:10px 0 4px}
.reader-terms dd{margin:0;color:var(--muted);line-height:1.85}
.reader-figure{margin:0;border:1px solid #32414f;border-radius:12px;background:#111820;min-width:0;overflow:hidden}
.reader-figure figcaption{padding:20px 23px;border-bottom:1px solid #2d3a47;display:flex;align-items:center;justify-content:space-between;gap:15px}
.reader-figure figcaption h2{font-size:19px;line-height:1.5}
.reader-live-dot{font-size:11px;color:var(--muted);white-space:nowrap}
.reader-diagram{padding:22px 18px 16px;min-height:220px;overflow:auto;max-width:100%;overscroll-behavior-x:contain;scrollbar-color:#5b726e #111820;scrollbar-width:thin}
.reader-diagram>svg{width:100%;height:auto;min-width:560px;max-height:none}
.reader-result-placeholder{padding:30px 22px;min-height:230px;display:flex;justify-content:center;flex-direction:column;color:var(--muted)}
.reader-result-placeholder h3{font-size:18px;margin-bottom:10px}

R('gc',p=>{
 const ids=['A','B','C','D','E'];const roots=String(p.roots).split(/[\s,]+/).filter(Boolean);
 if(roots.some(x=>!ids.includes(x)))throw Error('根はA〜Eをカンマで区切ってください。空欄では根がありません。');
 const edges=[['A','B'],['B','C'],['C','B'],['D','E'],['E','D'],...(p.bridge?[['C','D']]:[])].map(([a,b])=>({a,b}));
 const seen=new Set(),frames=[],work=[...new Set(roots)],swept=new Set();
 const picture=active=>({type:'network',directed:true,active,nodes:ids.map((id,i)=>({id,label:`${id} · ${swept.has(id)?'回収':seen.has(id)?'印あり':'未到達'}`,x:[130,360,590,300,530][i],y:i<3?110:280})),edges:clone(edges),detail:`根: ${roots.join(', ')||'なし'} / 灰色待ち行列: ${work.join(', ')||'空'}`});
 frames.push(F('根から到達できるものを探す','参照数ではなく、根からたどって到達できるかで判定します。DとEは互いを参照しています。',picture(null)));
 while(work.length){const id=work.pop();if(seen.has(id))continue;seen.add(id);for(const e of edges)if(e.a===id&&!seen.has(e.b))work.push(e.b);frames.push(F(`${id}に印を付ける`,'参照先を探索します。既に印があるものは再び探索しないので、循環があっても終了します。',picture(id),{'到達した数':seen.size}));}
 for(const id of ids)if(!seen.has(id)){swept.add(id);frames.push(F(`${id}を回収する`,'Markが終了した後、印のないオブジェクトをSweepします。互いを参照する循環も、根から到達できなければ回収対象です。',picture(id)));}
 frames.push(F('回収後のヒープ','この教材は停止型のMark & Sweepです。並行GC・世代別GC・移動・弱参照は含めません。',{type:'cells',rows:[{label:'保持',values:[...seen].sort().length?[...seen].sort():['なし']},{label:'回収',values:[...swept].length?[...swept]:['なし']}]}));
 return out(frames,{'オブジェクト数':5,'保持':seen.size,'回収':swept.size});
});

R('branchpredict',p=>{
 const outcomes=String(p.pattern).replace(/[\s,]/g,'').toUpperCase();if(!/^[TN]{1,40}$/.test(outcomes))throw Error('T（分岐する）とN（しない）を1〜40個入力してください。');
 let counter=p.initial,last=counter>=2,wrong=0;const frames=[],rows=[];
 for(const actual of outcomes){const predicted=p.method==='static'?false:p.method==='one'?last:counter>=2;const bad=predicted!==(actual==='T');wrong+=Number(bad);const before=counter;counter=Math.max(0,Math.min(3,counter+(actual==='T'?1:-1)));last=actual==='T';rows.push([rows.length+1,predicted?'T':'N',actual,bad?'外れ':'的中']);frames.push(F(`予測 ${predicted?'T':'N'} → 実際 ${actual}`,p.method==='two'?`2ビットカウンタ ${before} → ${counter}。2以上をTと予測し、結果の方向へ1段だけ変更します。`:'予測結果を実際の分岐と照合します。予測が外れたときの回復を、固定の追加コストで表します。',{type:'cells',rows:[{label:'予測方式',values:[p.method==='two'?'2ビット飽和':p.method==='one'?'直前の結果':'常にN']},{label:'予測 / 実際',values:[predicted?'T':'N',actual]},{label:'カウンタ',values:[counter]}]},{'予測外れ':wrong},{headers:['回','予測','実際','結果'],rows:clone(rows)}));}
 return out(frames,{'分岐回数':outcomes.length,'予測外れ':wrong,'的中率':`${round((1-wrong/outcomes.length)*100)}%`,'固定コスト換算':outcomes.length+wrong*p.penalty},'1分岐=1単位、予測外れごとに設定値を加算。実CPUのIPC・投機実行時間ではありません。');
});

R('translation',p=>{
 const refs=parseNumbers(p.addresses,24);if(refs.some(x=>x<0||!Number.isInteger(x)||x>=p.pageSize*4))throw Error(`アドレスは0〜${p.pageSize*4-1}の整数にしてください。`);
 const table=[{pfn:4,write:true},{pfn:1,write:false},{pfn:6,write:true},{pfn:null,write:true}],tlb=[],frames=[];let hits=0,walks=0,faults=0,denied=0;
 for(const va of refs){const vpn=Math.floor(va/p.pageSize),offset=va%p.pageSize,entry=table[vpn],hit=p.tlb&&tlb.includes(vpn);if(hit)hits++;else walks++;let pa='—',status=hit?'TLB hit':'ページ表を参照';if(entry.pfn===null){faults++;if(p.resolve){entry.pfn=7;status='ページフォルト → frame 7を割当 → 再実行';}else status='ページフォルト（未解決）';}

  frames.push(F(`仮想アドレス ${va}: ${status}`,'ページ番号を物理フレームへ変換し、オフセットはそのまま足します。TLBがヒットしてもアクセス権限の確認は省略しません。',{type:'flow',nodes:[`VA ${va}`,`VPN ${vpn} + ${offset}`,`PFN ${entry.pfn??'不在'}`,`PA ${pa}`],active:3,failed:pa==='—'},{'TLBヒット':hits,'ページ表参照':walks,'ページフォルト':faults},{headers:['VPN','PFN','書込み'],rows:table.map((x,i)=>[i,x.pfn??'不在',x.write?'許可':'不可'])}));
 }
 return out(frames,{'参照回数':refs.length,'TLBヒット':hits,'ページ表参照':walks,'ページフォルト':faults,'保護違反':denied},'4仮想ページ・固定ページサイズ・LRUの小さなTLB。ページイン時にページ表を更新する操作を1段にまとめています。');
});

R('semaphore',p=>{
 const ops=p.operations.toUpperCase().split(/[\s,]+/).filter(Boolean);if(!ops.length||ops.length>30||ops.some(x=>!['P','C'].includes(x)))throw Error('P（生産）とC（消費）を1〜30個、カンマで入力してください。');

R('turing',p=>{
 const tape=[...'1'.repeat(p.a)+'#'+'1'.repeat(p.b),'□'],frames=[];let head=0,state='q0',steps=0;
 while(state!=='HALT'&&steps<40){const read=tape[head],from=state;let action='';if(state==='q0'&&read==='1'){head++;action='右へ';}else if(state==='q0'&&read==='#'){tape[head]='1';head++;state='q1';action='#を1にして右へ';}else if(state==='q1'&&read==='1'){head++;action='右へ';}else if(state==='q1'&&read==='□'){head--;state='q2';action='左へ';}else if(state==='q2'&&read==='1'){tape[head]='□';state='HALT';action='最後の1を消して停止';}else throw Error('教材の遷移規則に一致しません。');steps++;frames.push(F(`${from}: ${read}を読む → ${action}`,'1の個数で自然数を表します。区切りを1に変えた分、末尾の1を消して個数を合わせる固定のチューリング機械です。',{type:'cells',rows:[{label:'テープ',values:tape.map((x,i)=>i===head?`[${x}]`:x)},{label:'内部状態',values:[state]}]},{'ステップ':steps,'ヘッド位置':head}));}
 return out(frames,{'入力A':p.a,'入力B':p.b,'結果の1の個数':tape.filter(x=>x==='1').length,'ステップ':steps,'状態':state},'固定の単項加算機械。すべてのプログラムの停止性を判定する教材ではありません。');

R('linkstate',p=>{
 const ids=['A','B','C','D','E'],coords=[[100,180],[290,90],[290,290],[500,180],[680,180]],base=[['A','B',2],['A','C',4],['B','C',2],['B','D',2],['C','D',3],['D','E',1]].map(([a,b,cost])=>({a,b,cost}));

 for(let roundId=0;roundId<6;roundId++){const rows=ids.map(id=>{const db=known.has(id)?updated:base,r=L.shortest(ids,db,id,'E');return[id,known.has(id)?'新しい情報':'古い情報',r.path.join(' → ')||'なし',Number.isFinite(r.dist.E)?r.dist.E:'到達不可'];});frames.push(F(`情報伝達 ${roundId} ホップ後`,'物理的なリンクの変更と、全ルーターが変更を知る時刻を区別します。知っているリンク情報から、各ルーターが自分の経路を計算します。',view(),{'更新済み':known.size},{headers:['ルーター','情報の版','Eへの経路','コスト'],rows}));
  const next=new Set(known);for(const e of updated)if(!e.off){if(known.has(e.a))next.add(e.b);if(known.has(e.b))next.add(e.a);}if(next.size===known.size)break;for(const id of next)known.add(id);

  const sent=[];for(let i=0;i<p.capacity&&queue.length;i++){let idx=p.policy==='priority'?queue.findIndex(x=>x.kind==='voice'):0;if(idx<0)idx=0;const item=queue.splice(idx,1)[0],wait=t-item.at;sent.push(item.kind==='voice'?'音声':'転送');if(item.kind==='voice'){voice++;delayVoice+=wait;}else{bulk++;delayBulk+=wait;}}

 const probability=2**(-p.bits),information=-Math.log2(probability);
 const terms=[term('p','出来事の確率',probability,'起きる前の確率です。'),term('i','自己情報量',information+' bit','その出来事が起きたと知ったときの情報量です。')];
 return out([F('まず、出来事の起きにくさを見る',`起きる確率は1/${2**p.bits}です。「起きた」と聞いたときの驚きを、確率から数にします。`,calc(`p = 1 / ${2**p.bits}`,terms)),F('確率の逆数を取る','確率が半分になるごとに、逆数は2倍になります。',calc(`1 / p = ${2**p.bits}`,terms)),F('2を何回掛けた大きさかを読む','対数の底を2にすると単位はbitです。ここではI = log₂(1/p)を計算しています。',calc(`I = −log₂(${probability}) = ${information} bit`,terms))],{'確率':probability,'自己情報量 (bit)':information});

 const q=p.prior/100,e=p.error/100,y=q*(1-e)+(1-q)*e,hy=entropy([y,1-y]),noise=entropy([e,1-e]),mutual=hy-noise,capacity=1-noise;

function parseCodes(s){const codes=String(s).trim().split(/[\s,、]+/).filter(Boolean);if(codes.length<2||codes.length>6||codes.some(x=>!/^[01]{1,8}$/.test(x))||new Set(codes).size!==codes.length)throw Error('重複のない符号語を2〜6個、各1〜8ビットで入力してください。');return codes;}
R('prefix-codes',p=>{
 const codes=parseCodes(p.codes),pairs=[];codes.forEach((a,i)=>codes.forEach((b,j)=>{if(i!==j&&b.startsWith(a))pairs.push([String.fromCharCode(65+i),a,String.fromCharCode(65+j),b]);}));
 const frames=[F('記号にビット列を割り当てる','符号語を途中で区切る目印は送らない条件を考えます。',{type:'cells',rows:codes.map((x,i)=>({label:String.fromCharCode(65+i),values:[x]}))}),F('他の符号語の先頭になっていないか調べる',pairs.length?'ある符号語が別の符号語の先頭です。この検査だけで「一意的復号不可能」とまでは言えません。':'どの符号語も別の符号語の先頭ではありません。記号を読み終えるたびに区切れる瞬時符号です。',{type:'lesson-code-tree',codes}, {},{headers:['記号','接頭辞','相手','符号語'],rows:pairs})];
 // A bounded witness search proves ambiguity when it finds TWO messages with one bit string.
 const seen=new Map();let witness=null;
 const visit=(bits,message,depth)=>{if(witness||depth===0)return;codes.forEach((code,i)=>{if(witness)return;const next=bits+code,word=message+String.fromCharCode(65+i);if(seen.has(next)&&seen.get(next)!==word){witness=[next,seen.get(next),word];return;}seen.set(next,word);visit(next,word,depth-1);});};visit('','',4);
 frames.push(F('一意的復号とは別に確認する',witness?`ビット列 ${witness[0]} は ${witness[1]} と ${witness[2]} の両方に復号できます。具体的な反例が見つかりました。`:pairs.length?'4記号までの探索では反例が見つかりません。この有限探索で、一意的復号可能だと証明したことにはしません。':'接頭辞条件を満たすので、一意的にも復号できます。',{type:'cells',rows:[{label:'瞬時復号',values:[pairs.length?'不可':'可能']},{label:'一意的復号',values:[witness?'反例あり':pairs.length?'この探索だけでは未判定':'可能']}]}));
 return out(frames,{'瞬時復号':pairs.length?'不可':'可能','接頭辞の組数':pairs.length,'一意的復号':witness?'反例あり':pairs.length?'未判定':'可能'});
});

});

R('shannon-fano',p=>{
 const probs=weights(p.weights,4),items=probs.map((q,i)=>({q,name:String.fromCharCode(65+i),code:''})).filter(x=>x.q>0).sort((a,b)=>b.q-a.q||a.name.localeCompare(b.name)),frames=[];
 function split(xs,prefix){if(xs.length===1){xs[0].code=prefix||'0';return;}const total=xs.reduce((s,x)=>s+x.q,0);let best=1,diff=Infinity,left=0;for(let i=1;i<xs.length;i++){left+=xs[i-1].q;const d=Math.abs(total-2*left);if(d<diff){diff=d;best=i;}}const a=xs.slice(0,best),b=xs.slice(best);frames.push(F(`${xs.map(x=>x.name).join('・')}を2つに分ける`,'確率の大きい順に並べ、両側の確率の和ができるだけ近い位置で分けます。同率なら先の境界を選ぶ規則です。',{type:'cells',rows:[{label:prefix+'0',values:a.map(x=>`${x.name}: ${number(x.q)}`)},{label:prefix+'1',values:b.map(x=>`${x.name}: ${number(x.q)}`)}]}));split(a,prefix+'0');split(b,prefix+'1');}
 split(items,'');const average=items.reduce((s,x)=>s+x.q*x.code.length,0);
 frames.push(F('通った枝を順に読む','Huffmanの「小さい2つをまとめる」操作と混同せず、こちらは全体を分けていく手順です。',{type:'lesson-code-tree',codes:items.map(x=>x.code),names:items.map(x=>x.name)}, {},{headers:['記号','確率','符号','長さ'],rows:items.map(x=>[x.name,number(x.q),x.code,x.code.length])}));return out(frames,{'平均符号長':number(average),'エントロピー':number(entropy(probs))});

['c01-utf8','「A」「あ」「🔒」は見た目ではそれぞれ1文字ですが、ファイルでは同じ長さでしょうか。','文字に付いた番号であるコードポイントと、その番号を保存するバイト列は別です。UTF-8は番号に応じて1〜4バイトを使います。','Aの行を選ぶつもりで見て、コードポイントU+0041と1バイトの41を対応させます。次に「あ」の行で、1つのコードポイントが複数バイトになっていることを確かめます。','見た目の文字数、コードポイント数、UTF-16コード単位数、バイト数は、いつも一致するわけではありません。','計算機科学入門 pp.2–4','text'],
['c01-huffman','長い文章で、よく出る文字にも珍しい文字にも同じビット数を使うのは得でしょうか。','出現頻度の小さい2つをまとめ、まとめたものを再び候補へ戻します。最後にできた木を根からたどって符号を読みます。','初期文字列ではAが8回、Bが4回、Cが2回、DとEが1回ずつです。まず頻度1と1をまとめるところを追い、最後にAの符号長とDの符号長を比べます。','短くなった符号部分だけで、実ファイルの圧縮率は決まりません。復号に必要な符号表を共有するコストは別です。','情報理論 pp.12–16','text'],
['c01-hamming','送信した0と1が1か所変わってしまったとき、受信側はどこが変わったかを知らされません。','複数の検査の組み合わせが、1ビット誤りの位置を区別します。まず検査用のビットを加え、受信側で同じ検査を行います。','4ビットを7ビットへ変換し、位置3を反転した例を1段ずつ見ます。訂正が起こる前に、検査結果から位置3と判断できることに注目します。','この単元は検査ビットを位置1・2・4に置く表記です。ノートの情報ビット先頭の並びを追う場合は「生成行列・検査行列・シンドローム」を開いてください。','情報理論 pp.20–23','flip'],
['c02-set','2つの名簿から「両方に載る人」と「どちらかに載る人」を取り出すと、同じ結果になるでしょうか。','集合は要素のまとまりです。共通部分は両方にある要素、和集合はいずれかにある要素、差集合は片側にだけある要素を選びます。','A={1,2,3,4}、B={3,4,5}の例では、3と4は両方にあります。演算だけを切り替え、同じ入力から選ばれる要素が変わるところを見ます。','集合では重複を数えません。1,1,2という入力を3要素の集合として扱わないことにも注意します。','','op'],
['c02-dfa','長いビット列に1が偶数個あるかを知るために、読んだ文字を全部保存する必要はあるでしょうか。','今までの1の個数が偶数か奇数か、2つの状態だけを覚えます。0では変わらず、1で状態を切り替えます。','最初の状態は偶数です。101101を1文字ずつ読み、1のときだけ矢印をたどります。途中の状態と、入力を全部読み終えた時点の受理を分けて確認します。','受理状態を一度通っただけで、その後に残った入力まで受理したことにはなりません。','計算機科学入門 pp.17–20','input'],
['c03-matrix','座標の数字をまとめて変えるだけで、正方形を傾けたり裏返したりできます。','2×2行列の第1列は横方向の基準、第2列は縦方向の基準がどこへ移るかを表します。各点は2つの基準の組み合わせで移ります。','初期行列では横の基準(1,0)はそのまま、縦の基準(0,1)は(0.6,1)へ移ります。頂点を先に確認してから、面積の倍率を読むと対応が分かります。','行列式の符号と面積の大きさを混同しないでください。負の符号は向きの反転も表します。','','b'],
['c03-derivative','曲線の1点での傾きは、離れた2点の傾きとどう関係するのでしょう。','2点間の高さの差を横の差hで割ると割線の傾きになります。hを小さくした極限が微分の考え方です。','f(x)=x²、x=1、h=0.5なら、(2.25−1)/0.5=2.5です。hを小さくして2へ近づく様子を、厳密な値2xと比べます。','hを0にして割り算するのではありません。具体例のグラフが一般の関数の微分を証明するわけでもありません。','','h'],
['c03-integral','曲線の下の面積を、計算しやすい小さな形に分けて求めます。','各区間の両端の高さを結び、台形の面積を足します。どの範囲まで足したかが部分和です。','初期例はx²の0〜2です。最初の台形を見てから、1つずつ追加していきます。分割数だけを増やしたとき、解析的な値8/3との差を比べます。','図を滑らかに描くことと、積分の区間を細かくすることは別です。再生速度を変えても数値積分は変わりません。','','n'],
['c03-probability','成功確率50%の試行でも、毎回ちょうど半分が成功するとは限りません。','確率は試行前の仕組みを表し、相対頻度は実際に起きた回数から求めます。回数を増やしたときのばらつきを観察します。','成功確率を50%に固定して、試行回数とseedを別々に変えます。同じseedなら同じ擬似乱数列を再現できるので、比較の条件をそろえられます。','大数の法則は、短い区間で必ず割合が確率へ近づき続けるという主張ではありません。','情報理論 p.2','n'],
['c03-bayes','よく検知できる装置の警告なら、その対象が本当に存在する確率も同じくらい高いのでしょうか。','対象が少ないと、多数の正常なものから出る少しの誤警告が結果を大きく変えます。警告全体を分母に取り直します。','架空の1万人で、対象1%は100人です。そのうち95%の95人を検知し、正常9900人の5%から495件の誤警告が出ます。警告内の対象は95/(95+495)です。','これは合成データで条件付き確率を学ぶ例です。医療検査など実際の判断を行うツールではありません。','情報理論 p.2','base'],
['c04-trace','プログラムを読んだだけでは、繰り返しの中の条件が何回成立するか分かりにくいことがあります。','変数はその時点の値を持ちます。処理する行、条件の結果、更新前後の値を同時に追うと流れを確認できます。','1〜10のうち3で割り切れる数だけを足します。3、6、9でだけ合計が更新され、最後は18です。条件を満たさない回には何が変わらないかも見てください。','繰り返し回数と、条件の中の処理が実行される回数は同じとは限りません。','','divisor'],
['c04-recursion','関数が自分を呼び出している間、途中までの計算はどこで待つのでしょう。','呼び出しごとに別の実行状態が積まれます。小さい問題の答えが戻ると、待っていた計算が再開します。','5!を計算するとき、5×4!の5は待っています。呼び出しが深くなる方向だけでなく、答えが戻って掛け算される方向も1段ずつ追います。','同じ関数名でも、すべての呼び出しが1個の変数を共有するわけではありません。','','n'],
['c04-eventloop','0msのタイマーを登録しても、その場所ですぐ実行されるわけではありません。','実行中の処理、マイクロタスク、次のタスクを分けます。コールバックを登録することと、実行することの間に順序があります。','まず同期的な処理を追い、Promiseのコールバックが待つ場所を確認します。タイマーのコールバックと、どちらが先に取り出されるかを比べます。','この教材はブラウザの固定例です。0msは正確な実行時刻の保証ではなく、Node.jsの全フェーズを再現しているわけでもありません。','','microtasks'],
['c05-stack','上に重ねた本を、上から取り出すことを考えます。','最後に追加した要素を最初に取り出す規則がLIFOです。要素の大きさではなく、追加した順番で決まります。','3、7、2、9の順に積み、2個取り出します。9の次は2です。残る3と7について、なぜ先に出てこなかったのか説明してみます。','最小値から取り出すヒープとは異なります。値が9だから先に出るのではありません。','','remove'],
['c05-queue','受付に並んだ人を、先に来た人から案内します。','先に追加した要素を先に取り出す規則がFIFOです。追加する側と取り出す側を分けて見ます。','3、7、2、9の順に入れ、2個取り出すと3、7の順です。同じ入力のスタックと、取り出す側の違いを確かめます。','キューに優先度を付けた場合は別の規則です。ここでは単純な到着順だけを扱います。','','remove'],
['c05-bst','同じ数字を保存しても、並べ方によって探しやすさは変わります。','二分探索木は、各節点より小さい値を左、大きい値を右へ進めます。挿入する順番が木の形に影響します。','8を根にして3と10を入れます。その後の6が8の左、3の右へ進むことを追ってください。昇順で追加した例と深さを比較できます。','このモデルは自動で平衡化しません。二分探索木なら常に浅い木になるとは限りません。','','values'],
['c05-heap','たくさんの仕事から、いちばん小さな優先度だけをすぐ取り出したいとします。','最小ヒープでは親が子以下になる関係を保ちます。新しい値は、その関係が回復するまで上へ移ります。','8、3と追加すると3が上へ移ります。1を追加したときの交換を追い、根が最小になることを確認します。','親子の関係を守るだけなので、配列全体が昇順に並んだ状態とは異なります。','','values'],
['c05-hash','データから保存先の番号を直接計算できると便利ですが、同じ番号になるデータもあります。','この例では値をバケット数で割った余りを保存先にします。同じ余りの要素は同じバケットの列に入れます。','バケット数5では10と15がどちらも0に入ります。17と22も同じ余りです。バケット数を変え、どの組み合わせの衝突が解けるか見ます。','衝突したから同じデータだとは限りません。暗号学的ハッシュの安全性を調べる実験ではありません。','','size'],
['c06-sort','同じ数字を小さい順へ並べるにも、いくつもの手順があります。','並べ替えでは、比較・交換・分割などの操作を積み重ねます。入力をそろえて操作回数を比べることが大切です。','初期配列をバブルソートで1段ずつ追い、隣どうしを比較する範囲を見ます。配列を変えずに挿入ソートへ切り替え、同じ答えに至る違う過程を比べます。','画面の再生が短いことだけで、実装が高速だとは言えません。比較回数や教材の計数規則を見てください。','','algorithm'],
['c06-search','目的の数がどこにあるか、全部を順番に見なくても探せるでしょうか。','昇順という前提があれば、中央と比べて候補の半分を除けます。線形探索は順に確認します。','1,3,…,23から17を探します。二分探索で候補の左右端がどこへ狭まるかを見た後、同じ配列を線形探索で調べます。','候補を半分にするには、整列などの前提が必要です。どんな配列でも同じように二分探索できるわけではありません。','','method'],
['c06-graph','道が分かれたり合流したりするとき、どの順番で頂点を調べればよいでしょう。','BFSは近い層から、DFSは1本の道を深く進みます。次に調べる候補をどこへ入れ、どこから取るかが違います。','開始点の隣を候補に入れた時点で止めます。次に選ぶ頂点を予想してから、BFSとDFSを切り替えて確認します。','訪問順と最短経路は同じものではありません。重み付き最短経路の全問題をこの探索順だけで解くわけではありません。','','method'],
['c06-dp','容量の限られたかばんへ、どの荷物を入れると価値が最大になるでしょう。','小さい容量と少ない荷物での答えを表にします。現在の荷物を入れない場合と、入れる場合を比べて更新します。','表の1セルを選ぶつもりで見て、上の行から引き継ぐ値と、荷物の重さを引いた容量の値を比較します。最後の値だけでなく参照するセルを追います。','この問題は各荷物を0回か1回だけ使います。好きなだけ同じ荷物を使える問題とは更新式が異なります。','','capacity'],
['c07-compiler','2 + 3 × 4の文字列は、なぜ20ではなく14になるのでしょう。','文字の並びをトークンへ分け、演算子の結び付き方を構文木にします。木の内側の計算から評価します。','最初に3と4の掛け算がまとまっていることを見ます。(2 + 3) * 4へ入力を変え、同じ数字でも木の形と結果が変わるところを追います。','計算結果だけを見ると、構文解析が何をしたかは分かりません。これは小さな算術式だけの処理系です。','計算機科学入門 pp.5,21–23,38','code'],
['c07-gc','互いに参照している2つのデータが、どの実行中の処理からも使われなくなったらどうするでしょう。','根から参照をたどり、到達するものに印を付けます。たどり終えてから、印のないものを回収します。','AからB、Cへたどる間、DとEの輪には届きません。CからDへの参照を1本足し、DとEが回収されなくなる理由を見ます。','参照があることと、根から到達できることは違います。この画面は実際のJavaScriptのGCを操作しません。','','bridge'],
['c08-gate','2つのスイッチから「両方オン」「少なくとも一方オン」といった条件を作ります。','AND・OR・XORなどは、入力の0/1の組に出力を対応させる規則です。真理値表の1行が、今のスイッチの状態に当たります。','A=1、B=0でANDの出力を見ます。Bだけを1にして、表のどの行へ移ったか確認します。次にORへ変え、規則だけを変えた違いを見ます。','0と1はここでは偽と真です。普通の足し算と論理演算を同じものとして読まないでください。','計算機科学入門 pp.6–9','a,b,gate'],
['c08-adder','1 + 1は2ですが、1桁には0か1しか置けません。あふれた分をどこへ渡すのでしょう。','和の下位1ビットがsum、上の桁へ渡すビットがcarryです。全加算器は下の桁から来たcarryも受け取ります。','A=1、B=1、Cin=0では合計2=10₂です。sum=0とcarry=1を並べて読みます。Cinも1にすると3=11₂になり、どちらの出力が変わるか確かめます。','sumだけを答えだと考えると、1+1=0に見えてしまいます。桁上がりと組にして読みます。','計算機科学入門 pp.10–11','a,b,carry'],
['c09-cpu','足し算の命令を書いたとき、計算に使う値はどこから来て、どこへ入るのでしょう。','命令は操作の種類と対象を指定します。レジスタはCPU内の作業用の場所、メモリの番地は外側の保存場所として区別します。','MOVでR1に5、R2に8を入れ、ADDでR3に13を入れます。STORE R3,16では、16という値をR3へ入れるのではなく番地16へ書き込みます。','この教材ISAはノートに載った機械語と命令形式が異なります。実在CPUの命令コードをそのまま実行しているわけではありません。','計算機科学入門 pp.28–32','code'],
['c09-pipeline','1つの命令を速くする以外に、全体として多くの命令を終える方法はあるでしょうか。','命令の作業を段階に分け、別の命令の異なる段階を同時に進めます。途中結果を待つ場合には空きが生じます。','6命令を順番に処理する例と、5段を重ねる例を比べます。I3に依存を入れたとき、どの段が止まり、何を待っているかを見てください。','命令1個の遅延と、一定時間で終える命令数は別の指標です。すべての命令を無条件で同時実行できるわけではありません。','計算機科学入門 p.28','pipeline'],
['c09-cache','最近読んだ値を近くに置いておけば、次は速く読めるかもしれません。','アドレスからキャッシュの場所と識別用のタグを求めます。その場所が埋まっていても、タグが違えば欲しいデータではありません。','0,4,8を読んだ後に0を読む例を追います。次に16を入れたとき、同じキャッシュ位置を使う0が追い出されるか確かめます。','空いている場所が別にあっても、直接マップでは使える場所が固定です。全てのミスが容量不足とは限りません。','計算機科学入門 p.34','addresses'],
['c09-branch','次に進む道が分かる前に作業を始めるには、どんな予想が役立つでしょう。','予測器は過去の結果を小さな状態にして覚えます。2ビットの状態は、一度外れただけで予想の向きを変えない場合があります。','TTTNTTTNという結果を繰り返します。Nの後のTで、直前の結果を使う方式と2ビット方式がどう違うかを確認します。','教材の固定ペナルティを実CPUの実測時間だと扱わないでください。結果列を予測器自身が先読みしているわけでもありません。','','method'],
['c10-pointer','「値10」と「10が置いてある場所の番号」は違います。','ポインタが持つのは場所を参照する値です。その場所へ書き込む操作は、ポインタの値そのものを書き換える操作とは異なります。','xの初期値10と参照先へ書く値25を見ます。参照を通して書いた後、変わったのがxの内容なのか、参照先の番号なのかを確かめます。','アドレスらしい番号が残っていても、その領域を解放した後に安全に使えるとは限りません。','計算機科学入門 pp.30–31,35','write'],
['c10-pages','必要なページがメモリに入りきらないとき、どれかを入れ替える必要があります。','物理フレームへ置けるページの数は限られています。FIFOは先に入れたもの、LRUは最も長く使っていないものを候補にします。','1,2,3を3フレームに置いた後、4を要求する場面で止めます。どれを取り出すかを予想してから、置換方針だけを変えて同じ参照列を追います。','この単元は置換の判断です。アプリごとの住所の意味は、先に「アプリごとの仮想アドレス空間」で確かめられます。','計算機科学入門 pp.34–35','policy'],
['c10-allocation','空き容量の合計は足りるのに、大きな連続領域を取れないことがあります。','確保と解放で小さな穴ができます。連続した空きの大きさと、全体の空き容量を分けて見ます。','いくつか領域を確保した後、最初の領域だけを解放します。次の要求がその穴に入るか、ほかの場所を使うかをFirst fitとBest fitで比べます。','離れた空きを足せば、連続した1つの領域になるわけではありません。','','release'],
['c10-translation','住所の変換が見つからないことと、データのページがメモリにないことは同じでしょうか。','TLBはページ表の情報を手早く使うための仕組みです。TLBになければページ表を見ます。ページ表でも不在なら別の処理が必要です。','仮想アドレス0と4は同じページにあります。2回目のTLBヒットを見た後、192の不在ページを確認します。書込みに変えると権限の判断も加わります。','TLBヒットでもアクセス権限の確認は必要です。TLBミスをすべてページフォルトと呼ばないでください。','計算機科学入門 p.35','tlb,write'],
['c11-scheduler','1台のCPUで複数の仕事を動かすとき、どの仕事へどれだけ時間を渡すでしょう。','実行できる仕事の待ち列から次を選びます。RRは時間量子ごとに順番を回し、FCFSやSJFは別の方針で選びます。','5,3,8,2の仕事が同時に到着した例です。時間量子2でP1が2だけ進んだ後、残りを待ってP2へ渡る場面を追います。','この例は到着時刻が全て0でI/O待ちを含みません。実OSの全スケジューリングを再現したものではありません。','計算機科学入門 pp.39–43','policy,quantum'],
['c11-files','ファイルに別の名前を付けると、その中身も2つに増えるのでしょうか。','ディレクトリの名前、inodeの情報、実際のデータブロックを分けます。複数の名前が同じinodeを指すことがあります。','7000バイトの内容を4096バイトのブロックで置く例を見ます。ハードリンク数だけを増やし、データブロックの数も同じだけ増えるかを確認します。','ハードリンクを作ることは、内容を独立した別ファイルへコピーすることとは異なります。','計算機科学入門 p.73','links'],
['c12-race','1を足す処理を2回したのに、結果が1しか増えないことがあります。','読み出す、足す、書き戻すは別の操作です。2つの処理が同じ古い値を読めば、後の書込みが先の更新を上書きします。','2つの処理が両方0を読んでから、どちらも1を書きます。処理を交互に進めた例を見た後、排他制御を入れ、読んだ値が変わる場所を探します。','単にCPUが2台あることだけが条件ではありません。1台でも処理の途中で切り替わると同じ問題を考えられます。','計算機科学入門 pp.48–49','lock'],
['c12-deadlock','互いに「相手が終わるまで待つ」と、どちらも終われなくなる場合があります。','資源を持ったまま別の資源を待つ関係が輪になります。この単一資源の例では、取得順序をそろえて輪を避けます。','AがX、BがYを持ってから相手の資源を要求する場面を見ます。両方がXから取るように変え、待つ場所がどこへ移るか確認します。','誰かが待っているだけでデッドロックとは限りません。待ちの輪と、誰が先へ進めるかを見てください。','計算機科学入門 p.49','order'],
['c12-quorum','同じデータを複数台に置くとき、何台の確認を待てばよいでしょう。','この例は過半数の台数を確認します。全台である必要はありませんが、停止が増えると必要数へ届かなくなります。','5台なら過半数は3台です。停止台数2と3を比べ、残った台数と必要な確認数の大小を見ます。','この台数計算だけで、分散合意や障害時の安全性が全て保証されたことにはなりません。','計算機科学入門 pp.60–61','failed'],
['c12-semaphore','空の箱から物を取り出したり、満杯の箱へ物を入れたりしないようにします。','空き数と要素数を別々に数えます。生産は空きを1つ減らして要素を増やし、消費は逆を行います。','容量3へPを4回続けると4回目は実行できません。その後Cで1つ消費すると、次のPが可能になります。空きと要素の和にも注目します。','このモデルの操作は1回だけ試すtry-waitです。失敗した処理が自動で待機し、後で再開するシミュレーションではありません。','','capacity'],
['c14-index','探したい行の手掛かりを、別にまとめて持っておくと何が変わるでしょう。','索引は条件に合う行へ近づくための構造です。全行を調べる方法と、索引をたどる方法でアクセスする対象が変わります。','ageが21以上という条件を固定し、索引のオン・オフだけを変えます。返る行が同じでも、調べた範囲やアクセス数が違うことを見ます。','索引には保存や更新のコストもあります。この教材の検索回数だけで全ての性能を判断しないでください。','','index'],
['c14-join','別々の表に入っている利用者と注文を、対応するキーで結び付けます。','結合は、条件に合う行の組を作る処理です。LEFT JOINは相手がなくても左の行を残します。','LEFTからINNERへ変え、相手がいない行がどこで結果から外れるか見ます。一致する行が複数なら、組も複数になることを確認します。','表を横に貼り合わせるだけではありません。キーの一致、重複、NULLになる欄を区別します。','','join'],
['c14-bplus','キーが増えて1つの節点に収まらなくなると、索引の木はどう育つのでしょう。','キーを整列した葉へ挿入し、容量を超えたら分割します。上の節点は、どの葉へ進むかを案内します。','10,20,5…の挿入を順に見ます。分割が起きる直前と直後を比べ、葉のキーと親へ増える区切りを区別します。','このモデルは次数4の挿入だけです。削除、ディスクのページ配置、実DBの全実装を含めたものではありません。','','values'],
['c14-transaction','残高への入金と出金を同時に処理しても、片方の変更を消さないようにしたいとします。','複数の読取り・計算・書込みをひとまとまりとして考えます。古い値を両方が読んだ場合と、直列化した場合を比べます。','入金と出金の読取り時点を先に確認します。その後ロックを有効にし、後から動く処理がどの残高を読むようになったかを追います。','トランザクションという名前だけで、このような全ての競合を同じ方法で防ぐわけではありません。分離の条件を確認します。','','serial'],
['c16-git','編集したファイルを、何でもそのまま次のコミットに入れるとは限りません。','作業ファイル、次に記録する内容を用意するステージ、保存済みのコミットを分けます。addとcommitは別の移動です。','notes.txtを編集してからaddします。commitの前に止め、作業ファイルとステージがどう違うかを見ます。commit後は履歴の新しい点と対応させます。','このコマンドは教材内の仮想Gitだけを変更します。ユーザーの実リポジトリへの書込みは行いません。','','script'],
['c16-reset','戻るコミットが同じでも、手元のファイルやステージまで戻したいとは限りません。','soft・mixed・hardは変更する状態の範囲が違います。履歴の線だけを見るのではなく3つの場所を並べます。','2つ目のコミットの後にsoft resetする例を見ます。最後のコマンドだけをmixed、hardへ変え、残った内容の場所を比べます。','履歴上の現在位置が戻ったことと、変更内容がどこにもなくなったことは同じではありません。','','script'],
['c16-branches','同じ出発点から別々の変更を行い、後で1つに合わせます。','ブランチ名はコミットを指します。マージでは両方の履歴と共通の土台から、合わせる変更を判断します。','featureとmainで別のファイルを追加します。マージの前にそれぞれが指す点を確かめ、合流後の親とファイルを見ます。','ブランチを作った瞬間に全ファイルの別コピーを新規コミットとして保存するわけではありません。','','script'],
['c16-rebase','自分の変更を、新しく進んだ土台の上から行ったように並べ直したい場合があります。','元のコミットをそのまま移動するのではなく、変更を新しい土台へ適用したコミットを作ります。','featureとmainが分かれた後、featureからrebase mainします。前後のファイルだけでなく、コミットの識別子と親が変わることを見ます。','見た目の内容が同じでも同じコミットとは限りません。このモデルは線形履歴とファイル単位の変更に範囲を絞っています。','','script'],
['c16-remote','相手の更新を知ること、自分へ取り込むこと、自分の更新を送ることを分けます。','fetchは追跡している参照を更新します。pullは取り込みを進め、pushは相手側の参照を更新する要求です。','リモートに変更がある状態でfetchし、ローカルの作業ファイルまで変わったか見ます。その後pullしたときとの違いを確かめます。','図で相手の点が見えることと、その変更を自分のブランチへ取り込んだことは同じではありません。','','script'],
['c16-undo','過去の変更を打ち消したいとき、履歴を戻す以外の方法もあります。','revertは逆向きの変更を新しいコミットにします。amendは直前のコミットを新しい内容のコミットで置き換えます。','追加ファイルをステージしてamendした後、revertを実行します。点が作り直される操作と、打ち消しの点が増える操作を区別します。','reset・amend・revertをすべて「元に戻す」という1つの図で扱うと、履歴とファイルの違いを見失います。','','script'],
['c16-testing','普段の入力で動くプログラムでも、境目だけで間違えることがあります。','仕様から、境目の直前・境目・直後を選びます。実装を変えずにテストを広げると、見えていなかった問題が現れます。','0〜12歳の入力で6歳未満を無料とする仕様です。6未満と6以下を取り違えた実装に対し、5・6・7を試す意味を考えます。','すべてPASSという結果は、用意した入力に対する結果です。プログラムの全入力が正しいという証明ではありません。','','suite'],
['c17-regression','散らばった点へ、できるだけ近い直線を引きたいとします。','直線の傾きと切片を、誤差が減る方向へ少しずつ更新します。どの程度ずつ動かすかが学習率です。','初期の直線を見てから1回だけ更新します。学習率を大きくしたとき、誤差が小さくなるのか飛び越えるのかを追います。','学習回数を増やすだけで必ず良くなるとは限りません。また、この合成データの結果だけで現実の予測性能は分かりません。','','rate'],
['c17-kmeans','点の集まりを、近いもの同士のグループに分けます。','中心に近いグループへ割り当て、各グループの中心を平均で動かします。この2つを交互に繰り返します。','k=3で、点の所属が変わる段階と中心が移動する段階を区別して見ます。次にkだけを変え、同じ点から違う分け方になることを確かめます。','データが自動的に唯一の正しいグループ数を教えてくれるわけではありません。ここではkを先に指定します。','','k'],
['c17-knn','未知の点の分類を、近くにある既知の点から予想します。','距離が近いk個を選び、その分類の多数決を取ります。1点だけを見る場合と、周囲を見る場合では判断が変わります。','未知点を固定し、k=1とk=3を比較します。選ばれた点と投票数を確認してから、最終ラベルを読みます。','1個の未知点で正解したことと、広いデータで良い分類器であることは違います。','','k'],
['c18-sampling','連続した波を、一定間隔の点だけで記録します。','記録する時刻以外の形は、標本だけから直接は見えません。標本が粗いと、別の波と区別しにくくなります。','7Hzの波を1秒間に24点で記録した例を見ます。標本数を減らし、元の波と記録された点がどう対応するかを確かめます。','点を線で結んだ見た目を、そのまま完全に復元された原信号だと考えないでください。','','samples'],
['c18-fourier','時間に沿った波の形を、どんな周波数がどれだけ含まれるかへ読み替えます。','DFTは標本列と各周波数の波との関係を計算します。入力した信号の周波数と、離散的な周波数の区切りを分けて見ます。','周波数5Hzで山の位置を確かめ、5.5Hzへ変えます。山が1本に集まる場合と周囲へ広がる場合の違いを観察します。','表示の棒を増やすだけで、元の観測時間や情報が増えるわけではありません。','','frequency'],
['c18-filter','細かく揺れる値を、周りの値と混ぜてなめらかにします。','各点の近傍を平均する操作を、同じ規則で全体へ適用します。どれだけ広い範囲を見るかで残る変化が変わります。','半径1なら左右の近くも使います。半径0で元の信号を確かめた後、大きくし、細かな揺れと急な変化の両方を見ます。','ノイズだけを都合よく消せるとは限りません。必要な急変もなまることがあります。','','radius'],
['c18-projection','立体の点を、平らな画面の点へ移す必要があります。','カメラからの距離で割る透視投影では、同じ大きさでも遠いものほど画面では小さくなります。','立方体の手前と奥の辺を見比べます。距離を変える操作と角度を変える操作を別々に試し、何が変わったか確認します。','回転と透視投影は別の段階です。画面が2Dだから計算も2Dだけで済んでいる、という意味ではありません。','','distance'],
['c18-image','画素の値を周囲と組み合わせることで、ぼかしや輪郭を作ります。','近傍の画素に係数を掛け、足し合わせます。カーネルの各位置が、元画像のどの画素に当たるかを見ます。','選んだ画素の周り3×3を確認し、平均カーネルの9個の項を足します。その後、輪郭のカーネルへ変え、負の係数の役割を比べます。','計算値と画面の表示値は別です。0〜255の外の値を表示で丸めても、計算した事実を消さないようにしています。','','kernel'],
['c19-pid','目標へ近づけようとして強く操作すると、逆に行き過ぎて揺れることがあります。','現在の誤差、過去の誤差の蓄積、変化の速さを組み合わせて操作量を決めます。P・I・Dは別の役割を持ちます。','Pゲインだけを増やし、目標へ近づく速さと行き過ぎを見ます。その後Dを変え、同じ目標で揺れ方を比較します。','この数値は架空の質点のためのものです。現実の機械へ設定する推奨値ではありません。','','kp'],
['c20-contrast','暗い背景でも、本文やボタンが読み取りやすい必要があります。','文字と背景の明るさの差をコントラスト比として計算します。文字サイズによって確認する基準も変わります。','深いダーク背景に暗い文字を置き、読みにくさと比の値を確認します。背景を固定したまま文字色を明るくして比べます。','比を満たすことだけでUIの使いやすさが完成するわけではありません。余白、文章、操作の手掛かりも必要です。','計算機科学入門 pp.67–72','foreground'],
['c20-privacy','便利な機能のためでも、何でも収集してよいとは限りません。','集める情報の細かさ、共有先、保存期間を別々に考えます。誰にどんな利益や不利益があるかを言葉で整理します。','精密な位置を集める場合と集めない場合で、できる機能と残るリスクを比べます。保存期間だけを短くした案とも区別します。','この教材の条件判定を倫理や法令の最終判断としません。現実の目的と関係者を含めた検討が必要です。','','days'],
['c02-turing','足し算という特別な部品を使わず、記号を書き換えるだけで数を足します。','テープ上の記号、ヘッドの位置、内部状態に応じて、次の1つの操作を決めます。','111#11は3と2を表す独自例です。#を1へ変えた後、末尾の1を1つ消すことで5個の1が残ります。状態が変わる理由も追います。','有限回動かして止まった例から、あらゆるプログラムが止まるかを判定できるとは言えません。','計算機科学入門 pp.24–27','a'],
['c01-information','「よくある話」と「めったにない話」では、知ったときの驚きが違います。','その出来事の確率の逆数に対数を取ります。確率が半分になると、底2の自己情報量は1bit増えます。','確率1/8は2を3回掛けた数の逆数です。log₂8=3なので自己情報量は3bitです。1/2の場合へ切り替えて比べます。','情報の有用性や価値の点数ではありません。また、自己情報量と多数の出来事の平均は区別します。','情報理論 p.3','bits'],
['c01-entropy','毎回どの出来事が起こるか分からないとき、平均してどれだけの情報を得るのでしょう。','各出来事の情報量に、その出来事が出る確率を掛けて足します。重み付き平均を図と式で一緒に読みます。','重み4,2,1,1なら確率は1/2,1/4,1/8,1/8です。寄与は1/2,1/2,3/8,3/8となり、合計は1.75bit/記号です。','4種類の自己情報量を単に4で割るのではありません。出やすさを掛け忘れないようにします。','情報理論 pp.3–4','weights'],
['c01-joint','Yを知った後でXも知るとき、初めてXだけを知る場合と同じ情報量でしょうか。','同時確率から全体の量を計算し、先に知った分を引いて残りを求めます。相互情報量は、知ることで減った不確かさです。','重み3,1,1,3を確率へ直し、4つの組を表に置きます。H(X,Y)からH(Y)を引く段階で、どの量が既知だったのか確認します。','図の重なりを眺めるだけで証明にはしません。H(X,Y)の「同時」と集合の「または」も混同しないようにします。','情報理論 pp.5–6','weights'],
['c01-markov','次に出る記号が、直前の状態によって出やすさを変える情報源を考えます。','状態から出る遷移の確率と、長い時間にその状態にいる確率を分けます。各状態の情報量は後者で重み付けします。','状態0→1が0.3、1→0が0.6なら、行き来が釣り合う比はπ₀:π₁=2:1です。この重みで各行のエントロピーを足します。','遷移行列のある行だけを平均しても、情報源全体のエントロピー率にはなりません。','情報理論 pp.7–8','a,b'],
['c01-channel','受け取った記号が、送られた記号についてどれだけ教えてくれるかを測ります。','入力が偏っている場合の伝送情報量と、入力分布も選べる場合の最大値である通信路容量を分けます。','1を送る確率0.3、反転率0.1なら、受け取る1の確率は0.3×0.9+0.7×0.1=0.34です。そこからH(Y)を計算します。','伝送情報量と通信路容量を同じ値として固定しません。ここでの単位はbit/記号であり、回線のMbpsではありません。','情報理論 pp.9–11','prior,error'],
['c01-prefix','区切り記号を付けずに送ったビット列を、文字へ戻したいとします。','別の符号語の途中で1つの符号語が終わらなければ、その場で区切れます。一意に復号できることとは区別して調べます。','0,10,110,111の木をたどります。別条件0,01,10では、同じ010がACとBAの両方になります。具体的な2通りを確認します。','接頭辞があるだけでは、一意的復号不可能と断定できません。反例探索の範囲も表示します。','情報理論 pp.12–13','codes'],
['c01-kraft','符号語を作る前に、指定された長さで二分木に収まるか知りたいとします。','長さ1の符号は木の半分、長さ2は4分の1を使います。その合計が1以下になるか調べます。','長さ1,2,3,3なら1/2+1/4+1/8+1/8=1です。1,1,2へ変えると1.25になり、同時に収められません。','不等式は、その長さの瞬時符号が存在する条件です。適当に選んだ符号語の先頭が重ならないことを自動で保証しません。','情報理論 p.14','lengths'],
['c01-shannon-fano','出やすい記号に短い符号を割り当てるため、全体を順に分割します。','大きい確率から並べ、両側の確率の和が近くなる位置で分けます。0と1を付けて同じ作業を繰り返します。','重み4,2,1,1を4と(2,1,1)に分け、右側をさらに2と(1,1)へ分けます。通った0/1を根から読むと符号になります。','小さい2つを下から結合するHuffmanとは、木を作る方向も判断も異なります。','情報理論 p.15','weights'],
['c01-distance','誤りの位置を考える前に、2つの符号がどれくらい違うかを数えます。','同じ位置の0/1が違うときだけ1を付け、その個数を数えます。XORと位置の対応を確認します。','1011010と1000010では、左から3番目と4番目が違います。XORの結果0011000の1が2個なので距離は2です。','この2語の距離と、符号集合のあらゆる異なる2語の距離の最小値は同じとは限りません。','情報理論 pp.17–18','a,b'],
['c01-linear-code','受信側には「何番を反転した」という入力を渡さず、検査結果だけで調べます。','Hの各行は1回の検査、各列はそのビットがどの検査へ参加するかを表します。1ビット誤りならシンドロームがその列と一致します。','情報1011を、ノートと同じ情報4＋検査3の順で符号化します。2番目を反転し、s₁,s₂,s₃を別々に計算すると111になり、Hの第2列に対応します。','検査結果000でも、任意の多重誤りがないと保証したわけではありません。今回は0または1ビットの誤りに限ります。','情報理論 pp.20–23','text,flip'],
['c02-nfa','次に進める先が複数あるとき、どれか1つを選ぶ必要があるでしょうか。','全ての可能な状態を集合として持ち、入力ごとに次の集合へ更新します。その集合自体を1つのDFAの状態と見なせます。','独自例では末尾01を受理します。0101を読み、0の直後に{q0,q1}、1の直後に{q0,q2}となるところを確認します。','集合状態は、複数の可能性を表しています。確率でいずれか1つの道を選ぶ仕組みではありません。','計算機科学入門 pp.18–20','input'],
['c08-nand','部品をNANDだけに絞ったとき、別の論理演算をどう組み立てますか。','同じ入力を2本へ入れると否定が作れます。二重否定やド・モルガンの対応を使い、複数のNANDへ分解します。','ORではAをNANDで否定し、Bも否定してから、その2つをNANDへ入れます。A=1,B=0の各中間値を順に計算します。','最終出力がたまたま1例で一致するだけでなく、入力の全組み合わせで確かめることが大切です。','計算機科学入門 p.8','gate,a,b'],
['c08-register','入力が変わるたびに上書きせず、必要なタイミングだけ覚える回路を作ります。','Muxは新しいDか、保持中のQかを選びます。DFFは選ばれた値をクロックで取り込みます。選択と取込みは別の役目です。','入力1011、load1101で3回目に注目します。D=1でもload=0なので、前のQを選んでそのまま保持します。','load=0はクロックが存在しないことではありません。前の値を入力へ戻して、結果として保持します。','計算機科学入門 pp.14–16','loads'],
['c10-address-spaces','2つのアプリが、どちらも「5番地」を使う場面を考えます。','アプリに見える仮想アドレスを、それぞれのページ表で物理アドレスへ対応させます。アプリ名とページ表も対応させて読みます。','アプリAの5は物理フレーム1内の5、つまり21へ対応します。同じ5をBから見ると物理フレーム2内の5、つまり37へ対応します。','この例は共有しない配置です。全てのアプリのページが必ず別の物理領域を指す、という一般規則ではありません。','計算機科学入門 p.35','process,address']

/* Network lessons: distinguish the message, its envelope, the next hop,
 * the application's view and the evidence available at each stage. */
(() => {
'use strict';
CSL.defineLessons([
['n01-packet','送りたい言葉だけを線へ流しても、誰のどのアプリへ渡すか分かりません。','各階層が、自分の仕事に必要な情報を外側へ付け加えます。受信側では逆の順番で、その情報を読んで中身を渡します。','Hello, network.という中身を見失わずに、TCPまたはUDP、IP、リンク層の情報が付く順を追います。最後まで同じ中身と、各段階で増える包みを区別します。','この最初の実験は固定ヘッダーの概念です。全プロトコルの実バイト列や実通信を再現していません。','計算機科学入門 pp.51–56','message,protocol'],
['n02-signal','太い回線に変えれば、遠くの相手への待ち時間もなくなるのでしょうか。','データを回線へ送り出す時間と、信号が距離を進む時間は別です。前者はデータ量と帯域、後者は距離と仮定した伝搬速度で決まります。','1500バイトを10Mbpsで送り出す時間は1500×8÷10,000,000秒です。帯域だけを増やし、この時間と距離による時間のどちらが変わるか確認します。','ここで足す時間は単純化した1区間の値です。DNS、再送、サーバー処理、待ち行列は別に必要です。','計算機科学入門 pp.50–51','bandwidth,distance'],
['n02-crc','データに付けた短い検査値で、受信したビット列の変化を見つけます。','2進多項式の割り算では、引き算をXORとして扱います。送信側が余りを付け、受信側が生成多項式で割り直します。','10110101に検査用の0を付けた段階から、1011による割り算を追います。反転なしと1ビット反転を比べ、受信側の余りが変わるか見ます。','CRCの検出と、ハミング符号の訂正は別です。余り0は、考えられる全ての誤りがなかった証拠ではありません。','情報理論 pp.24–25','data,flip'],
['n03-switch','スイッチは、初めて見た宛先がどの線の向こうにあるかをどう扱うのでしょう。','入ってきたフレームの送信元MACと入力ポートを対応付けて学習します。宛先が未学習なら、必要な範囲へ複製して探します。','AからBへ送る初回と、A/Bの所在を学習済みの状態を比較します。図のコピー先だけでなく、学習した情報が送信元についてのものだったことを確認します。','受信した宛先アドレスから、その相手が入力ポートにいると学習するわけではありません。','計算機科学入門 pp.51,56','learned'],
['n04-subnet','住所の一部を共通にして、同じネットワークにいる相手か判断します。','IPv4の32ビットを、先頭の共通部分と端末部分に分けます。プレフィックス長が区切りの位置です。','アドレスの10進表示とビット列を対応させ、プレフィックスを変えて同じネットワークの範囲がどこまで広がるか見ます。マスクを掛ける前後の値も確認します。','/24は端末番号24という意味ではありません。先頭24ビットをネットワーク側として使うという意味です。','計算機科学入門 pp.57–59','prefix'],
['n04-vlsm','50台の部屋と5台の部屋へ、同じ大きさのアドレス範囲を渡す必要があるでしょうか。','必要な台数に合う2のべき乗のブロックを選び、その大きさに合った境界へ置きます。大きいブロックから置くと穴を避けやすくなります。','必要台数50,10,25,5の例で、50台にはホスト用62個の/26を使います。次のブロックの開始位置が、サイズの倍数にそろうことを確かめます。','教材は従来型LANのネットワーク・ブロードキャストを除く計算です。/31や/32へそのまま「2を引く」を広げないでください。','計算機科学入門 pp.57–58','hosts,sorted'],
['n05-arp','IPで最終的な相手を指定しても、今のLANで誰へフレームを渡すかを調べる必要があります。','ARPは同じリンク上でIPv4に対応するMACを尋ねます。別ネットワークの相手へ送るなら、まずゲートウェイのMACを調べます。','同じネットワークの宛先と、別ネットワークの宛先を切り替えます。「最終宛先IP」と「今回調べるMACの持ち主」が同じか、別かを確かめます。','ARPで遠くの相手のMACをネットワーク全体へ問い合わせるわけではありません。','計算機科学入門 pp.53,56–59','remote,cached'],
['n05-dhcp','新しい端末が参加するたび、手作業でアドレスを設定しなくても使えるようにします。','端末が設定を求め、サーバーが候補を示し、要求と確認を経て貸し出します。割り当てられる数には上限があります。','接続6台に対し、プール4個という例を追います。問い合わせのやり取りができても、残りの端末へ貸すアドレスがない段階を確認します。','割り当て失敗を、必ず物理的な断線やDNSの問題だと決め付けないでください。','','clients,pool'],
['n06-ipv6','長いIPv6アドレスを省略して書いても、中の128ビットが減るわけではありません。','16進数の各組を補い、::の省略を0の組へ戻します。ネットワークの区切りはプレフィックス長で考えます。','2001:db8:1234::10を8組へ展開します。::に何組の0が入ったかを先に予想し、プレフィックス64の範囲と対応させます。','::は見た目を短くする表記です。可変長のアドレスを使っているという意味ではありません。','','ip,prefix'],
['n06-slaac','IPv6では、ルーターからの広告と、自分のアドレスの重複確認を分けます。','リンク内で使う候補を作り、重複を調べます。その後、ルーターが知らせるプレフィックスと経路の情報を別々に扱います。','ルーター広告をオフにしても、リンクローカル候補の確認は残ります。次にrouter lifetimeだけを0相当にして、アドレスとデフォルト経路を比べます。','アドレスが作れたことと、外へ出る経路があることは同じではありません。DADを全ての遠隔機器へ送るわけでもありません。','','router,lifetime'],
['n07-vlan','1台のスイッチを共有していても、来訪者と業務の通信を同じ範囲にしたくない場合があります。','VLANはリンク層のまとまりを論理的に分けます。別VLANへ渡すには、別途ネットワーク層の経路が必要になります。','端末AをVLAN10、Bを20へ置きます。同じ物理スイッチに見えても届かない状態から、VLAN間ルーティングを入れた違いを見ます。','VLAN名を変えただけで、全てのアクセス制御が完成したわけではありません。許可する通信の設計は別です。','','route,a,b'],
['n07-stp','故障に備えて線を増やすと、今度はフレームがぐるぐる回る構成になる場合があります。','冗長な物理接続を残しながら、通常の転送にはループのない木を使います。使う線と予備の線を分けます。','三角形につないだスイッチで、STPが使わない線を見ます。S1–S2を切ったとき、物理接続と論理的に使う経路がどう変わるか追います。','予備の線を通常時に使わないことは、ケーブルを物理的に抜くことと同じではありません。','','enabled,cut'],
['n08-routing','目的地まで複数の道があるとき、どれを選ぶか計算します。','リンクのコストを足し、各地点へ届く最小の値を更新していきます。選ばれた道だけでなく、候補の値の変化を見ます。','R1–R3のコストを低くした例を追い、そのリンクだけを高くします。何段目の更新から別ルートが有利になるか確認します。','Dijkstraで計算できることと、全ルーターが最新の情報を既に知っていることは別です。情報伝播は別単元で扱います。','計算機科学入門 p.51','cost,cut'],
['n08-prefix','経路表に/8と/24の両方が当てはまったとき、どちらの案内を使うでしょう。','宛先と共通する先頭ビットが最も長い経路を選びます。単に上から最初に一致した項目を使う規則とは異なります。','10.1.2.34に一致する候補を全て見ます。広い範囲の/8から、より細かな/24へ絞れる理由をビットの区切りで確認します。','プレフィックスが長いほど、含むアドレス範囲は小さくなります。「長い道」を意味する長さではありません。','計算機科学入門 pp.57–59','destination'],
['n08-bgp','インターネットの経路は、地理的な最短距離だけで決まるわけではありません。','この抜粋モデルでは、まずLOCAL_PREFという方針の値を比べ、その次にAS_PATHの長さを比べます。優先順位のある判断です。','ISP-AのLOCAL_PREFを変え、AS_PATH長が変わっていなくても選択先が変わるか見ます。どの条件が最初に差を付けたかを確認します。','BGPの全ての経路選択規則、運用方針、経路更新を実装しているわけではありません。','','preference'],
['n08-linkstate','ケーブルが切れた事実を、離れたルーターが同時に知るとは限りません。','変更を知った機器が隣へ知らせ、各機器が自分の持つ情報から経路を計算します。物理状態と知識の状態を分けます。','B–Dを切断した直後に止め、「新」「旧」と書かれた機器を見比べます。情報が1ホップずつ届くにつれ、その機器の経路が変わるところを追います。','表示のラウンドは教材の伝播段階です。実際のOSPF収束時間や全てのメッセージを表していません。','','cut'],
['n09-dns','移転先のIPへ変更したのに、しばらく前のIPが返ることがあります。','リゾルバーは、一度調べた答えを有効期限内だけ再利用できます。権威側の情報と、手元のキャッシュは別の状態です。','TTL60秒、経過30秒なら以前の答えがまだ有効です。経過を60秒以上へ進め、権威側へ問い合わせ直す段階で答えが変わることを確かめます。','変更が「全世界へ一斉に反映」される1個の時計があるわけではありません。今回は1つのリゾルバーだけを扱います。','計算機科学入門 pp.62–64','elapsed,ttl'],
['n10-transport','1台の端末でWebや別のアプリを同時に動かすと、受け取ったデータを区別する必要があります。','IPアドレスは端末間の配送、ポートはその端末内の通信の受け口を区別する情報です。TCPとUDPでは提供する仕組みも違います。','サーバー側ポート443を変えて、宛先の端末とアプリの識別を分けて見ます。TCPとUDPを切り替え、接続準備とデータ単位の違いを確認します。','ポート番号だけで実際のサービスや安全性が保証されるわけではありません。番号はそのアプリへの入口として使います。','計算機科学入門 pp.52–56','protocol,port'],
['n11-tcp','送ったデータの一部が届かず、その後のデータだけが先に届くことがあります。','受信したものと、順序どおりアプリへ渡せるものを分けます。確認応答と再送によって、空いた部分を埋めます。','DATA3を一度落とします。DATA4が届いた時点で止め、受信側が次に期待する位置を見ます。再送後に連続して渡せる範囲が広がることを追います。','DATAの教材番号と、TCPのバイト単位の順序番号を混同しないでください。固定タイムアウトモデルで、高速再送などは別です。','計算機科学入門 pp.53–54','loss,window'],
['n11-congestion','送る量が回線の処理能力を超えると、待ちや損失が増えます。','混雑に応じて送信量を増減する判断と、欠けたデータを送り直す判断を分けます。ここではReno系の考え方を抜粋しています。','送信窓が増える様子を見て、指定ラウンドで損失を検出させます。窓がどれだけ戻り、その後どのように増えるかを比較します。','この窓は輻輳への対応です。受信側のバッファ残量だけを表す受信窓と同じものではありません。','','lossAt,mode'],
['n12-nat','複数の端末が1つの公開IPを使っても、戻ってきた応答を元の端末へ渡したいとします。','アドレスとポートを変換し、内側の通信と外側の通信の対応を表に残します。戻りはその対応を使います。','内部端末を4台にして、同じ宛先443へ送ります。外側のポートの違いと、変換表で元の端末へ戻せることを確認します。','NATは暗号化ではありません。変換することだけで通信内容が読めなくなるわけではありません。','計算機科学入門 p.59','clients'],
['n13-http','1つのデータが途中で失われると、別の画像の受取りも止まるのでしょうか。','HTTPの多重化と、それを運ぶトランスポートの順序保証を分けます。HTTP/3はQUICを使うため、HTTP/2と同じ接続モデルではありません。','同じオブジェクト数・RTT・損失条件で方式だけを変えます。object2の損失の後、他のオブジェクトが待つ範囲を比べます。','これは接続済みの固定RTTモデルです。実サイトでの速度の優劣を無条件で決めるベンチマークではありません。','計算機科学入門 pp.54–55,59','protocol,loss'],
['n13-cache','以前の応答を使えば、同じ内容をもう一度全て送ってもらわずに済むかもしれません。','まだ新鮮なキャッシュを使う場合と、期限後に変更の有無を再確認する場合を分けます。304なら手元の本文を使います。','max-age60秒、経過80秒で期限が切れた例を見ます。サーバーの内容が変わっていない場合と変わった場合で、本文が再送されるか確認します。','304は新しい本文が送られてきたという意味ではありません。使う本文はキャッシュ側にあります。','計算機科学入門 pp.55,62','changed,age'],
['n14-lb','同じサービスを複数台で提供するとき、要求をどの台へ送るか決めます。','順番に振り分ける方針と、接続数の少ない台を選ぶ方針を比べます。停止中の台を候補から外す判断も別に必要です。','まず3台へ要求を割り当てます。Bだけを停止した場合に、残る2台へどう振り分けるか見ます。既存の接続数の違いにも注目します。','台数を増やすだけで、障害検知やデータの整合性まで自動で解決するわけではありません。','','down,algorithm'],
['n15-mail','メールを送信サーバーが受け取ったことと、相手が読んだことは別です。','配送の各段階で、どのサーバーが何を受理したかを確認します。一時エラーと最終的な失敗も区別して考えます。','正常なSMTP配送を追った後、受信サーバーの一時エラーを入れます。どの応答まで済んでいて、どの処理がまだ終わっていないかを確認します。','この固定フローで受理と読了は結び付けません。受信者の実際の閲覧状況は示していません。','計算機科学入門 p.55','fail'],
['n15-ssh','秘密の認証情報を送る前に、接続しているサーバーが期待した相手か確認します。','サーバーのホスト鍵についての記録と、今回提示された鍵を比べます。利用者の本人確認とは別の方向の確認です。','ホスト鍵が以前の記録と一致する場合を追い、異なる設定へ切り替えます。ユーザー認証の前に止まる理由を考えます。','鍵が変わった理由を、この教材だけで攻撃と断定しません。安全な経路での確認が必要な状態として扱います。','','fail'],
['n15-websocket','サーバーから新しい情報が来るたび、毎回新しい要求を送る必要があるでしょうか。','ここではHTTP/1.1のUpgradeの後、接続を保って両方向にメッセージを送る流れを見ます。','接続準備と、その後の通知を分けて追います。通知後に接続を閉じる条件へ変え、次の通知にも同じ接続を使えるか考えます。','接続を保つことは、永久に切れないことではありません。切断や再接続への対応は別に必要です。','','fail'],
['n15-ntp','相手の時計が進んでいるのか、通信に時間がかかったのかを分けたいとします。','送信と受信の4つの時刻から、往復遅延と時刻差を推定します。今回は往路と復路が対称な条件です。','サーバーの時計のずれを120ms、片道遅延を30msとする例で、各時刻を順に置きます。遅延だけを変えても推定するずれが同じか確認します。','実際には非対称な遅延や時計の変動があり、この1回の計算だけで正確な時刻が保証されるわけではありません。','','offset,delay'],
['n16-queue','届く仕事の方が処理する仕事より多いと、待ち行列は増えます。','到着、容量による受入れ・破棄、処理の順序を分けます。バッファは待てる数を増やしますが、処理能力を増やしません。','毎単位8個到着し5個処理する例を追います。容量24へ達した後、どれが破棄されるか見ます。容量を増やした場合は待ちも確認します。','破棄を減らしただけで性能問題がなくなったとは限りません。長い待ち時間という別の問題が残る場合があります。','','arrival,service'],
['n16-qos','同じ回線を音声とファイル転送が使うとき、待ち方を変えたい場合があります。','優先キューは取り出す順番を変えます。総処理能力やバッファ容量を増やすものではありません。','到着順から音声優先へ切り替え、音声の平均待ち時間を比べます。そのときファイル転送側に何が起きるかも同時に見ます。','送信できたものの平均だけで、破棄されたものや待ち続けるものを隠さないようにします。','','policy'],
['n17-wifi','同じ無線の場所で、多くの端末が同時に送りたいとします。','送信機会を共有すると、同時送信の競合と、送信を控える待ちの両方が生じます。今回は確率で表した小さな共有媒体モデルです。','seedを固定したまま端末数を増やし、成功・競合・空きの割合を比べます。次に送信を控える大きさだけを変えてみます。','802.11の全CSMA/CAや電波伝搬、隠れ端末を再現したものではありません。実際のWi-Fi設定値への推奨ではありません。','','stations,backoff'],
['n18-diagnose','「つながらない」という同じ症状にも、違う原因があります。','観測した事実から、まだ考えられる原因と除ける原因を分けます。最初に決め付けず、証拠の段階を追います。','シナリオ番号を固定して、名前解決・経路・証明書・アクセス規則・処理能力の候補を比べます。理由を予想してから候補を選び、整合する証拠を確認します。','用意された5種類の架空障害です。現実のネットワークがこの5種類だけで診断できるわけではありません。','','guess'],
['n19-mqtt','データを確実に届けようとして再送すると、同じ要求が2回届く場合があります。','送信者とBroker間の確認のやり取りを、QoSごとに比べます。配送の保証と、アプリ側の処理を1回にすることは分けます。','QoS1でACKが失われた例を追います。送信側からは未確認でもBrokerには届いている場合があることを見ます。QoS0・2とも比べてください。','QoSのラベルだけで、複数区間の全処理が1回だけになると考えないでください。教材の対象は送信者→Brokerです。','','qos,loss'],
['n20-tunnel','すでにあるパケットを別のパケットへ包むと、全体のサイズが増えます。','内側のサイズに外側の追加情報を足し、経路が運べる最大サイズMTUと比べます。外側IPの条件も確認します。','内側1450Bに80Bを足すと1530Bです。MTU1500Bに収まらないので、内側を小さくした場合や外側IPの条件を切り替えて確かめます。','IPv4とIPv6の断片化を同じ規則で扱いません。トンネルで包むこと自体が暗号化を意味するわけでもありません。','','inner,mtu']
]);

/* Security lessons use only fictitious assets and local teaching models. */
(() => {
'use strict';
CSL.defineLessons([
['s01-threat','内容を暗号化しても、サービスが止まれば必要な時に使えません。何を守りたいのでしょう。','見られないこと、勝手に変えられないこと、必要な時に使えることを分けます。対策と守る性質を対応させます。','暗号化をオンにしたまま機器を止めます。内容を読めるかという結果と、利用できるかという結果が同じでないことを確認します。','1つの対策で全ての脅威を防いだと考えません。この表の条件以外の脅威もあり得ます。','計算機科学入門 p.66','encryption,integrity'],
['s02-mod','時計のように、一定の数で一周する計算を考えます。','法mで割った余りが同じなら同じ位置です。掛けて余り1にできる相手が乗法の逆元です。','法17で7を考えると、7×5=35は17で割って余り1になります。値や法を変え、逆元が見つからない組も試します。','剰余の世界では、0以外なら必ず割り算できるとは限りません。法との関係を確かめます。','','a,modulus'],
['s02-euclid','大きな2つの数の共通の約数を、余りを使って小さい問題へ変えます。','aをbで割った余りrについて、gcd(a,b)=gcd(b,r)です。余りが0になるまで繰り返します。','240=46×5+10、46=10×4+6…と、割る数と余りが次の組になるところを追います。最後の0でない余りが答えです。','商が最大公約数ではありません。各行で、次に使う数を取り違えないようにします。','','a,b'],
['s03-aes','暗号文を読めなくするだけでなく、途中で変えられていないかも確かめます。','認証付き暗号は暗号化と検証を組み合わせます。正しい鍵でも、暗号文やタグが変われば検証に失敗します。','最初は改ざんなしで復号します。平文と鍵を固定したまま暗号文の1ビットを変え、読める別の文が出るのではなく、検証が拒否することを見ます。','固定鍵とnonceは比較専用です。実用途で同じ鍵とnonceを再利用しないでください。秘密情報を入力する場所ではありません。','計算機科学入門 p.66','tamper,message'],
['s04-hash','文書が少し変わったかを、固定長の値で比較します。','入力からSHA-256の値を計算します。同じ入力は同じ値になりますが、値から本文を復号する方式ではありません。','文字列の最初の1ビットだけを変えます。入力の変化量と出力の変化を並べて見て、元の文をそのまま短縮表示したのではないことを確認します。','この1例だけで暗号学的な安全性や衝突の不存在を証明したことにはなりません。','','flip'],
['s04-hmac','公開のハッシュを計算し直せる相手に対し、共有鍵を知る側の検証を加えます。','HMACはメッセージと秘密鍵から認証用の値を計算します。受信側も同じ鍵を使い、受信内容との一致を調べます。','balance=100と架空の鍵でHMACを作ります。受信内容だけを1ビット変え、検証値が一致しなくなることを見ます。','共有鍵を持つ双方が作成できるので、公開鍵署名と同じ第三者への証明になるわけではありません。','','flip,key'],
['s04-signature','検証する人へ秘密鍵を渡さず、文書と署名の関係を確かめたいとします。','秘密鍵で署名し、対応する公開鍵で検証します。署名対象の文書が変わると、同じ署名では検証できません。','架空の文書へ署名して検証した後、末尾に!だけを追加します。文書が変わった段階と、公開鍵で拒否される段階を追います。','署名値が毎回同じになるとは限りません。公開鍵が本当に誰のものかという信頼の問題は、別に扱います。','計算機科学入門 p.66','tamper'],
['s05-dh','秘密の数を直接送らずに、両端で共通の値を作ります。','各自の秘密から公開する値を作り、相手の公開値と自分の秘密を使って計算します。両側が同じ剰余べき乗へ至ります。','Aliceの秘密とBobの秘密を別々に確認し、線の上を渡る値だけを追います。最後に両側の計算値が一致することを見ます。','小さい法23は計算の説明用で秘密性はありません。DHだけで相手の本人確認も済んだわけではありません。','','a,b'],
['s05-rsa','公開してよい鍵と、戻すために必要な鍵を別に持ちます。','教材では整数を剰余べき乗して暗号文相当の整数へ変え、別の指数で戻します。文字そのものを直接計算していません。','65という整数を公開鍵側で変換し、秘密鍵側の指数で戻します。入力を1つ変え、同じ規則で復元できるか確かめます。','n=3233、パディングなしの教科書的計算です。安全な暗号システムの実装として使ってはいけません。','','message'],
['s06-tls','鍵を共有できた相手が、アクセスしたかったサイトだとはまだ限りません。','証明書の名前、有効期間、信頼のつながり、秘密鍵の所持を別々に確かめます。失敗した段階より先へは進みません。','正常なフローを確認してから「名前が一致」だけをオフにします。鍵の話とは別に、接続したい名前を検証する必要があることを見ます。','この画面はTLS1.3の基本フローを抜粋した判定モデルです。実際の証明書を検証したり実サーバーへ接続したりしません。','計算機科学入門 pp.53–55,66','hostname,trusted'],
['s07-password','保存先のデータが見られたとき、パスワードがそのまま読める状態を避けます。','saltと反復処理を使って保存用の値を作ります。saltが違うと、同じ架空パスワードでも保存値が変わります。','AとBに同じパスワードを設定し、saltを共通にする場合と別にする場合を比べます。何を秘密にするのか、何を値と一緒に保持するのかも確認します。','教材の反復回数と固定saltは実サービスの推奨ではありません。実際のパスワードを入力しないでください。','','sameSalt'],
['s07-mfa','パスワードだけが知られても、別の確認を求めることで防げる場合があります。','認証に使う要素と、どの相手に対して確認したかを分けます。追加要素があることだけで全て同じ耐性にはなりません。','追加要素の検証に成功した条件を固定し、別サイト経由の中継を想定します。OTPとパスキーの概念モデルが、どの条件を見るかを比べます。','この固定条件から、現実の全ての実装が安全または危険だと判断しないでください。登録、回復、運用も別に必要です。','','kind,phishing'],
['s07-ratelimit','試行を厳しく制限すると、不正な試行だけでなく正しい利用者も待つことがあります。','連続失敗のしきい値と、一定時間のロックを別に考えます。正しい認証情報を受け入れられる時刻も見ます。','3回失敗で10秒ロックする例で、正規利用者が5秒後に試します。制限なしの場合と、誤試行・正規利用者の両方の結果を比べます。','一時ロックは万能な解決ではありません。正しい利用者の利用を妨げる側面もあります。ここでは架空の1アカウントだけを扱います。','','enabled,userTime'],
['s08-access','ログインした人でも、他人のデータを消してよいとは限りません。','認証は誰かを確かめること、認可はその人にその対象への操作を許すか決めることです。役割・所有者・拒否規則を分けます。','memberが他人のデータへwriteする例で、どの条件が不足するか見ます。自分のデータへ変えた場合や明示的拒否がある場合と比べます。','画面のボタンを隠すだけで、サーバー側の権限検証が不要になるわけではありません。','','owner,role'],
['s09-session','ログアウト後も、期限の残ったトークンが正しい署名を持っている場合があります。','署名の検証、有効期限、サーバーが持つ失効情報を別々に見ます。自己完結の検証だけでは失効を知らない場合があります。','期限60、現在30、ログアウト済みの例で、JWT方式の失効照会をオン・オフします。サーバーセッション方式とも比較します。','署名が正しいことと、今も利用を許可していることは同じではありません。','','strategy,revocationCheck'],
['s09-oauth','別のサービスへ権限を渡すとき、途中のコードを取り違えたり横取りされたりしないようにします。','認可コードの発行とアクセストークンの取得は別段階です。redirect URI、state、PKCEは異なる対応関係を検証します。','正常なコード交換を追った後、PKCEだけを失敗させます。コードを持っているだけで交換できないことを確認します。','OAuthの認可と、OIDCの本人確認を同じ言葉としてまとめないでください。この固定モデルは全仕様の実装ではありません。','','pkce,state'],
['s10-cors','ブラウザで「応答を読めない」とき、要求自体も送られていないのでしょうか。','要求を送れたか、サーバーが処理を許したか、JavaScriptへ応答を公開するかを分けます。preflightがある場合は送信前の段階も加わります。','別オリジンの単純GETで許可ヘッダーがない例を見ます。次にJSON POSTへ変え、送信前の確認が失敗した場合との違いを確かめます。','CORSはサーバーの認可の代わりではありません。応答が読めなくても副作用のある要求まで必ず防げるとは限りません。','','request,allowOrigin'],
['s11-sql','文字として扱うはずの入力が、SQLの構造の一部になると問題が起きます。','コードとデータの境界を保つ必要があります。この教材は入力を結合する場合と、パラメーターとして渡す場合を条件で比べます。','構文を含む入力を想定したまま、パラメーター化だけを切り替えます。入力の文字そのものではなく、渡し方で何が変わるか見ます。','実DBへ攻撃を送る画面ではありません。パラメーター化でも、別途の認可や業務ルールは必要です。','','parameterized'],
['s11-xss','利用者の文章を表示したいだけなのに、ブラウザが命令として解釈すると問題になります。','HTMLのどの文脈へ入れるかに応じて、データをコードとして解釈させない扱いをします。CSPは別の制限として重ねます。','実行可能なHTMLを含むという架空条件を固定し、テキスト文脈でのエスケープを切り替えます。CSPの拒否と、入力の扱いの修正を分けて見ます。','このエスケープ方法を、JavaScriptやURLなど別の文脈にも無条件で使えるとは限りません。','','escape,csp'],
['s11-csrf','ログイン中のブラウザが、利用者の意図しないサイトから要求を送る場合を考えます。','Cookieが自動で付くことと、利用者が操作を意図したことは別です。追加の検証やCookieの送信条件を確認します。','外部サイトからPOSTする固定例で、トークン照合がない場合を見ます。トークンやSameSiteの条件を変え、どの段階で拒否するか比べます。','CORSで応答を読めないことだけでは、この問題を防いだことになりません。','','token,sameSite'],
['s11-ssrf','サーバーにURLを取得させる機能が、利用者から直接行けない場所への経路になる場合があります。','URLを入力できる相手と、そのURLへ実際にアクセスする主体は別です。サーバーの到達範囲と許可先を確認します。','内部アドレスを指定する固定例で、完全一致の許可先制限を切り替えます。利用者の端末ではなく、サーバーから送る矢印を見てください。','この例は許可先の概念を表す条件モデルです。実際の名前解決、リダイレクト、URL解析の全てを検証するものではありません。','','allowlist'],
['s11-path','ファイル名に見える入力でも、解釈すると許可したフォルダの外を指す場合があります。','パスを正規化してから、本当に許可した範囲内か確認します。見た目の文字列と、指している対象を分けます。','範囲外を指す入力を想定し、正規化後の許可ルート照合をオンにします。入力を受け付けることと、対象へアクセスを許すことを比べます。','実環境ではシンボリックリンクや競合なども検討が必要です。この固定判定だけでファイル処理全体の安全を保証しません。','','normalize'],
['s12-firewall','同じ通信へ複数のルールが一致した場合、どれが採用されるでしょうか。','このモデルは上から見て最初に一致したルールを使います。ルールの内容だけでなく並ぶ順番を確認します。','externalから443への通信を見た後、先頭にHTTPS拒否を追加します。後ろに許可があっても結論が変わる理由を追います。','first-matchという今回の規則を、すべての機器やポリシーエンジンへ一般化しないでください。','','blockHttps,zone'],
['s13-permission','640や755の数字は、誰がどの操作をできるかをまとめたものです。','所有者、グループ、その他の3組に分け、それぞれで読み・書き・実行のビットを見ます。','640を選び、ownerの6を4+2として読み書きへ分けます。otherへ立場を変えると、同じファイルでも選ぶビットの組が変わります。','ここでは通常ファイルの基本rwxだけです。ディレクトリの意味、ACL、特権などの全条件は扱いません。','計算機科学入門 pp.35–37','who,operation'],
['s14-buffer','書き込む長さが範囲内でも、既に解放した場所なら安全ではありません。','領域の境界と生存期間を別々に検査します。どのセルまで使ってよいか、そもそも使える領域かを確認します。','8セルへ12セルを書こうとする例を見ます。長さを8へ減らした後で解放済みをオンにし、別の理由で拒否が必要なことを確認します。','仮想セルの判定実験です。実行中のブラウザのメモリを破壊するコードを実行するものではありません。','','length,freed'],
['s15-pipeline','テストが通っていても、権限の設計や秘密情報の混入を見落とす場合があります。','検査には得意な対象と範囲があります。静的解析、依存照合、回帰テスト、レビューを問題に対応させます。','混入する問題をpermissionにしたままレビューを切り替えます。同じ検査セットで別の問題へ変えると、検出する段階も違うことを見ます。','固定の検出表を使う教材です。実際のソース解析を実行して、脆弱性を網羅的に検出しているわけではありません。','','issue,review'],
['s16-cloud','公開設定と利用者の権限が重なると、意図せず読める範囲が広がる場合があります。','主体の権限、保存領域の公開、明示的拒否を別々に評価します。暗号化の有無とは違うアクセス境界です。','権限noneでも保存領域が公開の例を見ます。公開を止めた場合と明示的拒否を加えた場合で、どの条件が結論を変えるか確かめます。','架空のIAM規則です。特定クラウドの全権限モデルをそのまま再現したものではありません。','','public,deny'],
['s17-detection','警告を多く出せば見逃しは減るかもしれませんが、正常なものにも警告が出ます。','実際のラベルと予測を組み合わせて4つに分けます。警告のうち当たった割合と、異常のうち見つけた割合は分母が違います。','同じ100件の合成データで、しきい値だけを下げます。新しく警告へ移ったものが正常か異常かを確認してから、適合率と再現率を比べます。','しきい値が低いほど常に優れた検知器というわけではありません。見逃しと誤警告のコストも考えます。','','threshold'],
['s18-incident','別の機器のログを時刻順に並べるだけで、出来事の順序を正しく読めるでしょうか。','記録された時刻と実際の時刻はずれる場合があります。発生源と既知の補正を明示して、時系列を組み直します。','APIの時計を8秒ずらした例で、AuthとAuditの記録との順序を見ます。補正をオンにして、順序が変わる理由を確認します。','時間が近いだけで因果関係が証明されたわけではありません。この教材は既知のずれを使い、未知のずれを魔法のように推定しません。','','correct,skew'],
['s19-backup','バックアップがあっても、最後の保存以降のデータや復旧までの時間が問題になります。','戻せる時点と、再び使えるまでの時間を分けます。復元の時間だけでなく検証も含めて考えます。','15分ごとに保存し52分で障害なら、直前は45分です。失われる範囲7分と、復元10分＋検証5分の所要時間を区別します。','同じ破損でバックアップも失う場合があります。存在していることだけでなく、隔離や正常性を確かめます。','','interval,isolated'],
['s20-update','正しい相手が作った更新でも、古い脆弱な版へ戻してよいとは限りません。','対象機器の一致、署名の検証、バージョンの条件を別々に確認します。1つ成功しても残りを省略しません。','署名は正しいまま、古い版へ戻す条件をオンにします。署名の失敗とは違う理由で受入れを止めることを見ます。','署名検証の真偽はこのモデルへの入力です。実際のファームウェアを解析・更新する機能ではありません。','計算機科学入門 pp.65–66','rollback,signature'],
['s21-anonymity','名前を消しても、年齢と地域の組み合わせが1人だけなら誰か分かるかもしれません。','直接識別する情報と、組み合わせで絞り込む情報を分けます。値を粗くすると、同じ組に入る人数が変わります。','12人の架空データで実年齢を10歳刻みに変えます。1人だけの組が残るか確認し、次に地域を伏せた場合と比べます。','同じ組の人数が増えただけで、あらゆる再識別や情報推測を防いだとは言えません。','','generalize,hideZip'],
['s22-human','見慣れた形式のメールでも、急いで秘密や送金を求められたら確認が必要です。','予期した連絡か、機密を求めるか、急がせるかを分けます。メッセージ内ではない独立した連絡先での確認を考えます。','予期しない・機密要求・急ぎという条件を見て、独立した確認の有無を切り替えます。どの情報で判断を変えたかを説明します。','これらの特徴があるだけで、特定の現実のメールを攻撃と断定するものではありません。','','confirmed'],
['s23-sharing','1人に全部を預けず、複数の共有片が集まった時に復元する計算を考えます。','この例では有限体上の直線を2点から決め、切片を秘密として読みます。復元に使った点と計算を対応させます。','法17の教材で2つの共有片を集め、切片9を復元します。1つしか集めない場合との違いを確認します。','係数7を公開固定したため、これは秘密性を持つ実用実装ではありません。復元計算の説明だけを目的にしています。','','count'],
['s23-zk','秘密の通路を知ることを、通路の秘密を直接見せずに確かめる類推です。','知らない人が偶然要求に応じられる確率と、繰り返したときの確率を分けます。独立した確認を重ねる前提があります。','秘密を知らない条件で5回確認します。実際の合成試行の成功回数と、全部を偶然通る理論確率1/2⁵を区別して見ます。','洞窟の類推であり、実用的なゼロ知識プロトコルの完全性・健全性・ゼロ知識性を証明する実装ではありません。','','rounds'],
['s23-migration','暗号方式を移行するとき、安全性だけでなく交換するデータ量や環境も検討します。','公開鍵、暗号文、署名のサイズを別々に足し、回線速度で割って単純な転送時間を求めます。','仮定したサイズ1200+1100+2500=4800Bを、10Mbpsで運ぶ時間を計算します。署名サイズだけを増やして影響を比べます。','ここに入力する数は特定方式の公称値ではありません。耐量子暗号の演算や安全性を検証しているわけでもありません。','','signature,bandwidth'],
['s24-ai','AIが読む外部文書に、権限を使う指示が混ざっていたらどうすべきでしょう。','未信頼の文章、機密を読む権限、外部へ送る権限、外側の許可判断を分けます。読める内容を命令として実行する必要はありません。','外部送信の指示を含む架空文書で、送信ツールの権限だけを外します。モデルの判断への期待と、外部ポリシーで拒否する方法を比べます。','実際のLLMを呼ぶ実験ではありません。この固定条件だけで全てのプロンプトインジェクションを防げるとは言いません。','','send,guard']
]);

['x06-response','すぐに復旧を急ぐと、原因や影響を調べるための証拠を失う場合があります。','証拠保全、認証情報の失効、隔離、復元元の検証、原因修正を分けます。それぞれが何を守るかを確認します。','隔離と失効だけが済んだ条件を見ます。復元元を検証しないまま復旧する案、原因を直さない案と、残る問題を比べます。','これは架空の条件演習です。現実のインシデントでは影響と緊急度に応じた専門的な対応が必要です。','','evidence,verified'],

['x08-research','結果が違っても、何を変えたためなのか分からなければ比較できません。','変える条件とそろえる条件を分け、繰り返し、測るもの、モデルの限界を明示します。','seedが42と43で、同時に3条件を変えた例を見ます。seedをそろえて変更を1条件へ減らし、比較の説明がどう変わるか考えます。','この設計チェックに通ったことは統計的な結論の証明ではありません。入力や回答は、この画面を離れると消えます。','','changed,repeats']

/* A disposable, deterministic step player. No DOM, storage or model-time mutation. */
(() => {
  'use strict';
  CSL.createPlayer = ({onChange = () => {}, schedule = (fn, ms) => setTimeout(fn, ms), cancel = id => clearTimeout(id), interval = 1000} = {}) => {
    let length = 0, index = 0, playing = false, speed = 1, timer = null, generation = 0, disposed = false;
    const snapshot = () => ({length, index, playing, speed, canPlay: length > 1});
    const emit = () => { if (!disposed) onChange(snapshot()); };
    const clear = () => { generation++; if (timer !== null) cancel(timer); timer = null; };
    const pause = (notify = true) => { clear(); playing = false; if (notify) emit(); };
    const queue = () => {
      const ownGeneration = generation;
      timer = schedule(() => {
        timer = null;
        if (disposed || !playing || ownGeneration !== generation) return;
        index = Math.min(index + 1, length - 1);
        if (index >= length - 1) playing = false;
        emit();
        if (playing && !disposed && ownGeneration === generation) queue();
      }, interval / speed);
    };
    const seek = value => {
      if (disposed) return;
      pause(false);
      const n = Number(value);
      if (Number.isFinite(n)) index = Math.max(0, Math.min(Math.trunc(n), Math.max(0, length - 1)));
      emit();
    };
    return {
      get state() { return snapshot(); },
      configure(count, position = 0) {
        if (disposed) return;
        pause(false);
        length = Number.isFinite(Number(count)) ? Math.max(0, Math.trunc(Number(count))) : 0;
        index = Math.max(0, Math.min(Math.trunc(Number(position)) || 0, Math.max(0, length - 1)));
        emit();
      },
      play() {
        if (disposed || length < 2) return false;
        if (playing) { pause(); return false; }
        clear();
        if (index >= length - 1) index = 0;
        playing = true;
        const ownGeneration = generation;
        emit();
        if (playing && !disposed && ownGeneration === generation) queue();
        return true;
      },
      pause: () => pause(),
      seek,
      step: delta => seek(index + Number(delta)),
      setSpeed(value) {
        const next = Number(value);
        if (!Number.isFinite(next) || next < 0.25 || next > 8 || disposed) return;
        speed = next;
        clear();
        emit();
        if (playing) queue();
      },
      dispose() { pause(false); disposed = true; }
    };
  };
})();

function formatParam(ctrl,v){
 if(ctrl.type==='toggle')return v?'オン':'オフ';
 if(ctrl.type==='select')return ctrl.options.find(o=>String(o.value)===String(v))?.label??v;
 return typeof v==='object'?JSON.stringify(v):String(v??'');
}

}).filter(Boolean).join(' / ');
function control(ctrl,params){
 const id='p-'+ctrl.key,v=params[ctrl.key],help=ctrl.help?`<div class="control-help" id="help-${id}">${h(ctrl.help)}</div>`:'',aria=ctrl.help?`aria-describedby="help-${id}"`:'';
 if(ctrl.type==='toggle')return `<div class="control"><label class="toggle-label" for="${id}"><span>${h(ctrl.label)}</span><input type="checkbox" data-param="${ctrl.key}" id="${id}"${v?' checked':''} ${aria}><span class="toggle-switch"></span></label>${help}</div>`;
 if(ctrl.type==='range'){
  let max=ctrl.max;if(A.current?.lab.id==='c01-bits'&&ctrl.key==='value')max=2**params.width-1;
  return `<div class="control"><div class="control-label"><label for="${id}">${h(ctrl.label)}</label></div><div class="range-number"><input type="number" inputmode="decimal" id="num-${id}" data-number="${ctrl.key}" aria-label="${h(ctrl.label)}の数値" min="${ctrl.min}" max="${max}" step="${ctrl.step}" value="${v}"><span>${h(ctrl.unit)}</span></div><input id="${id}" type="range" data-param="${ctrl.key}" min="${ctrl.min}" max="${max}" step="${ctrl.step}" value="${v}" ${aria}><div class="range-scale"><span>${ctrl.min}${h(ctrl.unit)}</span><span data-range-max="${ctrl.key}">${max}${h(ctrl.unit)}</span></div>${help}</div>`;
 }
 if(ctrl.type==='select')return `<div class="control"><label class="control-label" for="${id}">${h(ctrl.label)}</label><select id="${id}" data-param="${ctrl.key}" ${aria}>${ctrl.options.map(o=>`<option value="${h(o.value)}"${String(o.value)===String(v)?' selected':''}>${h(o.label)}</option>`).join('')}</select>${help}</div>`;

 return `<div class="control text-control"><label class="control-label" for="${id}">${h(ctrl.label)}</label><input type="text" id="${id}" data-param="${ctrl.key}" value="${h(v)}" spellcheck="false" autocomplete="off" ${aria}>${help}</div>`;
}

ntrols">${lab.controls.map(ctrl=>control(ctrl,params)).join('')}</div>${lab.engine==='git'?gitTools():''}<div class="control-footer">${A.button('入力を反映','apply','check','primary')}${A.button('初期条件に戻す','reset','reset','ghost')}</div><p class="input-status" id="input-status" role="status"></p></section><section class="panel visual-panel" id="visual-panel" aria-label="実験の可視化"><div class="visual-toolbar"><h2>${h(lab.title)}</h2><span class="frame-count" id="frame-count">計算中</span>${A.button('条件を変える','conditions-focus','settings','sm mobile-conditions')}</div>${lab.engine==='builder'?builderTools():''}<div class="viz-stage"><div class="visualization" id="visualization" tabindex="0" aria-label="実験の図。大きな図はスクロールできます。"><div class="empty-state">モデルを計算しています…</div></div><div id="result-pending" class="result-pending" hidden>新しい条件を反映しています</div></div><div id="node-inspection"></div><div class="mobile-scroll-hint">図が収まらない場合は、図の中をスクロールできます。</div><div class="player" id="player"><p class="direct-hint" id="direct-hint" hidden>${icon('settings',16)}この実験は入力に応じてその場で結果が変わります。再生操作は不要です。</p><div class="player-sequence" id="player-sequence"><div class="player-controls"><button type="button" class="btn icon-only ghost" data-action="first" aria-label="最初の手順へ">${icon('reset',16)}</button><button type="button" class="btn icon-only" data-action="back" aria-label="1ステップ戻る">${icon('back',16)}</button><button type="button" class="btn play primary" data-action="play" id="play-button" aria-pressed="false">${icon('play',14)} 最初から再生</button><button type="button" class="btn icon-only" data-action="next" aria-label="1ステップ進む">${icon('next',16)}</button><button type="button" class="btn ghost" data-action="last" aria-label="最後の状態へ">結果へ ${icon('arrow',16)}</button><label class="speed-control"><span>表示速度</span><select id="play-speed" aria-label="再生速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></label></div><div class A.paintRange=el=>{
 const lo=Number(el.min),hi=Number(el.max),v=Number(el.value);
 const ratio=hi>lo?Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100)):0;
 el.style.setProperty('--range-fill',ratio+'%');
};
A.syncControls=()=>{
 const c=A.current;if(!c)return;
 for(const ctrl of c.lab.controls){
  const field=document.getElementById('p-'+ctrl.key);if(!field)continue;
  if(ctrl.type==='toggle')field.checked=c.params[ctrl.key];
  else if(field!==document.activeElement||field.type==='range')field.value=c.params[ctrl.key];
  const number=document.getElementById('num-p-'+ctrl.key);if(number&&number!==document.activeElement)number.value=c.params[ctrl.key];
 }
 if(c.lab.id==='c01-bits'){
  const max=2**c.params.width-1;document.getElementById('p-value').max=max;document.getElementById('num-p-value').max=max;document.querySelector('[data-range-max="value"]').textContent=max;
 }
 document.querySelectorAll('#controls input[type=range]').forEach(A.paintRange);
 const defaults=L.validateParams(c.lab,c.lab.defaults),variant=L.validateParams(c.lab,{...c.lab.defaults,...c.lab.exploration.patch});
 document.querySelectorAll('[data-action="example"]').forEach(el=>{const target=el.dataset.example==='variant'?variant:defaults;el.setAttribute('aria-pressed',String(JSON.stringify(c.params)===JSON.stringify(target)));});
};
A.inputStatus=message=>{const el=document.getElementById('input-status');if(el)el.textContent=message;};
A.markPending=()=>{
 const c=A.current;if(!c)return;
 const stale=c.dirty||c.pending;
 const overlay=document.getElementById('result-pending');if(overlay){overlay.hidden=!stale;overlay.textContent=c.pending?'計算しています…':'入力が変わりました。前の結果は比較に使用できません。';}
 document.getElementById('visual-panel')?.setAttribute('aria-busy',String(c.pending));
 document.getElementById('visualization')?.classList.toggle('outdated',stale);
 document.getElementById('inspector')?.classList.toggle('outdated',stale);
 A.updatePlayer();
};
A.runCurrent=async(options={})=>{
 // Legacy boolean callers in the topology tools mean "show the final state".
 if(typeof options==='boolean')options={position:options?'last':'start'};
 const c=A.current;if(!c)return false;
 A.stop();clearTimeout(A.parameterTimer);

A.updatePlayer=()=>{
 const c=A.current;if(!c)return;

 const sequence=document.getElementById('player-sequence'),hint=document.getElementById('direct-hint');if(sequence)sequence.hidden=direct;if(hint)hint.hidden=!direct;
 const play=document.getElementById('play-button');if(play){
  play.disabled=c.pending||!!c.error||(!c.dirty&&!ready)||len===1;
  play.setAttribute('aria-pressed',String(c.playing));
  const label=c.playing?'一時停止':c.dirty?'条件を反映して再生':c.index===len-1&&len>1?'もう一度再生':c.index>0?'ここから再生':'最初から再生';
  play.innerHTML=icon(c.playing?'pause':'play',14)+' '+label;
 }
 for(const [action,edge]of [['first',c.index===0],['back',c.index===0],['next',c.index>=len-1],['last',c.index>=len-1]]){
  const el=document.querySelector(`[data-action="${action}"]`);if(el)el.disabled=!ready||len<2||edge;
 }
 const sc=document.getElementById('scrubber');if(sc){sc.disabled=!ready||len<2;sc.max=Math.max(1,len-1);sc.value=c.index;A.paintRange(sc);}
 const pos=document.getElementById('step-position');if(pos)pos.textContent=len?`${c.index+1} / ${len}`:'—';
 const speed=document.getElementById('play-speed');if(speed)speed.disabled=!ready||len<2;
 document.querySelectorAll('[data-action="baseline"]').forEach(el=>el.disabled=!ready);
 const first=document.getElementById('frame-count');if(first&&c.result&&!c.error&&!c.dirty&&!c.pending)first.textContent=len===1?'入力で更新':`${c.playing?'再生中':'手順'} ${c.index+1} / ${len}`;
};

A.parameter=(key,value,{immediate=false,code=false}={})=>{
 const c=A.current;if(!c||!c.lab.controls.some(x=>x.key===key))return;
 if(c.params[key]===value){
  // Clearing a numeric field marks the old result stale. Pasting the same valid
  // value back must still re-enable the experiment rather than leaving it dirty.
  if(c.dirty&&!code){clearTimeout(A.parameterTimer);A.parameterTimer=setTimeout(()=>{if(A.current===c)A.runCurrent();},immediate?0:240);}
  return;
 }
 c.token++;c.pending=false;c.dirty=true;c.error=null;c.example='custom';c.params[key]=value;
 c.params=L.validateParams(c.lab,c.params);if(c.lab.id==='c01-bits')c.params.value=Math.min(c.params.value,2**c.params.width-1);
 A.stop();A.syncControls();clearTimeout(A.parameterTimer);A.markPending();A.renderDetails();
 A.inputStatus(code?'未反映の変更があります。「入力を反映」を押してください。':'条件を変更しました。入力を反映します…');
 if(code)return;
 A.parameterTimer=setTimeout(()=>{if(A.current===c)A.runCurrent();},immediate?0:240);
};
A.example=async kind=>{
 const c=A.current;if(!c)return;clearTimeout(A.parameterTimer);A.stop();
 const ticket=++c.token;c.pending=true;c.dirty=false;c.error=null;A.markPending();
 try{
  const base=c.initialResult||await L.run(c.lab,c.lab.defaults);
  if(A.current!==c||c.token!==ticket)return;
  c.initialResult=base;c.baseline={params:clone(c.lab.defaults),metrics:clone(base.metrics),frames:clone(base.frames),label:'初期条件 A'};
  c.params=L.validateParams(c.lab,kind==='variant'?{...c.lab.defaults,...c.lab.exploration.patch}:c.lab.defaults);
  c.pending=false;c.dirty=true;c.example=kind;c.answer=null;c.graded=false;A.syncControls();
  const applied=await A.runCurrent({autoplay:true});
  if(A.current!==c||!applied||c.example!==kind)return;
  document.querySelectorAll('[data-action="example"]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.example===kind)));
  A.toast(kind==='variant'?`B：${c.lab.exploration.label}。Aとの比較も確認できます。`:'初期条件Aで試しています。');
 }catch{
  if(A.current!==c||c.token!==ticket)return;
  c.params=L.validateParams(c.lab,kind==='variant'?{...c.lab.defaults,...c.lab.exploration.patch}:c.lab.defaults);c.pending=false;A.syncControls();await A.runCurrent();
 }
};

 if(e.key===' '){e.preventDefault();A.play();}
 if(e.key==='ArrowLeft'){e.preventDefault();A.step(-1);}
 if(e.key==='ArrowRight'){e.preventDefault();A.step(1);}
});
// Pointer events change only the teaching canvas, never a real network.
let drag=null;
document.addEventListener('pointerdown',e=>{
 // Ignore only the synthetic click belonging to the previous drag, not a new gesture.
 suppressNodeClick=false;
 if(e.target.id==='scrubber'){A.stop();return;}
 const node=e.target.closest?.('[data-node]');if(!node||A.current?.lab.engine!=='builder'||e.button!==0)return;
 guard(()=>{
  const svg=node.ownerSVGElement,top=L.parseTopology(A.current.params.topology),nd=top.nodes.find(n=>n.id===node.dataset.node);if(!nd)return;
  drag={current:A.current,id:nd.id,svg,node,top,startX:e.clientX,startY:e.clientY,moved:false,pointer:e.pointerId};node.setPointerCapture?.(e.pointerId);
 });
});
document.addEventListener('pointermove',e=>{
 if(!drag||e.pointerId!==drag.pointer||drag.current!==A.current)return;
 const bounds=drag.svg.getBoundingClientRect(),dx=(e.clientX-drag.startX)*760/bounds.width,dy=(e.clientY-drag.startY)*400/bounds.height;
 if(Math.abs(dx)+Math.abs(dy)<5&&!drag.moved)return;
 if(!drag.moved){const n=drag.top.nodes.find(n=>n.id===drag.id);drag.originalX=n.x;drag.originalY=n.y;}
 drag.moved=true;e.preventDefault();
 const nd=drag.top.nodes.find(n=>n.id===drag.id);nd.x=L.clamp(drag.originalX+dx,55,690);nd.y=L.clamp(drag.originalY+dy,55,325);
 drag.node.setAttribute('transform',`translate(${nd.x},${nd.y})`);
 drag.svg.querySelectorAll('[data-edge]').forEach(g=>{
  const ed=drag.top.edges[+g.dataset.edge],a=drag.top.nodes.find(n=>n.id===ed.a),b=drag.top.nodes.find(n=>n.id===ed.b);
  g.querySelectorAll('line').forEach(l=>{l.setAttribute('x1',a.x);l.setAttribute('y1',a.y);l.setAttribute('x2',b.x);l.setAttribute('y2',b.y);});
 });
});
document.addEventListener('pointerup',e=>{
 if(!drag||e.pointerId!==drag.pointer)return;const d=drag;drag=null;
 if(d.current!==A.current)return;
 if(d.moved){suppressNodeClick=true;A.current.selected=d.id;guard(()=>A.setTopology(d.top));setTimeout(()=>suppressNodeClick=false,150);}
});
document.addEventListener('pointercancel',()=>{if(drag){drag=null;A.renderFrame();}});
window.addEventListener('hashchange',()=>{drag=null;A.navigate();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)A.stop();});
window.addEventListener('pagehide',()=>A.stop());
function start(){A.shell();A.navigate();A.ready=true;}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script></body></html>
