R('gc',p=>{
 const ids=['A','B','C','D','E'];const roots=String(p.roots).split(/[\s,]+/).filter(Boolean);
 if(roots.some(x=>!ids.includes(x)))throw Error('根はA〜Eをカンマで区切ってください。空欄では根がありません。');
 const edges=[['A','B'],['B','C'],['C','B'],['D','E'],['E','D'],...(p.bridge?[['C','D']]:[])].map(([a,b])=>({a,b}));
 const seen=new Set(),frames=[],work=[...new Set(roots)],swept=new Set();
 const picture=active=>({type:'network',directed:true,active,nodes:ids.map((id,i)=>({id,label:`${id} · ${swept.has(id)?'回収':seen.has(id)?'印あり':'未到達'}`,x:[130,360,590,300,530][i],y:i<3?110:280})),edges:clone(edges),detail:`根: ${roots.join(', ')||'なし'} / 灰色待ち行列: ${work.join(', ')||'空'}`});
 frames.push(F('根から到達できるものを探す','参照数ではなく、根からたどって到達できるかで判定します。DとEは互いを参照しています。',picture(null)));
 while(work.length){const id=work.pop();if(seen.has(id))continue;seen.add(id);for(const e of edges)if(e.a===id&&!seen.has(e.b))work.push(e.b);frames.push(F(`${id}に印を付ける`,'参照先を探索します。既に印があるものは再び探索しないので、循環があっても終了します。',picture(id),{'到達した数':seen.size}));}
 for(const id of ids)if(!seen.has(id)){swept.add(id);frames.push(F(`${id}を回収する`,'Markが終了した後、印のないオブジェクトをSweepします。互いを参照する循環も、根から到達できなければ回収対象です。',picture(id)));}
 frames.push(F('回収後のヒープ','この教材は停止型のMark & Sweepです。並行GC・世代別GC・移動・弱参照は含めません。',{type:'cells',rows:[{label:'保持',values:[...seen].sort().length?[...seen].sort():['なし']},{label:'回収',values:[...swept].length?[...swept]:['なし']}]}));
 return out(frames,{'オブジェクト数':5,'保持':seen.size,'回収':swept.size});
});

R('branchpredict',p=>{
 const outcomes=String(p.pattern).replace(/[\s,]/g,'').toUpperCase();if(!/^[TN]{1,40}$/.test(outcomes))throw Error('T（分岐する）とN（しない）を1〜40個入力してください。');

 for(const actual of outcomes){const predicted=p.method==='static'?false:p.method==='one'?last:counter>=2;const bad=predicted!==(actual==='T');wrong+=Number(bad);const before=counter;counter=Math.max(0,Math.min(3,counter+(actual==='T'?1:-1)));last=actual==='T';rows.push([rows.length+1,predicted?'T':'N',actual,bad?'外れ':'的中']);frames.push(F(`予測 ${predicted?'T':'N'} → 実際 ${actual}`,p.method==='two'?`2ビットカウンタ ${before} → ${counter}。2以上をTと予測し、結果の方向へ1段だけ変更します。`:'予測結果を実際の分岐と照合します。予測が外れたときの回復を、固定の追加コストで表します。',{type:'cells',rows:[{label:'予測方式',values:[p.method==='two'?'2ビット飽和':p.method==='one'?'直前の結果':'常にN']},{label:'予測 / 実際',values:[predicted?'T':'N',actual]},{label:'カウンタ',values:[counter]}]},{'予測外れ':wrong},{headers:['回','予測','実際','結果'],rows:clone(rows)}));}

});

 const ops=p.operations.toUpperCase().split(/[\s,]+/).filter(Boolean);if(!ops.length||ops.length>30||ops.some(x=>!['P','C'].includes(x)))throw Error('P（生産）とC（消費）を1〜30個、カンマで入力してください。');

R('linkstate',p=>{
 const ids=['A','B','C','D','E'],coords=[[100,180],[290,90],[290,290],[500,180],[680,180]],base=[['A','B',2],['A','C',4],['B','C',2],['B','D',2],['C','D',3],['D','E',1]].map(([a,b,cost])=>({a,b,cost}));
 const updated=clone(base);updated[0].cost=p.cost;updated[3].off=p.cut;
 // Both endpoints of the changed B-D link originate the same abstract version here.
 const known=new Set(p.cut?['A','B','D']:['A','B']),frames=[];
 const view=()=>({type:'network',nodes:ids.map((id,i)=>({id,label:`${id} · ${known.has(id)?'新':'旧'}`,x:coords[i][0],y:coords[i][1]})),edges:clone(updated),detail:'新 / 旧 は、この教材のリンク情報の版です。'});
 for(let roundId=0;roundId<6;roundId++){const rows=ids.map(id=>{const db=known.has(id)?updated:base,r=L.shortest(ids,db,id,'E');return[id,known.has(id)?'新しい情報':'古い情報',r.path.join(' → ')||'なし',Number.isFinite(r.dist.E)?r.dist.E:'到達不可'];});frames.push(F(`情報伝達 ${roundId} ホップ後`,'物理的なリンクの変更と、全ルーターが変更を知る時刻を区別します。知っているリンク情報から、各ルーターが自分の経路を計算します。',view(),{'更新済み':known.size},{headers:['ルーター','情報の版','Eへの経路','コスト'],rows}));
  const next=new Set(known);for(const e of updated)if(!e.off){if(known.has(e.a))next.add(e.b);if(known.has(e.b))next.add(e.a);}if(next.size===known.size)break;for(const id of next)known.add(id);

  const sent=[];for(let i=0;i<p.capacity&&queue.length;i++){let idx=p.policy==='priority'?queue.findIndex(x=>x.kind==='voice'):0;if(idx<0)idx=0;const item=queue.splice(idx,1)[0],wait=t-item.at;sent.push(item.kind==='voice'?'音声':'転送');if(item.kind==='voice'){voice++;delayVoice+=wait;}else{bulk++;delayBulk+=wait;}}

/* A disposable, deterministic step player. No DOM, storage or model-time mutation. */
(() => {
  'use strict';
  CSL.createPlayer = ({onChange = () => {}, schedule = (fn, ms) => setTimeout(fn, ms), cancel = id => clearTimeout(id), interval = 1000} = {}) => {
    let length = 0, index = 0, playing = false, speed = 1, timer = null, generation = 0, disposed = false;
    const snapshot = () => ({length, index, playing, speed, canPlay: length > 1});
    const emit = () => { if (!disposed) onChange(snapshot()); };
    const clear = () => { generation++; if (timer !== null) cancel(timer); timer = null; };
    const pause = (notify = true) => { clear(); playing = false; if (notify) emit(); };
    const queue = () => {
      const ownGeneration = generation;
      timer = schedule(() => {
        timer = null;
        if (disposed || !playing || ownGeneration !== generation) return;
        index = Math.min(index + 1, length - 1);
        if (index >= length - 1) playing = false;
        emit();
        if (playing && !disposed && ownGeneration === generation) queue();
      }, interval / speed);
    };
    const seek = value => {
      if (disposed) return;
      pause(false);
      const n = Number(value);
      if (Number.isFinite(n)) index = Math.max(0, Math.min(Math.trunc(n), Math.max(0, length - 1)));
      emit();
    };
    return {
      get state() { return snapshot(); },
      configure(count, position = 0) {
        if (disposed) return;
        pause(false);
        length = Number.isFinite(Number(count)) ? Math.max(0, Math.trunc(Number(count))) : 0;
        index = Math.max(0, Math.min(Math.trunc(Number(position)) || 0, Math.max(0, length - 1)));
        emit();
      },
      play() {
        if (disposed || length < 2) return false;
        if (playing) { pause(); return false; }
        clear();
        if (index >= length - 1) index = 0;
        playing = true;
        const ownGeneration = generation;
        emit();
        if (playing && !disposed && ownGeneration === generation) queue();
        return true;
      },
      pause: () => pause(),
      seek,
      step: delta => seek(index + Number(delta)),
      setSpeed(value) {
        const next = Number(value);
        if (!Number.isFinite(next) || next < 0.25 || next > 8 || disposed) return;
        speed = next;
        clear();
        emit();
        if (playing) queue();
      },
      dispose() { pause(false); disposed = true; }
    };
  };
})();

A.paintRange=el=>{
 const lo=Number(el.min),hi=Number(el.max),v=Number(el.value);
 const ratio=hi>lo?Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100)):0;
 el.style.setProperty('--range-fill',ratio+'%');
};
A.syncControls=()=>{
 const c=A.current;if(!c)return;
 for(const ctrl of c.lab.controls){
  const field=document.getElementById('p-'+ctrl.key);if(!field)continue;
  if(ctrl.type==='toggle')field.checked=c.params[ctrl.key];
  else if(field!==document.activeElement||field.type==='range')field.value=c.params[ctrl.key];
  const number=document.getElementById('num-p-'+ctrl.key);if(number&&number!==document.activeElement)number.value=c.params[ctrl.key];
 }
 if(c.lab.id==='c01-bits'){
  const max=2**c.params.width-1;document.getElementById('p-value').max=max;document.getElementById('num-p-value').max=max;document.querySelector('[data-range-max="value"]').textContent=max;
 }

};

A.updatePlayer=()=>{
 const c=A.current;if(!c)return;

 const sequence=document.getElementById('player-sequence'),hint=document.getElementById('direct-hint');if(sequence)sequence.hidden=direct;if(hint)hint.hidden=!direct;
 const play=document.getElementById('play-button');if(play){
  play.disabled=c.pending||!!c.error||(!c.dirty&&!ready)||len===1;
  play.setAttribute('aria-pressed',String(c.playing));
  const label=c.playing?'一時停止':c.dirty?'条件を反映して再生':c.index===len-1&&len>1?'もう一度再生':c.index>0?'ここから再生':'最初から再生';
  play.innerHTML=icon(c.playing?'pause':'play',14)+' '+label;
 }
 for(const [action,edge]of [['first',c.index===0],['back',c.index===0],['next',c.index>=len-1],['last',c.index>=len-1]]){
  const el=document.querySelector(`[data-action="${action}"]`);if(el)el.disabled=!ready||len<2||edge;
 }
 const sc=document.getElementById('scrubber');if(sc){sc.disabled=!ready||len<2;sc.max=Math.max(1,len-1);sc.value=c.index;A.paintRange(sc);}
 const pos=document.getElementById('step-position');if(pos)pos.textContent=len?`${c.index+1} / ${len}`:'—';
 const speed=document.getElementById('play-speed');if(speed)speed.disabled=!ready||len<2;
 document.querySelectorAll('[data-action="baseline"]').forEach(el=>el.disabled=!ready);
 const first=document.getElementById('frame-count');if(first&&c.result&&!c.error&&!c.dirty&&!c.pending)first.textContent=len===1?'入力で更新':`${c.playing?'再生中':'手順'} ${c.index+1} / ${len}`;
};

A.parameter=(key,value,{immediate=false,code=false}={})=>{
 const c=A.current;if(!c||!c.lab.controls.some(x=>x.key===key))return;
 if(c.params[key]===value){
  // Clearing a numeric field marks the old result stale. Pasting the same valid
  // value back must still re-enable the experiment rather than leaving it dirty.
  if(c.dirty&&!code){clearTimeout(A.parameterTimer);A.parameterTimer=setTimeout(()=>{if(A.current===c)A.runCurrent();},immediate?0:240);}
  return;
 }
 c.token++;c.pending=false;c.dirty=true;c.error=null;c.example='custom';c.params[key]=value;
 c.params=L.validateParams(c.lab,c.params);if(c.lab.id==='c01-bits')c.params.value=Math.min(c.params.value,2**c.params.width-1);
 A.stop();A.syncControls();clearTimeout(A.parameterTimer);A.markPending();A.renderDetails();
 A.inputStatus(code?'未反映の変更があります。「入力を反映」を押してください。':'条件を変更しました。入力を反映します…');
 if(code)return;
 A.parameterTimer=setTimeout(()=>{if(A.current===c)A.runCurrent();},immediate?0:240);
};
A.example=async kind=>{
 const c=A.current;if(!c)return;clearTimeout(A.parameterTimer);A.stop();
 const ticket=++c.token;c.pending=true;c.dirty=false;c.error=null;A.markPending();
 try{
  const base=c.initialResult||await L.run(c.lab,c.lab.defaults);
  if(A.current!==c||c.token!==ticket)return;
  c.initialResult=base;c.baseline={params:clone(c.lab.defaults),metrics:clone(base.metrics),frames:clone(base.frames),label:'初期条件 A'};
  c.params=L.validateParams(c.lab,kind==='variant'?{...c.lab.defaults,...c.lab.exploration.patch}:c.lab.defaults);
  c.pending=false;c.dirty=true;c.example=kind;c.answer=null;c.graded=false;A.syncControls();
  const applied=await A.runCurrent({autoplay:true});
  if(A.current!==c||!applied||c.example!==kind)return;
  document.querySelectorAll('[data-action="example"]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.example===kind)));
  A.toast(kind==='variant'?`B：${c.lab.exploration.label}。Aとの比較も確認できます。`:'初期条件Aで試しています。');
 }catch{
  if(A.current!==c||c.token!==ticket)return;
  c.params=L.validateParams(c.lab,kind==='variant'?{...c.lab.defaults,...c.lab.exploration.patch}:c.lab.defaults);c.pending=false;A.syncControls();await A.runCurrent();
 }
};

/* User events. No recording, imports, local sessions or learning-history hooks. */
(() => {
'use strict';
const L=CSL,A=L.app;
function action(name,el){
 const c=A.current;
 switch(name){
  case 'skip-main': {const main=document.getElementById('main');main?.focus({preventScroll:true});main?.scrollIntoView({block:'start'});return;}
  case 'search':return A.openSearch();
  case 'home-query':{const input=document.getElementById('home-query');if(input){input.value=el.dataset.query||'';A.homeSearch(input.value);input.focus();}return;}
  case 'glossary':return A.showGlossary();
  case 'term':return A.showGlossary(el.dataset.term,el.dataset.lab);
  case 'close-modal':return A.closeModal();
  case 'menu':{const side=document.getElementById('sidebar'),open=!side.classList.contains('open');side.classList.toggle('open',open);document.getElementById('drawer-shade').classList.toggle('open',open);el.setAttribute('aria-expanded',String(open));return;}
  case 'play':return A.play();
  case 'first':return A.seek(0);
  case 'back':return A.step(-1);
  case 'next':return A.step(1);
  case 'last':return A.seek((c?.result?.frames.length||1)-1);
  case 'apply':return A.runCurrent();
  case 'reset':if(c){c.params=L.clone(c.lab.defaults);c.answer=null;c.graded=false;c.selected=null;c.connectFrom=null;c.example='initial';A.syncControls();return A.runCurrent();}return;
  case 'baseline':return A.baseline();
  case 'restore-baseline':if(c?.baseline){c.params=L.clone(c.baseline.params);A.syncControls();return A.runCurrent();}return;
  case 'delete-baseline':if(c){c.baseline=null;A.renderDetails();A.toast('今回の比較をクリアしました。');}return;
  case 'example':return A.example(el.dataset.example);
  case 'show-compare':A.stop();A.setTab('compare');return A.focusDetails();
  case 'model-tab':A.stop();A.setTab('model');return A.focusDetails();
  case 'conditions-focus':document.querySelector('.controls-panel')?.scrollIntoView({behavior:A.settings.reduceMotion?'instant':'smooth',block:'start'});return;
  case 'guide-focus':A.setMode('guided');document.getElementById('starter-guide')?.scrollIntoView({behavior:A.settings.reduceMotion?'instant':'smooth'});return;
  case 'grade':return A.grade();
  case 'guided':return A.setMode('guided');
  case 'git-command':if(c){c.params.script=(c.params.script||'').trimEnd()+'\n'+el.dataset.command;A.syncControls();return A.runCurrent({position:'last'});}return;
  case 'add-node':return A.addNode(el.dataset.kind);
  case 'remove-node':return A.removeNode();
  case 'connect-nodes':if(c){if(!c.selected)return A.toast('接続元の機器を先に選んでください。');c.connectFrom=c.selected;A.builderHint();}return;
 }
}
const guard=fn=>{try{const promise=fn();if(promise?.catch)promise.catch(error=>A.toast(error.message,true));}catch(error){A.toast(error.message,true);}};
let suppressNodeClick=false;
document.addEventListener('click',e=>{
 const target=e.target;if(!target?.closest)return;
 if(target.closest('#drawer-shade')){A.closeDrawer();return;}
 if(target.matches('[data-backdrop]')){A.closeModal();return;}
 const mode=target.closest('[data-mode]');if(mode){A.setMode(mode.dataset.mode);return;}
 const tab=target.closest('[data-tab]');if(tab){A.setTab(tab.dataset.tab);return;}
 const filter=target.closest('[data-filter]');if(filter){A.filter(filter.dataset.filter,filter.dataset.value);return;}
 const answer=target.closest('[data-answer]');if(answer&&A.current){A.current.answer=+answer.dataset.answer;A.current.graded=false;A.renderDetails();return;}
 const frame=target.closest('[data-frame]');if(frame){A.seek(Number(frame.dataset.frame));return;}
 const bit=target.closest('[data-bit]');if(bit&&A.current?.lab.id==='c01-bits'){
  const c=A.current,power=c.params.width-1-Number(bit.dataset.bit);A.parameter('value',Number(c.params.value)^(2**power),{immediate:true});return;
 }
 const node=target.closest('[data-node]');if(node){if(suppressNodeClick){suppressNodeClick=false;return;}guard(()=>A.nodeClick(node.dataset.node));return;}
 const edge=target.closest('[data-edge]');if(edge&&A.current?.lab.engine==='builder'){
  guard(()=>{const v=L.parseTopology(A.current.params.topology),ed=v.edges[+edge.dataset.edge];if(ed){ed.off=!ed.off;A.setTopology(v);}});return;
 }
 const cmd=target.closest('[data-action]');if(cmd){if(cmd.tagName==='A')e.preventDefault();guard(()=>action(cmd.dataset.action,cmd));return;}
 const link=target.closest('[data-close-modal]');if(link){const hash=link.hash;A.closeModal();if(hash===location.hash)A.navigate();}
});
function numericInput(el,commit=false){
 if(!A.current)return;
 if(el.value.trim()===''||!Number.isFinite(Number(el.value))){
  const c=A.current;A.stop();clearTimeout(A.parameterTimer);c.token++;c.pending=false;c.dirty=true;c.error=null;A.markPending();A.renderDetails();
  A.inputStatus('数値を入力し、Enterまたは入力欄の外を押して確定してください。');
  if(commit){el.value=A.current.params[el.dataset.number];A.runCurrent();A.toast('数値を入力できなかったため、直前の値に戻しました。',true);}
  return;
 }
 A.parameter(el.dataset.number,Number(el.value),{immediate:commit});
 if(commit)el.value=A.current.params[el.dataset.number];
}
function fieldInput(el){
 const ctrl=A.current?.lab.controls.find(c=>c.key===el.dataset.param);if(!ctrl)return;
 let value=ctrl.type==='toggle'?el.checked:ctrl.type==='range'?Number(el.value):el.value;
 if(ctrl.type==='select')value=ctrl.options.find(x=>String(x.value)===el.value)?.value??ctrl.value;
 A.parameter(el.dataset.param,value,{immediate:['toggle','select','range'].includes(ctrl.type),code:ctrl.type==='code'});
}
document.addEventListener('input',e=>{
 const el=e.target;
 if(el.id==='global-search'){A.updateSearch(el.value);return;}
 if(el.id==='home-query'){A.homeSearch(el.value);return;}
 if(el.id==='catalog-query'){A.catalogSearch(el.value);return;}
 if(el.id==='scrubber'){A.seek(Number(el.value));return;}
 if(el.dataset.compareStep){A.selectCompareStep(el.dataset.compareStep,el.value);return;}
 if(el.dataset.number){numericInput(el);return;}
 if(el.dataset.param)fieldInput(el);
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.id==='scrubber'){A.seek(Number(el.value));return;}
 if(el.dataset.compareStep){A.selectCompareStep(el.dataset.compareStep,el.value);return;}
 if(el.dataset.number){numericInput(el,true);return;}
 if(el.dataset.param){fieldInput(el);return;}
 if(el.dataset.filterSelect){A.filter(el.dataset.filterSelect,el.value);return;}
 if(el.id==='play-speed')A.current?.player?.setSpeed(Number(el.value));
 if(el.id==='reduce-motion'){A.settings.reduceMotion=el.checked;document.body.classList.toggle('reduce-motion',el.checked);}
});
document.addEventListener('submit',e=>{
 if(e.target.id==='catalog-search'){e.preventDefault();A.catalogSearch(new FormData(e.target).get('q')||'');}
 if(e.target.id==='home-search-form'){
  e.preventDefault();const q=String(new FormData(e.target).get('q')||'').trim();location.hash='/catalog'+(q?'?q='+encodeURIComponent(q):'');
 }
});
document.addEventListener('keydown',e=>{
 const modal=document.querySelector('.modal');
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();A.openSearch();return;}
 if(e.key==='Escape'){A.closeModal();A.closeDrawer();if(A.current){A.current.connectFrom=null;A.builderHint();}return;}
 if(modal){
  if(e.key==='Tab'){
   const focusables=[...modal.querySelectorAll('a[href],button:not(:disabled),input,select,textarea,[tabindex="0"]')].filter(x=>!x.hidden&&x.offsetParent!==null);
   if(!focusables.length){e.preventDefault();return;}const first=focusables[0],last=focusables.at(-1);
   if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  }
  if(e.key==='Enter'&&e.target.id==='global-search'){const link=modal.querySelector('a.search-result');if(link){e.preventDefault();link.click();}}return;
 }
 if(e.target.dataset.number&&e.key==='Enter'){e.preventDefault();numericInput(e.target,true);return;}
 if(e.target.closest('input,textarea,select,[contenteditable="true"]'))return;
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-node],[data-edge]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));return;}
 if(!A.current||e.target.closest('button,a'))return;
 if(e.key===' '){e.preventDefault();A.play();}
 if(e.key==='ArrowLeft'){e.preventDefault();A.step(-1);}
 if(e.key==='ArrowRight'){e.preventDefault();A.step(1);}
});
// Pointer events change only the teaching canvas, never a real network.
let drag=null;
document.addEventListener('pointerdown',e=>{
 // Ignore only the synthetic click belonging to the previous drag, not a new gesture.
 suppressNodeClick=false;
 if(e.target.id==='scrubber'){A.stop();return;}
 const node=e.target.closest?.('[data-node]');if(!node||A.current?.lab.engine!=='builder'||e.button!==0)return;
 guard(()=>{
  const svg=node.ownerSVGElement,top=L.parseTopology(A.current.params.topology),nd=top.nodes.find(n=>n.id===node.dataset.node);if(!nd)return;
  drag={current:A.current,id:nd.id,svg,node,top,startX:e.clientX,startY:e.clientY,moved:false,pointer:e.pointerId};node.setPointerCapture?.(e.pointerId);
 });
});
document.addEventListener('pointermove',e=>{
 if(!drag||e.pointerId!==drag.pointer||drag.current!==A.current)return;
 const bounds=drag.svg.getBoundingClientRect(),dx=(e.clientX-drag.startX)*760/bounds.width,dy=(e.clientY-drag.startY)*400/bounds.height;
 if(Math.abs(dx)+Math.abs(dy)<5&&!drag.moved)return;
 if(!drag.moved){const n=drag.top.nodes.find(n=>n.id===drag.id);drag.originalX=n.x;drag.originalY=n.y;}
 drag.moved=true;e.preventDefault();
 const nd=drag.top.nodes.find(n=>n.id===drag.id);nd.x=L.clamp(drag.originalX+dx,55,690);nd.y=L.clamp(drag.originalY+dy,55,325);
 drag.node.setAttribute('transform',`translate(${nd.x},${nd.y})`);
 drag.svg.querySelectorAll('[data-edge]').forEach(g=>{
  const ed=drag.top.edges[+g.dataset.edge],a=drag.top.nodes.find(n=>n.id===ed.a),b=drag.top.nodes.find(n=>n.id===ed.b);
  g.querySelectorAll('line').forEach(l=>{l.setAttribute('x1',a.x);l.setAttribute('y1',a.y);l.setAttribute('x2',b.x);l.setAttribute('y2',b.y);});
 });
});
document.addEventListener('pointerup',e=>{
 if(!drag||e.pointerId!==drag.pointer)return;const d=drag;drag=null;
 if(d.current!==A.current)return;
 if(d.moved){suppressNodeClick=true;A.current.selected=d.id;guard(()=>A.setTopology(d.top));setTimeout(()=>suppressNodeClick=false,150);}
});
document.addEventListener('pointercancel',()=>{if(drag){drag=null;A.renderFrame();}});
window.addEventListener('hashchange',()=>{drag=null;A.navigate();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)A.stop();});
window.addEventListener('pagehide',()=>A.stop());
function start(){A.shell();A.navigate();A.ready=true;}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script></body></html>
